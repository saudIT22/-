<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نبّاه · المقارنة القطاعية</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="nabbah-design.css" rel="stylesheet">
<style>
  :root{--bg:#070b09;--panel:#101a15;--panel2:#0e1712;--line:#1d2c24;--mint:#10b981;--mint-deep:#0b8457;--gold:#f5b301;--red:#ef4444;--orange:#f97316;--txt:#e8f1ec;--txt-soft:#8ba396;--txt-mute:#5c6f66;}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--txt);line-height:1.7;min-height:100vh;background-image:radial-gradient(ellipse 800px 400px at 15% -5%,rgba(16,185,129,.06),transparent)}
  a{text-decoration:none;color:inherit}
  header{position:sticky;top:0;z-index:40;background:rgba(7,11,9,.85);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .head-in{max-width:820px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:19px;color:#fff}
  .brand .bell{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--mint),var(--mint-deep));display:grid;place-items:center;font-size:17px;transform:rotate(-6deg)}
  .btn{display:inline-flex;align-items:center;gap:7px;font-weight:700;cursor:pointer;border-radius:11px;font-size:13.5px;padding:9px 15px;background:var(--panel);color:var(--txt-soft);border:1px solid var(--line)}
  .wrap{max-width:820px;margin:0 auto;padding:24px 18px 70px}
  h1{font-size:22px;font-weight:900;display:flex;align-items:center;gap:9px;margin-bottom:4px}
  .sub{font-size:13px;color:var(--txt-soft);margin-bottom:22px}
  .hero{background:linear-gradient(135deg,rgba(16,185,129,.1),transparent);border:1px solid rgba(16,185,129,.3);border-radius:18px;padding:22px 24px;margin-bottom:18px;text-align:center}
  .hero .pos{font-size:22px;font-weight:900;margin-bottom:6px}
  .hero .ps{font-size:13px;color:var(--txt-soft)}
  .metric{background:linear-gradient(180deg,rgba(255,255,255,.028),rgba(255,255,255,.008));border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:18px;margin-bottom:12px}
  .m-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .m-h .ml{font-size:15px;font-weight:800}
  .m-h .badge{font-size:11px;padding:3px 11px;border-radius:6px;font-weight:800}
  .m-bars{position:relative}
  .m-row{display:flex;align-items:center;gap:12px;margin-bottom:8px}
  .m-row .lbl{font-size:11.5px;width:70px;color:var(--txt-soft);flex-shrink:0}
  .m-row .track{flex:1;height:22px;background:var(--panel2);border-radius:6px;overflow:hidden;position:relative}
  .m-row .fill{height:100%;border-radius:6px;display:flex;align-items:center;padding:0 10px;font-size:12px;font-weight:800;font-family:'Inter';color:#fff}
  .disclaimer{background:rgba(245,179,1,.06);border:1px solid rgba(245,179,1,.2);border-radius:10px;padding:11px 15px;font-size:11.5px;color:var(--gold);margin-top:16px}
  .spin{width:32px;height:32px;border:3px solid var(--line);border-top-color:var(--mint);border-radius:50%;animation:sp 1s linear infinite;margin:50px auto}@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header>
  <div class="head-in">
    <a class="brand" href="company-dashboard.html"><span class="bell">🔔</span>نبّاه</a>
    <a class="btn" href="company-command-center.html">🎛️ مركز القيادة</a>
  </div>
</header>
<div class="wrap">
  <h1>📐 المقارنة القطاعية</h1>
  <div class="sub">أين تقف شركتك مقابل متوسط قطاعك — نقاط قوتك وفرص التحسين.</div>

  <div id="loading"><div class="spin"></div></div>
  <div id="content" style="display:none">
    <div id="heroBox"></div>
    <div id="metricsList"></div>
    <div class="disclaimer" id="disclaimer"></div>
  </div>
</div>
<script>
const TOKEN=localStorage.getItem("nabbah_token")||"";
if(!TOKEN) window.location.href="login.html";
async function api(p){
  const r=await fetch(p,{headers:{"Authorization":"Bearer "+TOKEN}});
  if(r.status===401){ localStorage.removeItem("nabbah_token"); window.location.href="login.html"; throw new Error("جلسة"); }
  const d=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.detail||"خطأ");
  return d;
}
const fmt=n=>(Math.round(n)||0).toLocaleString("en-US");
async function load(){
  try{
    const d=await api("/company/benchmark");
    document.getElementById("loading").style.display="none";
    document.getElementById("content").style.display="block";
    if(!d.has_data){
      document.getElementById("content").innerHTML=`<div style="text-align:center;padding:60px;color:var(--txt-mute)">${d.message||"لا بيانات كافية"}</div>`;
      return;
    }
    const pcol=d.position_score>=75?"#10b981":(d.position_score>=50?"#f5b301":"#f97316");
    document.getElementById("heroBox").innerHTML=`<div class="hero">
      <div class="pos" style="color:${pcol}">${d.position}</div>
      <div class="ps">مقارنة بقطاع «${d.sector_name}» · ${d.position_score}% من مؤشراتك فوق المعيار</div>
    </div>`;

    document.getElementById("metricsList").innerHTML=d.metrics.map(m=>{
      const good=m.status==="above";
      const col=good?"#10b981":"#f97316";
      const badge=good?'<span class="badge" style="background:rgba(16,185,129,.14);color:#10b981">فوق المعيار</span>':'<span class="badge" style="background:rgba(249,115,22,.14);color:#f97316">دون المعيار</span>';
      // نحسب عرض الأشرطة نسبياً
      const maxV=Math.max(m.my,m.benchmark)*1.15;
      const myW=Math.min(Math.round(m.my/maxV*100),100);
      const bmW=Math.min(Math.round(m.benchmark/maxV*100),100);
      return `<div class="metric">
        <div class="m-h"><div class="ml">${m.label}</div>${badge}</div>
        <div class="m-bars">
          <div class="m-row"><span class="lbl">شركتك</span><div class="track"><div class="fill" style="width:${myW}%;background:${col}">${fmt(m.my)}${m.unit==='%'?'%':''}</div></div></div>
          <div class="m-row"><span class="lbl">القطاع</span><div class="track"><div class="fill" style="width:${bmW}%;background:#3a4a42">${fmt(m.benchmark)}${m.unit==='%'?'%':''}</div></div></div>
        </div>
        <div style="text-align:left;font-size:11.5px;color:${col};margin-top:6px;font-weight:700">${good?'▲':'▼'} ${Math.abs(m.pct)}% ${good?'أفضل من':'دون'} متوسط القطاع</div>
      </div>`;
    }).join("");
    document.getElementById("disclaimer").textContent="⚠️ "+(d.disclaimer||"");
  }catch(e){
    document.getElementById("loading").innerHTML='<p style="text-align:center;color:var(--red)">'+e.message+'</p>';
  }
}
load();
</script>
<script src="i18n.js"></script>
<script src="nabbah-sidebar.js"></script>
</body>
</html>
