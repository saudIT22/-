[pytest]
# NABBAH — إعداد الاختبارات
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    slow: اختبارات بطيئة
    integration: اختبارات تكامل تحتاج قاعدة بيانات
    unit: اختبارات وحدة نقية
# حماية: نضمن وضع الاختبار
env =
    TESTING=true
    ENVIRONMENT=development
