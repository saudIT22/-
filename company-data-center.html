<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>نبّاه · مركز البيانات</title>
<link href="nabbah-design.css" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{background:var(--bg,#070b09);color:var(--txt,#e8f1ec);font-family:Tajawal,Tahoma,Arial,sans-serif;margin:0}
  .wrap{max-width:1180px;margin:0 auto;padding:70px 16px 60px}
  h1{margin:0 0 4px;font-size:24px}.sub{color:var(--txt-soft,#8ba396);margin:0 0 18px;font-size:14px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
  .tile,.panel{background:var(--panel,#101a15);border:1px solid var(--line,#1d2c24);border-radius:14px;padding:14px}
  .tile .l{font-size:12px;color:var(--txt-soft,#8ba396)}.tile .v{font-size:24px;font-weight:800;margin-top:4px}
  .btn{background:var(--mint,#10b981);color:#062b1c;border:0;border-radius:10px;padding:9px 15px;font-weight:800;cursor:pointer;font:inherit;font-size:13px}
  .btn.ghost{background:transparent;color:var(--txt,#e8f1ec);border:1px solid var(--line,#1d2c24);font-weight:600}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  select,input[type=file]{background:var(--panel,#101a15);color:var(--txt,#e8f1ec);border:1px solid var(--line,#1d2c24);border-radius:10px;padding:8px 10px;font:inherit;font-size:13px}
  .steps{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;font-size:12px;color:var(--txt-soft,#8ba396)}
  .steps span{padding:4px 10px;border:1px solid var(--line,#1d2c24);border-radius:20px}
  .steps span.on{color:var(--mint,#10b981);border-color:var(--mint,#10b981)}
  table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px;border-bottom:1px solid var(--line,#1d2c24);text-align:start}
  th{color:var(--txt-soft,#8ba396);font-weight:600}.tbl{overflow-x:auto}
  tbody tr.clickable{cursor:pointer}tbody tr.clickable:hover{background:rgba(255,255,255,.03)}
  .b{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:700;display:inline-block}
  .ALLOW,.imported{background:rgba(16,185,129,.15);color:#10b981}
  .QUALIFY,.partial,.validated{background:rgba(245,179,1,.15);color:#f5b301}
  .BLOCK,.rejected{background:rgba(239,68,68,.15);color:#ef4444}.processing{background:rgba(139,163,150,.15);color:#8ba396}
  .state{padding:34px 16px;text-align:center;color:var(--txt-soft,#8ba396);border:1px dashed var(--line,#1d2c24);border-radius:14px}
  .err{color:#ef4444}.ok{color:#10b981}.muted{color:var(--txt-soft,#8ba396);font-size:12px}
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:50;align-items:center;justify-content:center;padding:12px}.ov.on{display:flex}
  .modal{background:var(--bg,#070b09);border:1px solid var(--line,#1d2c24);border-radius:16px;width:min(760px,100%);max-height:92vh;overflow-y:auto;padding:18px}
  @media(max-width:600px){h1{font-size:20px}.wrap{padding-top:64px}}
</style>
</head>
<body>
<div class="wrap">
  <h1 data-i18n="dc.title">مركز البيانات</h1>
  <p class="sub" data-i18n="dc.subtitle"></p>
  <div class="tiles" id="tiles"></div>

  <div class="panel" id="uploadPanel">
    <div class="steps" id="steps"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <select id="dtype"></select>
      <input type="file" id="file" accept=".csv,.xlsx,.xlsm">
      <button class="btn" id="previewBtn"></button>
      <span id="upMsg" class="muted"></span>
    </div>
    <div id="result"></div>
  </div>

  <div class="panel" style="margin-top:16px">
    <div style="font-weight:800;margin-bottom:10px" data-i18n="dc.datasets">الملفات المرفوعة</div>
    <div id="list"><div class="state">…</div></div>
  </div>

  <!-- البيانات الأساسية المعتمدة: العملاء، الموردون، المنتجات، الموظفون، الأقسام -->
  <div class="panel" style="margin-top:16px" id="mdPanel">
    <div style="font-weight:800;margin-bottom:10px" id="mdTitle"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px">
      <select id="mdEntity"></select>
      <input id="mdQ" style="flex:1;min-width:160px;background:var(--panel2,#0c1511);color:inherit;border:1px solid var(--line,#1d2c24);border-radius:10px;padding:8px">
      <button class="btn ghost" id="mdPrev">‹</button><span class="muted" id="mdPage"></span><button class="btn ghost" id="mdNext">›</button>
    </div>
    <div id="mdList"><div class="state">…</div></div>
  </div>
</div>
<script>
(function(){
  const TOKEN=localStorage.getItem("nabbah_token")||"";if(!TOKEN)return;
  const ar=!(window.NabbahI18n&&window.NabbahI18n.getLang&&window.NabbahI18n.getLang()==="en");
  const $=id=>document.getElementById(id),e=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const ENT=[["customer",ar?"العملاء":"Customers"],["supplier",ar?"الموردون":"Suppliers"],["product",ar?"المنتجات":"Products"],["employee",ar?"الموظفون":"Employees"],["department",ar?"الأقسام":"Departments"]];
  const LBL={name:ar?"الاسم":"Name",customer_code:ar?"الرمز":"Code",supplier_code:ar?"الرمز":"Code",employee_code:ar?"الرقم":"No.",sku:"SKU",email:ar?"البريد":"Email",phone:ar?"الجوال":"Phone",
    city:ar?"المدينة":"City",segment:ar?"الشريحة":"Segment",customer_type:ar?"النوع":"Type",tax_number:ar?"الرقم الضريبي":"VAT no.",credit_limit:ar?"حد الائتمان":"Credit limit",
    contact_person:ar?"المسؤول":"Contact",payment_terms:ar?"شروط الدفع":"Terms",category:ar?"الفئة":"Category",unit:ar?"الوحدة":"Unit",cost:ar?"التكلفة":"Cost",selling_price:ar?"سعر البيع":"Price",
    role:ar?"الوظيفة":"Role",employment_status:ar?"الحالة":"Status",hire_date:ar?"التعيين":"Hired",monthly_cost:ar?"التكلفة الشهرية":"Monthly cost",code:ar?"الرمز":"Code",active:ar?"نشط":"Active",notes:ar?"ملاحظات":"Notes"};
  const COLS={customer:["name","customer_code","email","phone","city","customer_type","tax_number","credit_limit"],supplier:["name","supplier_code","contact_person","email","phone","city","payment_terms","tax_number"],
    product:["sku","name","category","unit","cost","selling_price","active"],employee:["employee_code","name","role","email","phone","employment_status","hire_date","monthly_cost"],department:["name","code","active"]};
  let off=0,LIM=50,total=0,tmr=null;
  $("mdTitle").textContent=ar?"البيانات الأساسية المعتمدة":"Imported master data";
  $("mdQ").placeholder=ar?"ابحث بالاسم أو البريد أو الجوال أو الرمز…":"Search name, email, phone, code…";
  $("mdEntity").innerHTML=ENT.map(([k,l])=>`<option value="${k}">${l}</option>`).join("");
  function load(){
    const ent=$("mdEntity").value;$("mdList").innerHTML=`<div class="state">…</div>`;
    fetch(`/company/master-data?entity=${ent}&q=${encodeURIComponent($("mdQ").value)}&offset=${off}&limit=${LIM}`,{headers:{Authorization:"Bearer "+TOKEN}}).then(async r=>{
      const d=await r.json().catch(()=>({}));
      if(r.status===403){$("mdPanel").style.display="none";return;}
      if(!r.ok){$("mdList").innerHTML=`<div class="muted err">${e(typeof d.detail==="string"?d.detail:"HTTP "+r.status)}</div>`;return;}
      total=d.total??d.count;const cols=COLS[ent];
      $("mdPage").textContent=total?`${off+1}–${Math.min(off+LIM,total)} / ${total}`:"0";
      if(!d.items.length){$("mdList").innerHTML=`<div class="state">${ar?"لا توجد بيانات معتمدة بعد — ارفع ملفاً من الأعلى":"Nothing imported yet — upload a file above"}</div>`;return;}
      $("mdList").innerHTML=`<div style="overflow-x:auto"><table><thead><tr>${cols.map(c=>`<th>${e(LBL[c]||c)}</th>`).join("")}<th>${ar?"إضافي":"Extra"}</th></tr></thead><tbody>`+
        d.items.map(it=>`<tr>${cols.map(c=>`<td>${it[c]==null||it[c]===""?"—":(it.restricted&&c==="monthly_cost"?"🔒":e(it[c]))}</td>`).join("")}<td class="muted" style="white-space:normal;max-width:280px">${e(Object.entries(it.extra||{}).map(([k,v])=>k+": "+v).join(" · "))}</td></tr>`).join("")+`</tbody></table></div>`;
    }).catch(err=>{$("mdList").innerHTML=`<div class="muted err">${e(err.message||err)}</div>`;});
  }
  $("mdEntity").onchange=()=>{off=0;load();};
  $("mdQ").oninput=()=>{clearTimeout(tmr);tmr=setTimeout(()=>{off=0;load();},350);};
  $("mdPrev").onclick=()=>{if(off>0){off=Math.max(0,off-LIM);load();}};
  $("mdNext").onclick=()=>{if(off+LIM<total){off+=LIM;load();}};
  load();
})();
</script>
<div class="ov" id="ov"><div class="modal" id="modal"></div></div>
<script src="i18n.js"></script>
<script>
(function(){
  const TOKEN=localStorage.getItem("nabbah_token")||"";if(!TOKEN){location.href="login.html";return;}
  const I=()=>window.NabbahI18n,L=()=>(I()&&I().getLang)?I().getLang():"ar";
  const tr=(k,fb)=>{const v=I()&&I().t?I().t(k,L()):k;return(v&&v!==k)?v:(fb||k);};
  const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const num=v=>v==null?"—":Number(v).toLocaleString(L()==="ar"?"ar-SA":"en-US",{maximumFractionDigits:2});
  const H={Authorization:"Bearer "+TOKEN},$=id=>document.getElementById(id);
  let state={datasets:[],types:{},can_upload:false},step=1;

  document.querySelector(".sub").textContent=tr("dc.subtitle");
  $("previewBtn").textContent=tr("dc.preview");
  function drawSteps(){
    const s=[tr("dc.step1"),tr("dc.step2"),tr("dc.step3"),tr("dc.step4")];
    $("steps").innerHTML=s.map((t,i)=>`<span class="${i<step?"on":""}">${esc(t)}</span>`).join("");
  }
  function load(){
    fetch("/company/datasets",{headers:H}).then(r=>{
      if(r.status===401){location.href="login.html";return null;}
      if(r.status===403||r.status===402){$("list").innerHTML=`<div class="state">${tr("dc.denied")}</div>`;$("uploadPanel").style.display="none";return null;}
      if(!r.ok)throw 0;return r.json();
    }).then(d=>{if(d){state=d;render();}}).catch(()=>{$("list").innerHTML=`<div class="state err">${tr("dc.error")}</div>`;});
  }
  function render(){
    $("dtype").innerHTML=`<option value="auto" selected>${L()==="ar"?"تلقائي — نبّاه يتعرف على نوع الملف (موصى به)":"Auto — Nabbah detects the file type (recommended)"}</option>`+Object.entries(state.types).map(([k,v])=>`<option value="${k}">${esc(L()==="ar"?v.ar:v.en)}</option>`).join("");
    if(!state.can_upload){$("previewBtn").disabled=true;$("upMsg").textContent=tr("dc.noPermissionUpload");}
    const ds=state.datasets, imported=ds.filter(d=>d.status==="imported"||d.status==="partial").length;
    const avg=ds.length?Math.round(ds.reduce((a,d)=>a+(d.quality_score||0),0)/ds.length):null;
    const t=(l,v)=>`<div class="tile"><div class="l">${l}</div><div class="v">${v}</div></div>`;
    $("tiles").innerHTML=t(tr("dc.total"),ds.length)+t(tr("dc.importedCount"),imported)+t(tr("dc.avgQuality"),avg==null?"—":avg+"%");
    if(!ds.length){$("list").innerHTML=`<div class="state">${tr("dc.empty")}</div>`;drawSteps();return;}
    $("list").innerHTML=`<div class="tbl"><table><thead><tr><th>${tr("dc.type")}</th><th>${tr("dc.file")}</th><th>${tr("dc.period")}</th><th>${tr("dc.rows")}</th><th>${tr("dc.valid")}</th><th>${tr("dc.rejected")}</th><th>${tr("dc.quality")}</th><th>${tr("dc.status")}</th><th>${tr("dc.date")}</th></tr></thead><tbody>`+
      ds.map(d=>`<tr class="clickable" data-id="${d.id}"><td>${esc((state.types[d.dataset_type]||{})[L()==="ar"?"ar":"en"]||d.dataset_type)}</td><td>${esc(d.source_file)}</td><td>${esc(d.period||"—")}</td><td>${num(d.total_rows)}</td><td class="ok">${num(d.valid_rows)}</td><td class="${d.rejected_rows?"err":""}">${num(d.rejected_rows)}</td><td><span class="b ${d.quality_gate}">${d.quality_score}%</span></td><td><span class="b ${d.status}">${tr("dc.status."+d.status)}</span></td><td>${esc((d.created_at||"").slice(0,10))}</td></tr>`).join("")+`</tbody></table></div>`;
    document.querySelectorAll("[data-id]").forEach(el=>el.onclick=()=>detail(+el.dataset.id));
    drawSteps();
  }
  $("previewBtn").onclick=()=>{
    const f=$("file").files[0], t=$("dtype").value;
    if(!t){$("dtype").value="auto";}
    if(!f){$("upMsg").className="muted err";$("upMsg").textContent=tr("dc.choose");return;}
    const fd=new FormData();fd.append("file",f);fd.append("dataset_type",t||"auto");
    $("upMsg").className="muted";$("upMsg").textContent=tr("dc.uploading");$("previewBtn").disabled=true;step=2;drawSteps();
    fetch("/company/datasets/preview",{method:"POST",headers:H,body:fd}).then(async r=>{
      const d=await r.json().catch(()=>({}));$("previewBtn").disabled=false;
      if(!r.ok){
        const det=d.detail;$("upMsg").className="muted err";step=1;drawSteps();
        if(det&&typeof det==="object"){
          $("upMsg").innerHTML=esc(det["message_"+L()]||det.message_ar||tr("dc.error"))+
            (det.suggested_type?` <button class="btn" id="useSug" style="margin-inline-start:8px">${L()==="ar"?"استخدم النوع المقترح":"Use suggested type"}</button>`:"");
          const b=$("useSug");if(b)b.onclick=()=>{$("dtype").value=det.suggested_type;$("previewBtn").click();};
        }else $("upMsg").textContent=(typeof det==="string"?det:tr("dc.error"))+(r.status>=500?` (HTTP ${r.status})`:"");
        return;}
      $("upMsg").textContent="";showPreview(d);
    }).catch(()=>{$("previewBtn").disabled=false;$("upMsg").className="muted err";$("upMsg").textContent=tr("dc.error");});
  };
  function showPreview(d){
    step=3;drawSteps();
    const q=d.quality, ds=d.dataset;
    const mapRows=Object.entries(d.mapping).map(([c,f])=>`<tr><td>${esc(c)}</td><td class="ok">${esc(f)}</td></tr>`).join("");
    const errRows=(d.rejected_sample||[]).map(r=>`<tr><td>${r.row}</td><td class="err">${esc(r.errors.map(e=>(e.field!=="—"?e.field+": ":"")+e.error).join(" · "))}</td></tr>`).join("");
    const sample=(d.sample||[]).slice(0,5);
    const cols=sample.length?Object.keys(sample[0]).filter(k=>k!=="_row"):[];
    $("result").innerHTML=`
      <div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center">
        <span class="b ${q.gate}">${tr("dc.gate."+q.gate)} · ${q.overall_score}%</span>
        <span class="muted">${tr("dc.rows")}: ${num(ds.total_rows)} · <span class="ok">${tr("dc.valid")}: ${num(ds.valid_rows)}</span> · <span class="${ds.rejected_rows?"err":""}">${tr("dc.rejected")}: ${num(ds.rejected_rows)}</span></span>
      </div>
      <div class="muted" style="margin-top:8px">${L()==="ar"?"نوع الملف":"File type"}: <b>${esc(d.detected_label||d.detected_type||"")}</b>${d.auto_detected?(L()==="ar"?" (تعرّف تلقائي)":" (auto-detected)"):""}</div>
      ${d.default_branch_used?`<div class="muted">${L()==="ar"?"لا يوجد عمود فرع — نُسبت الصفوف لفرعك الوحيد":"No branch column — rows assigned to your only branch"}</div>`:""}
      ${d.extra_columns&&d.extra_columns.length?`<div class="muted">${L()==="ar"?"أعمدة إضافية محفوظة كما هي (لن تُفقد)":"Extra columns kept as-is (nothing lost)"}: ${d.extra_columns.map(esc).join(", ")}</div>`:""}
      ${d.warning_count?`<div class="muted" style="color:#f5b301">${L()==="ar"?"تنبيهات لا تمنع الاعتماد (بريد/جوال غير صالح، حُفظت القيمة الأصلية)":"Non-blocking warnings (invalid email/phone, original kept)"}: ${d.warning_count}</div>`:""}
      ${d.missing_required.length?`<div class="err" style="margin-top:8px">${tr("dc.missingReq")}: ${d.missing_required.map(esc).join(", ")}</div>`:""}
      ${d.unmapped.length&&!(d.extra_columns&&d.extra_columns.length)?`<div class="muted" style="margin-top:6px">${tr("dc.unmapped")}: ${d.unmapped.map(u=>esc(u.header)).join(", ")}</div>`:""}
      <div style="margin-top:12px;font-weight:700">${tr("dc.mapping")}</div>
      <div class="tbl"><table><thead><tr><th>${tr("dc.column")}</th><th>${tr("dc.field")}</th></tr></thead><tbody>${mapRows}</tbody></table></div>
      ${sample.length?`<div style="margin-top:12px;font-weight:700">${tr("dc.sample")}</div><div class="tbl"><table><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${sample.map(r=>`<tr>${cols.map(c=>`<td>${esc(r[c]??"—")}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`:""}
      ${errRows?`<div style="margin-top:12px;font-weight:700">${tr("dc.errors")}</div><div class="tbl"><table><thead><tr><th>${tr("dc.row")}</th><th>${tr("dc.reason")}</th></tr></thead><tbody>${errRows}</tbody></table></div>`:""}
      <div style="margin-top:14px">
        ${q.gate==="BLOCK"?`<div class="err">${tr("dc.blocked")}</div>`:`<button class="btn" id="impBtn" data-ds="${ds.id}">${tr("dc.import")}</button>`}
        <span id="impMsg" class="muted"></span>
      </div>`;
    const b=$("impBtn");if(b)b.onclick=()=>doImport(+b.dataset.ds);
  }
  function doImport(id){
    $("impMsg").className="muted";$("impMsg").textContent="…";$("impBtn").disabled=true;
    fetch(`/company/datasets/${id}/import`,{method:"POST",headers:H}).then(async r=>{
      const d=await r.json().catch(()=>({}));
      if(!r.ok){$("impMsg").className="muted err";$("impMsg").textContent=(typeof d.detail==="string"?d.detail:(d.detail&&d.detail["message_"+L()])||tr("dc.error"));$("impBtn").disabled=false;return;}
      step=4;drawSteps();$("impMsg").className="muted ok";$("impMsg").textContent=`${tr("dc.imported")} (${num(d.imported)})`;load();
    }).catch(()=>{$("impMsg").className="muted err";$("impMsg").textContent=tr("dc.error");$("impBtn").disabled=false;});
  }
  function detail(id){
    fetch(`/company/datasets/${id}`,{headers:H}).then(r=>r.ok?r.json():Promise.reject()).then(d=>{
      const ds=d.dataset,lin=d.lineage||{};
      const row=(l,v)=>`<div style="display:grid;grid-template-columns:150px 1fr;gap:8px;font-size:13px;margin:5px 0"><span class="muted">${l}</span><span>${esc(v??"—")}</span></div>`;
      $("modal").innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><b>${tr("dc.detail")}</b><button class="btn ghost" id="xc">${tr("dc.close")}</button></div>
        ${row(tr("dc.file"),ds.source_file)}${row(tr("dc.type"),ds.dataset_type)}${row(tr("dc.period"),ds.period)}${row(tr("dc.branches"),ds.branches)}
        ${row(tr("dc.rows"),num(ds.total_rows))}${row(tr("dc.valid"),num(ds.valid_rows))}${row(tr("dc.rejected"),num(ds.rejected_rows))}
        ${row(tr("dc.quality"),ds.quality_score+"% · "+tr("dc.gate."+ds.quality_gate))}${row(tr("dc.status"),tr("dc.status."+ds.status))}
        ${row(tr("dc.uploadedBy"),ds.uploaded_by)}${row(tr("dc.date"),(ds.created_at||"").slice(0,16).replace("T"," "))}
        <div style="margin-top:10px;font-weight:700">${tr("dc.lineage")}</div>
        <div class="muted">${esc(JSON.stringify(lin,null,1))}</div>
        ${(d.errors||[]).length?`<div style="margin-top:10px;font-weight:700">${tr("dc.errors")}</div><div class="tbl"><table><tbody>${d.errors.slice(0,50).map(e=>`<tr><td>${e.row}</td><td class="err">${esc((e.errors||[]).map(x=>x.error).join(" · "))}</td></tr>`).join("")}</tbody></table></div>`:""}`;
      $("ov").classList.add("on");$("xc").onclick=()=>$("ov").classList.remove("on");
    }).catch(()=>{});
  }
  $("ov").onclick=e=>{if(e.target.id==="ov")$("ov").classList.remove("on");};
  drawSteps();load();
})();
</script>
<script src="nabbah-sidebar.js"></script>
</body></html>
