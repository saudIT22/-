<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نبّاه · صحة الشركة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#070b09;--panel:#101a15;--panel2:#0e1712;--line:#1d2c24;--mint:#10b981;--mint-deep:#0b8457;--gold:#f5b301;--red:#ef4444;--orange:#f97316;--txt:#e8f1ec;--txt-soft:#8ba396;--txt-mute:#5c6f66;}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--txt);line-height:1.6;min-height:100vh;
    background-image:radial-gradient(ellipse 800px 400px at 15% -5%,rgba(16,185,129,.06),transparent),radial-gradient(ellipse 600px 300px at 90% 5%,rgba(11,132,87,.05),transparent)}
  a{text-decoration:none;color:inherit}
  header{position:sticky;top:0;z-index:40;background:rgba(7,11,9,.85);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .head-in{max-width:1080px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:19px;color:#fff}
  .brand .bell{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--mint),var(--mint-deep));display:grid;place-items:center;font-size:17px;transform:rotate(-6deg)}
  .btn{display:inline-flex;align-items:center;gap:7px;font-family:inherit;font-weight:700;cursor:pointer;border-radius:11px;font-size:13.5px;padding:9px 15px;background:var(--panel);color:var(--txt-soft);border:1px solid var(--line)}
  .wrap{max-width:1080px;margin:0 auto;padding:24px 18px 60px}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
  .top .l{display:flex;align-items:center;gap:11px}
  .top h1{font-size:20px;font-weight:900}
  .live{font-size:11px;color:var(--mint);background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.22);padding:3px 11px;border-radius:20px;font-weight:700;display:inline-flex;align-items:center;gap:5px}
  .live .d{width:6px;height:6px;border-radius:50%;background:var(--mint);box-shadow:0 0 8px var(--mint)}
  .stamp{font-size:12px;color:var(--txt-mute);text-align:left}
  .hero{display:grid;grid-template-columns:1fr 1.3fr;gap:16px;margin-bottom:16px}
  .card{background:linear-gradient(180deg,rgba(255,255,255,.028),rgba(255,255,255,.008));border:1px solid rgba(255,255,255,.06);border-radius:20px;padding:24px}
  .card-t{font-size:13px;color:var(--txt-soft);font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:7px}
  .gauge-c{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center}
  .gnum{font-size:58px;font-weight:900;line-height:1;letter-spacing:-2px;margin-top:-26px;font-family:'Inter',sans-serif}
  .gstate{margin-top:10px;font-size:13px;font-weight:800;padding:6px 16px;border-radius:20px}
  .gsub{font-size:11.5px;color:var(--txt-mute);margin-top:12px}
  .gdelta{display:inline-flex;align-items:center;gap:4px;font-size:12px;margin-top:8px;font-weight:700}
  .radar-row{display:grid;grid-template-columns:220px 1fr;gap:20px;align-items:center}
  @media(max-width:760px){.hero{grid-template-columns:1fr}.radar-row{grid-template-columns:1fr}}
  .plist{display:flex;flex-direction:column;gap:12px}
  .prow{display:flex;align-items:center;gap:11px}
  .prow .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:14px;flex-shrink:0}
  .prow .nm{flex:1;font-size:13px;font-weight:600;color:#c3d3cb}
  .prow .track{width:70px;height:5px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden}
  .prow .fl{height:100%;border-radius:3px}
  .prow .vl{font-size:15px;font-weight:800;width:30px;text-align:left;font-family:'Inter',sans-serif}
  .metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:13px;margin-bottom:16px}
  @media(max-width:760px){.metrics{grid-template-columns:repeat(2,1fr)}}
  .mc{background:linear-gradient(180deg,rgba(255,255,255,.028),rgba(255,255,255,.008));border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:16px}
  .mc .mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
  .mc .ml{font-size:11.5px;color:var(--txt-soft);font-weight:600}
  .mc .badge{font-size:10px;padding:2px 8px;border-radius:5px;font-weight:800}
  .mc .mv{font-size:24px;font-weight:900;letter-spacing:-1px;font-family:'Inter',sans-serif}
  .mc .mtr{font-size:11px;margin-top:8px;font-weight:600;color:var(--txt-soft)}
  .cause{background:linear-gradient(135deg,rgba(245,179,1,.08),transparent);border:1px solid rgba(245,179,1,.22);border-radius:14px;padding:15px 18px;margin-bottom:16px;display:none}
  .cause .h{font-size:13px;font-weight:800;color:var(--gold);margin-bottom:4px}
  .cause .b{font-size:12.5px;color:var(--txt-soft)}
  .branches{display:flex;flex-direction:column;gap:9px}
  .br{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.055);border-radius:12px;padding:13px 17px;transition:.15s}
  .br:hover{background:rgba(255,255,255,.045)}
  .br .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .br .nm{flex:1;font-size:13.5px;font-weight:700}
  .br .nm span{color:var(--txt-mute);font-weight:400;font-size:11.5px;margin-right:6px}
  .br .mg{font-size:11.5px;color:var(--txt-soft)}
  .br .track{width:90px;height:5px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden}
  .br .fl{height:100%;border-radius:3px}
  .br .sc{font-size:18px;font-weight:900;width:32px;text-align:left;letter-spacing:-1px;font-family:'Inter',sans-serif}
  .br .nd{font-size:11.5px;color:var(--txt-mute)}
  .spin{width:32px;height:32px;border:3px solid var(--line);border-top-color:var(--mint);border-radius:50%;animation:sp 1s linear infinite;margin:60px auto}@keyframes sp{to{transform:rotate(360deg)}}
  .foot{display:flex;gap:9px;justify-content:center;margin-top:22px;flex-wrap:wrap}
</style>
</head>
<body>
<header>
  <div class="head-in">
    <a class="brand" href="company-dashboard.html"><span class="bell">🔔</span>نبّاه</a>
    <div style="display:flex;gap:8px">
      <a class="btn" href="company-command-center.html" data-i18n="nav.command">مركز القيادة</a>
      <a class="btn" href="company-dashboard.html" data-i18n="nav.dashboard">اللوحة</a>
    </div>
  </div>
</header>
<div class="wrap">
  <div id="loading"><div class="spin"></div></div>
  <div id="content" style="display:none">

    <div class="top">
      <div class="l"><h1 data-i18n="health.title">صحة الشركة</h1><span class="live"><span class="d"></span><span data-i18n="health.live">مباشر</span></span></div>
      <div class="stamp" id="stamp"></div>
    </div>

    <div class="hero">
      <div class="card gauge-c">
        <svg viewBox="0 0 220 130" style="width:100%;max-width:220px" id="gaugeSvg"></svg>
        <div class="gnum" id="gNum">—</div>
        <div class="gstate" id="gState">—</div>
        <div class="gdelta" id="gDelta"></div>
        <div class="gsub" data-i18n="health.composite">مؤشر مركّب من ٥ محاور موزونة</div>
      </div>
      <div class="card">
        <div class="card-t">🕸️ <span data-i18n="health.radar">رادار المحاور الخمسة</span></div>
        <div class="radar-row">
          <div id="radarBox"></div>
          <div class="plist" id="plist"></div>
        </div>
      </div>
    </div>

    <div class="cause" id="causeBox">
      <div class="h">🎯 <span data-i18n="health.priority">الأولوية للتحسين:</span> <span id="weakAxis"></span></div>
      <div class="b" id="causeText"></div>
    </div>

    <div class="metrics" id="metrics"></div>

    <div class="card">
      <div class="card-t">🏬 <span data-i18n="health.byBranch">الأداء حسب الفرع</span></div>
      <div class="branches" id="branches"></div>
    </div>

    <div class="foot">
      <a class="btn" href="company-command-center.html">🎛️ <span data-i18n="nav.command">مركز القيادة</span></a>
      <a class="btn" href="company-risks.html">⚠️ <span data-i18n="nav.risks">المخاطر</span></a>
      <a class="btn" href="company-predictions.html">🔮 <span data-i18n="nav.predictions">التنبؤ</span></a>
    </div>
  </div>
</div>
<script>
const TOKEN=localStorage.getItem("nabbah_token")||"";
if(!TOKEN) window.location.href="login.html";
async function api(p){
  const r=await fetch(p,{headers:{"Authorization":"Bearer "+TOKEN}});
  if(r.status===401){ localStorage.removeItem("nabbah_token"); window.location.href="login.html"; throw new Error("جلسة"); }
  const d=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.detail||"خطأ");
  return d;
}
const scoreColor=s=>s>=75?"#10b981":(s>=55?"#f5b301":(s>=35?"#f97316":"#ef4444"));
const lvlWord=s=>s>=75?"قوي":(s>=55?"متوسط":(s>=35?"ضعيف":"حرج"));

function drawGauge(score,color){
  const R=90,cx=110,cy=120;
  const frac=Math.max(0,Math.min(100,score))/100;
  const totalLen=Math.PI*R;
  const off=totalLen*(1-frac);
  const ang=Math.PI-(frac*Math.PI);
  const px=cx+Math.cos(ang)*R, py=cy-Math.sin(ang)*R;
  return `
    <path d="M ${cx-R} ${cy} A ${R} ${R} 0 0 1 ${cx+R} ${cy}" fill="none" stroke="#16221c" stroke-width="16" stroke-linecap="round"/>
    <path d="M ${cx-R} ${cy} A ${R} ${R} 0 0 1 ${cx+R} ${cy}" fill="none" stroke="url(#gg)" stroke-width="16" stroke-linecap="round" stroke-dasharray="${totalLen}" stroke-dashoffset="${off}"/>
    <defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ef4444"/><stop offset="0.5" stop-color="#f5b301"/><stop offset="1" stop-color="#10b981"/></linearGradient></defs>
    <circle cx="${px}" cy="${py}" r="6" fill="#fff" stroke="${color}" stroke-width="3"/>`;
}
function drawRadar(axes){
  const n=axes.length, cx=115,cy=112,R=90;
  const pt=(i,f)=>{const a=(-90+i*(360/n))*Math.PI/180;return [cx+Math.cos(a)*R*f, cy+Math.sin(a)*R*f];};
  let rings="";
  [0.33,0.66,1].forEach(f=>{rings+=`<polygon points="${axes.map((a,i)=>pt(i,f).join(",")).join(" ")}" fill="none" stroke="#16221c" stroke-width="1"/>`;});
  let ax="";axes.forEach((a,i)=>{const p=pt(i,1);ax+=`<line x1="${cx}" y1="${cy}" x2="${p[0]}" y2="${p[1]}" stroke="#16221c"/>`;});
  const shape=axes.map((a,i)=>pt(i,(a.score||0)/100).join(",")).join(" ");
  let dots="",labels="";
  axes.forEach((a,i)=>{
    const p=pt(i,(a.score||0)/100);dots+=`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#10b981"/>`;
    const lp=pt(i,1.2);labels+=`<text x="${lp[0]}" y="${lp[1]}" fill="#8ba396" font-size="13" text-anchor="middle" dominant-baseline="middle">${a.icon}</text>`;
  });
  return `<svg viewBox="0 0 230 224" style="width:100%">
    <defs><radialGradient id="rg" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="rgba(16,185,129,.4)"/><stop offset="100%" stop-color="rgba(16,185,129,.06)"/></radialGradient></defs>
    ${rings}${ax}
    <polygon points="${shape}" fill="url(#rg)" stroke="#10b981" stroke-width="2"/>
    ${dots}${labels}</svg>`;
}
async function load(){
  try{
    const d=await api("/company/health-score");
    document.getElementById("loading").style.display="none";
    document.getElementById("content").style.display="block";
    document.getElementById("stamp").innerHTML=((d.company&&d.company.name)||"")+"<br>"+(d.generated_at||"");
    const col=d.color||scoreColor(d.overall);
    document.getElementById("gaugeSvg").innerHTML=drawGauge(d.overall,col);
    const gn=document.getElementById("gNum");gn.textContent=d.overall;gn.style.color=col;
    const gs=document.getElementById("gState");gs.textContent=d.level||lvlWord(d.overall);
    gs.style.color=col;gs.style.background=col+"1a";
    document.getElementById("radarBox").innerHTML=drawRadar(d.axes);
    document.getElementById("plist").innerHTML=d.axes.map(a=>{
      const c=scoreColor(a.score);
      return `<div class="prow"><div class="ic" style="background:${c}1f">${a.icon}</div><div class="nm">${a.label}</div><div class="track"><div class="fl" style="width:${a.score}%;background:${c}"></div></div><div class="vl" style="color:${c}">${a.score}</div></div>`;
    }).join("");
    document.getElementById("metrics").innerHTML=d.axes.map(a=>{
      const c=scoreColor(a.score);const w=lvlWord(a.score);
      return `<div class="mc"><div class="mh"><span class="ml">${a.icon} ${a.label}</span><span class="badge" style="background:${c}24;color:${c}">${w}</span></div>
        <div class="mv" style="color:${c}">${a.score}</div><div class="mtr">${a.metric||""}</div></div>`;
    }).join("");
    if(d.weakest_axis){
      document.getElementById("causeBox").style.display="block";
      document.getElementById("weakAxis").textContent=d.weakest_axis;
      document.getElementById("causeText").textContent=d.main_cause||"";
    }
    if(d.branch_health && d.branch_health.length){
      document.getElementById("branches").innerHTML=d.branch_health.map(b=>{
        if(!b.has_data) return `<div class="br"><div class="dot" style="background:#5c6f66"></div><div class="nm">${b.name}${b.city?` <span>${b.city}</span>`:""}</div><div class="nd" data-i18n="health.noBranchData">لا توجد بيانات</div></div>`;
        return `<div class="br"><div class="dot" style="background:${b.color}"></div><div class="nm">${b.name}${b.city?` <span>${b.city}</span>`:""}</div><div class="mg">هامش ${b.margin}%</div><div class="track"><div class="fl" style="width:${b.score}%;background:${b.color}"></div></div><div class="sc" style="color:${b.color}">${b.score}</div></div>`;
      }).join("");
    }
    if(window.NabbahI18n) window.NabbahI18n.apply();
  }catch(e){
    document.getElementById("loading").innerHTML='<p style="text-align:center;color:var(--red)">'+e.message+'</p>';
  }
}
load();
</script>
<script src="i18n.js"></script>
</body>
</html>
