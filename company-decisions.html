<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نبّاه · مركز القرارات والإجراءات</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="nabbah-design.css" rel="stylesheet">
<style>
  :root{--bg:#070b09;--panel:#101a15;--panel2:#0e1712;--line:#1d2c24;--mint:#10b981;--mint-deep:#0b8457;--gold:#f5b301;--red:#ef4444;--orange:#f97316;--blue:#3b82f6;--txt:#e8f1ec;--txt-soft:#8ba396;--txt-mute:#5c6f66;}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--txt);line-height:1.7;min-height:100vh;background-image:radial-gradient(ellipse 800px 400px at 15% -5%,rgba(16,185,129,.06),transparent)}
  a{text-decoration:none;color:inherit}
  header{position:sticky;top:0;z-index:40;background:rgba(7,11,9,.85);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .head-in{max-width:920px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:19px;color:#fff}
  .brand .bell{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--mint),var(--mint-deep));display:grid;place-items:center;font-size:17px;transform:rotate(-6deg)}
  .btn{display:inline-flex;align-items:center;gap:7px;font-weight:700;cursor:pointer;border-radius:11px;font-size:13.5px;padding:9px 15px;background:var(--panel);color:var(--txt-soft);border:1px solid var(--line)}
  .wrap{max-width:920px;margin:0 auto;padding:24px 18px 70px}
  h1{font-size:22px;font-weight:900;display:flex;align-items:center;gap:9px;margin-bottom:4px}
  .sub{font-size:13px;color:var(--txt-soft);margin-bottom:22px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
  @media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}}
  .stat{background:linear-gradient(180deg,rgba(255,255,255,.028),rgba(255,255,255,.008));border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:16px;text-align:center}
  .stat .v{font-size:28px;font-weight:900;font-family:'Inter',sans-serif;line-height:1}
  .stat .l{font-size:11.5px;color:var(--txt-soft);margin-top:6px}
  .new-btn{width:100%;background:linear-gradient(135deg,var(--mint),var(--mint-deep));color:#fff;border:none;border-radius:14px;padding:14px;font-family:inherit;font-weight:800;font-size:15px;cursor:pointer;margin-bottom:18px}
  .form{background:linear-gradient(135deg,rgba(16,185,129,.06),transparent);border:1px solid rgba(16,185,129,.25);border-radius:16px;padding:20px;margin-bottom:20px;display:none}
  .form.show{display:block}
  .form h3{font-size:15px;font-weight:800;margin-bottom:14px;color:var(--mint)}
  .frow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
  @media(max-width:600px){.frow{grid-template-columns:1fr}}
  .field label{display:block;font-size:12px;color:var(--txt-soft);font-weight:600;margin-bottom:5px}
  .field input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px 12px;font-family:inherit;font-size:14px;outline:none}
  .field input:focus{border-color:var(--mint)}
  .field.full{grid-column:1/-1}
  .fbtns{display:flex;gap:10px;margin-top:6px}
  .sbtn{background:linear-gradient(135deg,var(--mint),var(--mint-deep));color:#fff;border:none;border-radius:11px;padding:11px 20px;font-weight:800;font-size:13.5px;cursor:pointer;font-family:inherit}
  .sbtn.ghost{background:var(--panel);border:1px solid var(--line);color:var(--txt-soft)}
  .dec{background:linear-gradient(180deg,rgba(255,255,255,.028),rgba(255,255,255,.008));border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:16px 18px;margin-bottom:11px;border-right:3px solid var(--line)}
  .dec.open{border-right-color:var(--gold)}
  .dec.overdue{border-right-color:var(--red)}
  .dec.done{border-right-color:var(--mint)}
  .dec-h{display:flex;align-items:flex-start;gap:12px;margin-bottom:8px}
  .dec-h .t{flex:1;font-size:15px;font-weight:800}
  .badge{font-size:10.5px;padding:3px 10px;border-radius:6px;font-weight:800;flex-shrink:0}
  .badge.open{background:rgba(245,179,1,.14);color:var(--gold)}
  .badge.overdue{background:rgba(239,68,68,.14);color:var(--red)}
  .badge.done{background:rgba(16,185,129,.14);color:var(--mint)}
  .dec-meta{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--txt-soft);margin-bottom:6px}
  .dec-meta .m{display:flex;align-items:center;gap:5px}
  .dec-detail{font-size:13px;color:var(--txt-soft);margin-bottom:8px}
  .impact{background:rgba(16,185,129,.08);border-radius:10px;padding:10px 14px;font-size:12.5px;margin-top:8px}
  .impact .big{font-size:16px;font-weight:800}
  .dec-actions{display:flex;gap:8px;margin-top:10px}
  .act-btn{font-size:12px;padding:7px 14px;border-radius:9px;font-weight:700;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--txt-soft);font-family:inherit}
  .act-btn.done{background:rgba(16,185,129,.12);color:var(--mint);border-color:rgba(16,185,129,.3)}
  .empty{text-align:center;padding:50px 20px;color:var(--txt-mute)}
  .spin{width:32px;height:32px;border:3px solid var(--line);border-top-color:var(--mint);border-radius:50%;animation:sp 1s linear infinite;margin:50px auto}@keyframes sp{to{transform:rotate(360deg)}}

  .intel{background:linear-gradient(135deg,rgba(16,185,129,.1),transparent);border:1px solid rgba(16,185,129,.3);border-radius:16px;padding:18px 20px;margin-bottom:16px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .intel .score{font-size:40px;font-weight:900;font-family:'Inter';line-height:1}
  .intel .txt{flex:1}
  .intel .txt .t{font-size:14px;font-weight:800;margin-bottom:2px}
  .intel .txt .s{font-size:12px;color:var(--txt-soft)}
  .intel .cod{text-align:center;padding:10px 18px;background:rgba(239,68,68,.1);border-radius:12px}
  .intel .cod .v{font-size:20px;font-weight:900;color:var(--red);font-family:'Inter'}
  .intel .cod .l{font-size:10.5px;color:var(--txt-soft)}
  .hscore{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:2px 9px;border-radius:6px;font-weight:800;margin-right:8px}
  .hscore.good{background:rgba(16,185,129,.14);color:var(--mint)}
  .hscore.mid{background:rgba(245,179,1,.14);color:var(--gold)}
  .hscore.low{background:rgba(239,68,68,.14);color:var(--red)}
  .delay-cost{background:rgba(239,68,68,.08);border-radius:9px;padding:8px 12px;font-size:12px;color:var(--red);font-weight:600;margin-top:8px}

  .attention{background:linear-gradient(135deg,rgba(239,68,68,.1),transparent);border:1px solid rgba(239,68,68,.3);border-radius:14px;padding:14px 18px;margin-bottom:16px}
  .attention .h{font-size:13.5px;font-weight:800;color:var(--red);margin-bottom:8px;display:flex;align-items:center;gap:7px}
  .attention .item{font-size:12.5px;color:var(--txt-soft);padding:3px 0}
  .eva{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
  .eva .box{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 13px}
  .eva .box .l{font-size:10.5px;color:var(--txt-mute);margin-bottom:3px}
  .eva .box .v{font-size:12.5px;font-weight:600}
  .lesson{background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.2);border-radius:10px;padding:10px 13px;font-size:12px;color:#93c5fd;margin-top:8px}
</style>
</head>
<body>
<header>
  <div class="head-in">
    <a class="brand" href="company-dashboard.html"><span class="bell">🔔</span>نبّاه</a>
    <a class="btn" href="company-command-center.html">🎛️ مركز القيادة</a>
  </div>
</header>
<div class="wrap">
  <h1>⚡ مركز القرارات والإجراءات</h1>
  <div class="sub">حوّل كل مشكلة إلى قرار متتبَّع — مسؤول، موعد، ونبّاه يقيس النتيجة تلقائياً (المبيعات قبل/بعد).</div>

  <div id="loading"><div class="spin"></div></div>
  <div id="content" style="display:none">
    <div id="attentionBox"></div>
    <div id="intelBanner"></div>
    <div class="stats" id="stats"></div>
    <button class="new-btn" id="newBtn" onclick="toggleForm()">⚡ اعتمد قراراً جديداً</button>

    <div class="form" id="decForm">
      <h3>قرار جديد</h3>
      <div class="frow">
        <div class="field full"><label>القرار *</label><input id="fTitle" placeholder="مثال: خفض تكلفة المشتريات 12%"></div>
      </div>
      <div class="frow">
        <div class="field"><label>المسؤول</label><input id="fOwner" placeholder="مثال: مدير العمليات"></div>
        <div class="field"><label>موعد الإنجاز</label><input id="fDue" type="date"></div>
      </div>
      <div class="frow">
        <div class="field full"><label>مؤشر النجاح (KPI)</label><input id="fKpi" placeholder="مثال: توفير 45,000 ريال شهرياً"></div>
      </div>
      <div class="frow">
        <div class="field full"><label>التوقّع (ماذا تتوقّع من هذا القرار؟)</label><input id="fExpected" placeholder="مثال: زيادة المبيعات 20% خلال 60 يوم"><div style="font-size:10.5px;color:var(--txt-mute);margin-top:4px">← نبّاه يقارن توقّعك بالنتيجة الفعلية عند الإغلاق</div></div>
      </div>
      <div class="fbtns">
        <button class="sbtn" onclick="saveDecision()">حفظ القرار للمتابعة</button>
        <button class="sbtn ghost" onclick="toggleForm()">إلغاء</button>
      </div>
      <div id="formMsg" style="font-size:12.5px;margin-top:10px;font-weight:600"></div>
    </div>

    <div id="decList"></div>
  </div>
</div>
<script>
const TOKEN=localStorage.getItem("nabbah_token")||"";
if(!TOKEN) window.location.href="login.html";
async function api(p,o={}){
  const r=await fetch(p,{...o,headers:{"Content-Type":"application/json","Authorization":"Bearer "+TOKEN,...(o.headers||{})}});
  if(r.status===401){ localStorage.removeItem("nabbah_token"); window.location.href="login.html"; throw new Error("جلسة"); }
  const d=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.detail||"خطأ");
  return d;
}
function toggleForm(){ document.getElementById("decForm").classList.toggle("show"); }
async function saveDecision(){
  const title=document.getElementById("fTitle").value.trim();
  const msg=document.getElementById("formMsg");
  if(!title){ msg.style.color="#ef4444"; msg.textContent="اكتب القرار أولاً"; return; }
  msg.style.color="#8ba396"; msg.textContent="جارٍ الحفظ…";
  try{
    await api("/company/decisions/save",{method:"POST",body:JSON.stringify({
      title, owner:document.getElementById("fOwner").value.trim(),
      due_date:document.getElementById("fDue").value, kpi:document.getElementById("fKpi").value.trim(), expected_impact:document.getElementById("fExpected").value.trim()
    })});
    document.getElementById("fTitle").value=""; document.getElementById("fOwner").value="";
    document.getElementById("fKpi").value=""; document.getElementById("fDue").value=""; if(document.getElementById("fExpected"))document.getElementById("fExpected").value="";
    toggleForm(); load();
  }catch(e){ msg.style.color="#ef4444"; msg.textContent=e.message; }
}
async function closeDecision(id){
  const note=prompt("ملاحظة النتيجة (اختياري):")||"";
  try{
    await api("/company/decisions/close",{method:"POST",body:JSON.stringify({id,status:"done",result_note:note})});
    load();
  }catch(e){ alert(e.message); }
}
async function load(){
  try{
    const d=await api("/company/decisions");
    document.getElementById("loading").style.display="none";
    document.getElementById("content").style.display="block";
    const items=d.items||[];
    const done=items.filter(x=>x.status==="done").length;
    // تنبيه: قرارات تحتاج تدخّل
    if(d.needs_attention && d.needs_attention.length){
      document.getElementById("attentionBox").innerHTML=`<div class="attention">
        <div class="h">🔔 يحتاج انتباهك (${d.needs_attention.length})</div>
        ${d.needs_attention.map(a=>`<div class="item">• ${a}</div>`).join("")}
      </div>`;
    } else { document.getElementById("attentionBox").innerHTML=""; }
    // بانر ذكاء القرارات المؤسسية
    const iscore=d.intelligence_score||0;
    const icolor=iscore>=75?"var(--mint)":(iscore>=50?"var(--gold)":"var(--red)");
    const codHtml=(d.total_delay_cost&&d.total_delay_cost>0)?`<div class="cod"><div class="v">${d.total_delay_cost.toLocaleString()} ر</div><div class="l">تكلفة التأخير التقديرية</div></div>`:"";
    document.getElementById("intelBanner").innerHTML= items.length?`<div class="intel">
      <div class="score" style="color:${icolor}">${iscore}<span style="font-size:16px;color:var(--txt-mute)">/100</span></div>
      <div class="txt"><div class="t">درجة ذكاء القرارات المؤسسية</div><div class="s">جودة منظومة اتخاذ القرار لديكم — كل ما زادت، زادت دقة وانضباط قراراتكم.</div></div>
      ${codHtml}
    </div>`:"";
    document.getElementById("stats").innerHTML=`
      <div class="stat"><div class="v">${items.length}</div><div class="l">إجمالي القرارات</div></div>
      <div class="stat"><div class="v" style="color:var(--gold)">${d.open_count||0}</div><div class="l">قيد التنفيذ</div></div>
      <div class="stat"><div class="v" style="color:var(--red)">${d.overdue_count||0}</div><div class="l">متأخرة</div></div>
      <div class="stat"><div class="v" style="color:var(--mint)">${done}</div><div class="l">مكتملة</div></div>`;
    if(!items.length){
      document.getElementById("decList").innerHTML=`<div class="empty"><div style="font-size:40px;margin-bottom:12px">⚡</div>
        <div style="font-size:16px;font-weight:700;color:var(--txt);margin-bottom:6px">لا قرارات بعد</div>
        <div>حوّل أي مشكلة تكتشفها إلى قرار متتبَّع — نبّاه يقيس نتيجته.</div></div>`;
      return;
    }
    document.getElementById("decList").innerHTML=items.map(x=>{
      const cls=x.status==="done"?"done":(x.overdue?"overdue":"open");
      const badge=x.status==="done"?'<span class="badge done">مكتمل</span>':(x.overdue?'<span class="badge overdue">متأخر</span>':'<span class="badge open">قيد التنفيذ</span>');
      let impact="";
      if(x.impact){
        const c=x.impact.change_pct;
        impact=`<div class="impact"><span>الأثر على المبيعات: </span><span class="big" style="color:${c>=0?'var(--mint)':'var(--red)'}">${c>=0?'+':''}${c}%</span> <span style="color:var(--txt-mute)">(${x.impact.baseline.toLocaleString()} ← ${x.impact.result.toLocaleString()})</span></div>`;
      }
      return `<div class="dec ${cls}">
        <div class="dec-h"><div class="t">${x.title}</div>${badge}</div>
        <div style="margin-bottom:8px"><span class="hscore ${x.health_score>=75?'good':(x.health_score>=50?'mid':'low')}">🎯 جودة القرار ${x.health_score}/100 · ${x.health_label}</span></div>
        ${x.detail?`<div class="dec-detail">${x.detail}</div>`:""}
        <div class="dec-meta">
          ${x.owner?`<span class="m">👤 ${x.owner}</span>`:""}
          ${x.due_date?`<span class="m">📅 ${x.due_date}</span>`:""}
          ${x.kpi?`<span class="m">🎯 ${x.kpi}</span>`:""}
        </div>
        ${x.result_note?`<div class="dec-detail">📝 ${x.result_note}</div>`:""}
        ${impact}
        ${x.expected_vs_actual?`<div class="eva">
          <div class="box"><div class="l">🎯 التوقّع</div><div class="v">${x.expected_vs_actual.expected}</div></div>
          <div class="box"><div class="l">📊 الفعلي</div><div class="v">${x.expected_vs_actual.actual}</div></div>
        </div>`:""}
        ${x.lesson?`<div class="lesson">🧠 الدرس: ${x.lesson}</div>`:""}
        ${(x.delay_cost&&x.delay_cost>0)?`<div class="delay-cost">💰 تكلفة التأخير: ~${x.delay_cost.toLocaleString()} ريال (متأخر ${x.delay_days} يوم) — كل يوم تأخير له ثمن.</div>`:""}
        ${x.status==="open"?`<div class="dec-actions"><button class="act-btn done" onclick="closeDecision(${x.id})">✓ إغلاق وقياس النتيجة</button></div>`:""}
      </div>`;
    }).join("");
  }catch(e){
    document.getElementById("loading").innerHTML='<p style="text-align:center;color:var(--red)">'+e.message+'</p>';
  }
}
const params=new URLSearchParams(location.search);
if(params.get("title")){
  setTimeout(()=>{ document.getElementById("decForm").classList.add("show");
    document.getElementById("fTitle").value=params.get("title");
    if(params.get("detail")) document.getElementById("fKpi").value=params.get("detail"); },400);
}
load();
</script>
<script src="i18n.js"></script>
<script src="nabbah-sidebar.js"></script>
</body>
</html>
