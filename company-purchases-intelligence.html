<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>نبّاه · ذكاء المشتريات</title>
<link href="nabbah-design.css" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{background:var(--bg,#070b09);color:var(--txt,#e8f1ec);font-family:Tajawal,Tahoma,Arial,sans-serif;margin:0}
  .wrap{max-width:1180px;margin:0 auto;padding:70px 16px 60px}
  h1{margin:0 0 4px;font-size:24px}.sub{color:var(--txt-soft,#8ba396);margin:0 0 16px;font-size:14px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
  select{background:var(--panel,#101a15);color:var(--txt,#e8f1ec);border:1px solid var(--line,#1d2c24);border-radius:10px;padding:8px 10px;font:inherit;font-size:13px;max-width:190px}
  .crumbs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;min-height:4px}
  .chip{background:rgba(16,185,129,.12);color:var(--mint,#10b981);border:1px solid rgba(16,185,129,.35);border-radius:20px;padding:3px 10px;font-size:12px;cursor:pointer}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
  .tile,.panel{background:var(--panel,#101a15);border:1px solid var(--line,#1d2c24);border-radius:14px;padding:14px}
  .tile .l{font-size:12px;color:var(--txt-soft,#8ba396)}.tile .v{font-size:21px;font-weight:800;margin-top:4px}
  .tile .c{font-size:12px;margin-top:4px}
  .panel{margin-bottom:14px;min-width:0}.panel h2{margin:0 0 10px;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .panel h3{margin:12px 0 6px;font-size:13px;color:var(--txt-soft,#8ba396)}
  .num{font-size:11px;color:var(--txt-soft,#8ba396);font-weight:600;border:1px solid var(--line,#1d2c24);border-radius:8px;padding:1px 6px}
  .grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
  table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px;border-bottom:1px solid var(--line,#1d2c24);text-align:start;white-space:nowrap}
  th{color:var(--txt-soft,#8ba396);font-weight:600}.tbl{overflow-x:auto}
  tr.drill{cursor:pointer}tr.drill:hover td{background:rgba(16,185,129,.06)}
  .barrow{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}
  .barrow.drill{cursor:pointer}.barrow.drill:hover{background:rgba(16,185,129,.06);border-radius:6px}
  .barrow .t{flex:0 0 120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .barrow .g{flex:1;height:10px;background:var(--line,#1d2c24);border-radius:6px;overflow:hidden}
  .barrow .g i{display:block;height:100%;background:var(--mint,#10b981)}
  .pos{color:#10b981}.neg{color:#ef4444}.muted{color:var(--txt-soft,#8ba396);font-size:12px}
  .b{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:700;display:inline-block}
  .high{background:rgba(234,88,12,.16);color:#ea580c}.medium{background:rgba(245,179,1,.15);color:#f5b301}
  .low{background:rgba(16,185,129,.15);color:#10b981}.critical{background:rgba(239,68,68,.16);color:#ef4444}
  .est{background:rgba(168,85,247,.15);color:#a855f7}
  .sig{border-inline-start:4px solid var(--line,#1d2c24);padding:10px 12px;margin:8px 0;background:rgba(255,255,255,.02);border-radius:8px}
  .sig.risk{border-color:#ef4444}.sig.opportunity{border-color:#10b981}.sig.data_quality{border-color:#f5b301}
  .btn{background:var(--mint,#10b981);color:#062b1c;border:0;border-radius:10px;padding:7px 13px;font-weight:800;cursor:pointer;font:inherit;font-size:12px;text-decoration:none;display:inline-block}
  .btn.ghost{background:transparent;color:var(--txt-soft,#8ba396);border:1px solid var(--line,#1d2c24);font-weight:600}
  .btn:disabled{opacity:.5;cursor:default}
  .state{padding:36px 16px;text-align:center;color:var(--txt-soft,#8ba396);border:1px dashed var(--line,#1d2c24);border-radius:14px}
  .na{color:var(--txt-soft,#8ba396);font-size:13px;padding:10px;border:1px dashed var(--line,#1d2c24);border-radius:10px}
  svg.ch{width:100%;height:170px;display:block}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--txt-soft,#8ba396);margin-top:6px;flex-wrap:wrap}
  .legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-inline-end:4px}
  .ai-sec{margin:8px 0}.ai-sec b{display:block;font-size:13px;margin-bottom:4px}.ai-sec li{font-size:13px;margin:3px 0}
  input.f{flex:1;min-width:120px;background:var(--panel,#101a15);color:inherit;border:1px solid var(--line,#1d2c24);border-radius:8px;padding:6px}
  .st{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:700;display:inline-block;white-space:nowrap}
  .st.healthy{background:rgba(16,185,129,.15);color:#10b981}.st.watch{background:rgba(245,179,1,.15);color:#f5b301}
  .st.low{background:rgba(234,88,12,.16);color:#ea580c}.st.stockout{background:rgba(239,68,68,.16);color:#ef4444}
  .st.slow{background:rgba(59,130,246,.15);color:#60a5fa}.st.obsolete{background:rgba(148,163,184,.18);color:#cbd5e1}
  .chips{display:flex;gap:8px;flex-wrap:wrap}.schip{cursor:pointer;border:1px solid var(--line,#1d2c24);border-radius:12px;padding:8px 12px;min-width:120px}
  .schip b{display:block;font-size:18px}.schip:hover{border-color:var(--mint,#10b981)}
  .eq{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px}.eq .box{border:1px solid var(--line,#1d2c24);border-radius:10px;padding:8px 10px;text-align:center;min-width:90px}
  .eq .box b{display:block;font-size:16px}
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
  .ov.on{display:flex}.modal{background:var(--panel,#101a15);border:1px solid var(--line,#1d2c24);border-radius:16px;padding:18px;width:min(560px,100%);max-height:90vh;overflow:auto}
  .fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fg label{font-size:12px;color:var(--txt-soft,#8ba396);display:flex;flex-direction:column;gap:4px}
  .fg input,.fg select{background:var(--bg,#070b09);color:inherit;border:1px solid var(--line,#1d2c24);border-radius:9px;padding:8px;font:inherit;max-width:none}
  .cta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  @media(max-width:760px){.fg{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.tile{padding:10px}.tile .v{font-size:17px}.grid2,.grid3{grid-template-columns:minmax(0,1fr)}h1{font-size:20px}select{max-width:47%}}
</style>
<style>
  .tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line,#1d2c24);margin:6px 0 16px}
  .tab{background:none;border:0;color:var(--txt-soft,#8ba396);padding:10px 14px;font:inherit;font-size:14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab.on{color:var(--txt,#e8f1ec);border-color:var(--mint,#10b981);font-weight:800}
  .hero{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:12px;margin-bottom:14px}
  .hcard{background:var(--panel,#101a15);border:1px solid var(--line,#1d2c24);border-radius:16px;padding:16px;cursor:default}
  .hcard.click{cursor:pointer}.hcard.click:hover{border-color:var(--mint,#10b981)}
  .hcard .big{font-size:30px;font-weight:900;margin:6px 0}.hstat{font-size:22px;font-weight:900}
  .hs-stable{color:#10b981}.hs-attention{color:#f5b301}.hs-critical{color:#ef4444}
  .event{background:var(--panel,#101a15);border:1px solid var(--line,#1d2c24);border-inline-start:4px solid #ef4444;border-radius:12px;padding:14px;margin-bottom:10px}
  .event.opportunity{border-inline-start-color:#10b981}.event.data_quality{border-inline-start-color:#f5b301}
  .event h4{margin:0 0 6px;font-size:15px}.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .rec{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;font-size:13px;margin-top:8px}.rec b{color:var(--txt-soft,#8ba396);font-weight:600}
  .flow{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap;justify-content:center}
  .fnode{background:var(--panel,#101a15);border:1px solid var(--line,#1d2c24);border-radius:14px;padding:14px 18px;text-align:center;min-width:140px}
  .fnode .big{font-size:22px;font-weight:900}.farrow{align-self:center;font-size:22px;color:var(--txt-soft,#8ba396)}
  .ptip{background:var(--bg,#070b09);border:1px solid var(--mint,#10b981);border-radius:12px;padding:12px;margin-top:8px;font-size:13px}
  .search{flex:1;min-width:180px;background:var(--panel,#101a15);color:inherit;border:1px solid var(--line,#1d2c24);border-radius:10px;padding:9px 12px;font:inherit}
  .perf{display:grid;grid-template-columns:70px 1fr 50px;gap:8px;align-items:center;font-size:13px;margin:8px 0}
  .perf .g{height:10px;background:var(--line,#1d2c24);border-radius:6px;overflow:hidden}.perf .g i{display:block;height:100%}
  .life{display:flex;gap:0;align-items:center;flex-wrap:wrap;margin:10px 0}.lstep{text-align:center;min-width:110px}
  .ldot{width:16px;height:16px;border-radius:50%;margin:0 auto 6px;background:var(--line,#1d2c24)}.ldot.on{background:var(--mint,#10b981)}
  .lline{flex:1;min-width:30px;height:2px;background:var(--line,#1d2c24);margin-bottom:22px}
  .back{background:none;border:0;color:var(--mint,#10b981);cursor:pointer;font:inherit;padding:0;margin-bottom:10px}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:6px}
  @media(max-width:900px){.hero{grid-template-columns:1fr 1fr}}
  @media(max-width:560px){.hero{grid-template-columns:1fr}.tab{padding:8px 10px;font-size:13px}.rec{grid-template-columns:1fr}}
</style>

</head>
<body>
<div class="wrap">
  <h1>ذكاء المشتريات</h1>
  <p class="sub">ماذا يحدث في مشتريات الشركة؟ ولماذا؟ وما القرارات المطلوبة؟</p>
  <div class="bar">
    <select id="fPeriod"></select><select id="fGrain"></select><select id="fBranch"></select><select id="fCategory"></select>
    <select id="fProduct"></select><select id="fSupplier"></select><select id="fStatus"></select>
    <button class="btn ghost" id="reset">إعادة الضبط</button>
  </div>
  <div class="crumbs" id="crumbs"></div>
  <nav class="tabs" id="tabs"></nav>
  <div id="content"><div class="state">…</div></div>
</div>
<div class="ov" id="ov"><div class="modal" id="modal"></div></div>
<script src="i18n.js"></script>
<script>
(function(){
  const TOKEN=localStorage.getItem("nabbah_token")||"";if(!TOKEN){location.href="login.html";return;}
  const TABS=[["overview","نظرة عامة"],["suppliers","الموردون"],["pos","أوامر الشراء"],["spend","الإنفاق"],["cost","التكاليف"],["risks","المخاطر والفرص"],["links","الربط مع المبيعات والمخزون"]];
  const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const n=(v,d=2)=>v==null?"—":Number(v).toLocaleString("ar-SA",{maximumFractionDigits:d});
  const mv=m=>m&&m.value!=null?n(m.value,0):"—";
  const pct=(v,inv)=>v==null?"—":`<span class="${(inv?v<=0:v>=0)?"pos":"neg"}">${v>0?"+":""}${n(v)}%</span>`;
  const t=k=>({noDim:"لا توجد بيانات"})[k]||k;
  const H={Authorization:"Bearer "+TOKEN,"Content-Type":"application/json"},$=id=>document.getElementById(id);
  const SEV={high:"عالٍ",medium:"متوسط",low:"منخفض",critical:"حرج"};
  const HEALTH={stable:["مستقرة","🟢"],attention:["تحتاج انتباه","🟠"],critical:["حرجة","🔴"]};
  let D=null;
  const FL=[["period","fPeriod"],["grain","fGrain"],["branch_id","fBranch"],["category","fCategory"],["product","fProduct"],["supplier","fSupplier"],["status","fStatus"]];
  function F(){const f={};FL.forEach(([k,id])=>{const v=$(id).value;if(v)f[k]=v;});return f;}
  const route=()=>{const h=decodeURIComponent(location.hash.slice(1)||"overview");const i=h.indexOf("/");return i<0?[h,""]:[h.slice(0,i),h.slice(i+1)];};
  const go=(v,arg)=>{location.hash=arg!=null?`${v}/${encodeURIComponent(arg)}`:v;};
  window.addEventListener("hashchange",()=>{if(D)render();});
  function load(){$("content").innerHTML=`<div class="state">…</div>`;
    fetch("/company/purchases-intelligence?"+new URLSearchParams(F()),{headers:H}).then(async r=>{
      if(r.status===401){location.href="login.html";return null;}
      if(r.status===403||r.status===402){$("content").innerHTML=`<div class="state">ليست لديك صلاحية لهذه الصفحة.</div>`;return null;}
      if(!r.ok){let d="";try{const j=await r.json();d=typeof j.detail==="string"?j.detail:JSON.stringify(j.detail||j);}catch(_){}err(`HTTP ${r.status}${d?" — "+d:""}`);return null;}
      return r.json();}).then(d=>{if(!d)return;D=d;try{filters(d);}catch(e){console.error(e);}try{render();}catch(e){console.error(e);err("render: "+(e&&e.message||e));}}).catch(e=>err("network: "+(e&&e.message||e)));}
  function err(m){$("content").innerHTML=`<div class="state neg">تعذّر تحميل ذكاء المشتريات.<div class="muted" style="margin-top:8px">${esc(m)}</div></div>`;}
  function opts(id,list,label,cur,val=x=>x,txt=x=>x){$(id).innerHTML=`<option value="">${esc(label)}: الكل</option>`+list.map(x=>`<option value="${esc(val(x))}" ${String(cur??"")===String(val(x))?"selected":""}>${esc(txt(x))}</option>`).join("");}
  function filters(d){const o=d.options||{},f=d.filters||{};
    $("fPeriod").innerHTML=(d.periods||[]).slice().reverse().map(p=>`<option value="${esc(p)}" ${f.period===p?"selected":""}>${esc(p)}</option>`).join("")||`<option value="">الفترة</option>`;
    $("fGrain").innerHTML=[["day","يومي"],["week","أسبوعي"],["month","شهري"],["quarter","ربع سنوي"],["year","سنوي"]].map(([g,l])=>`<option value="${g}" ${(f.grain||"month")===g?"selected":""}>${l}</option>`).join("");
    opts("fBranch",o.branch_list||[],"الفرع",f.branch_id,b=>b.id,b=>b.name);opts("fCategory",o.categories||[],"الفئة",f.category);
    opts("fProduct",o.products||[],"الصنف",f.product);opts("fSupplier",o.suppliers||[],"المورد",f.supplier);opts("fStatus",o.statuses||[],"الحالة",f.status);
    $("fStatus").style.display=(o.statuses||[]).length?"":"none";
    const c=[];[["fBranch","branch_id","الفرع"],["fCategory","category","الفئة"],["fProduct","product","الصنف"],["fSupplier","supplier","المورد"],["fStatus","status","الحالة"]].forEach(([id,k,l])=>{if(f[k]){let v=f[k];if(k==="branch_id"){const b=(o.branch_list||[]).find(x=>String(x.id)===String(v));v=b?b.name:v;}c.push([id,l+": "+v]);}});
    $("crumbs").innerHTML=c.map(([id,l])=>`<span class="chip" data-clear="${id}">${esc(l)} ✕</span>`).join("");
    $("crumbs").querySelectorAll("[data-clear]").forEach(x=>x.onclick=()=>{$(x.dataset.clear).value="";load();});}
  function setFilter(sel,val){const s=$(sel);if(![...s.options].some(o=>o.value===String(val))){const o=document.createElement("option");o.value=val;o.textContent=val;s.appendChild(o);}s.value=String(val);load();}
  const panel=(title,body,extra="")=>`<div class="panel"><h2>${title}${extra}</h2>${body}</div>`;
  const na=m=>`<div class="na">${esc(m)}</div>`;
  const btn=(label,act,arg,ghost)=>`<button class="btn${ghost?" ghost":""}" data-act="${act}" data-arg="${esc(arg??"")}">${label}</button>`;
  function chart(labels,series){
    if(!labels.length)return na(t("noDim"));
    const W=640,Hh=160,all=series.flatMap(s=>s.values.filter(v=>v!=null));
    if(!all.length)return na(t("noDim"));
    const max=Math.max(...all),min=Math.min(...all,0),rng=(max-min)||1;
    const x=i=>labels.length<2?W/2:(i/(labels.length-1))*(W-20)+10,y=v=>Hh-12-((v-min)/rng)*(Hh-30);
    const lines=series.map(s=>{let seg=[],out="";const flush=()=>{if(seg.length)out+=`<polyline points="${seg.join(" ")}" fill="none" stroke="${s.color}" stroke-width="2" ${s.dash?'stroke-dasharray="5 4"':""}/>`;seg=[];};
      s.values.forEach((v,i)=>{if(v==null)flush();else seg.push(`${x(i).toFixed(1)},${y(v).toFixed(1)}`);});flush();
      out+=s.values.map((v,i)=>v==null?"":`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.6" fill="${s.color}"><title>${esc(labels[i])}: ${n(v)}</title></circle>`).join("");return out;}).join("");
    return `<svg class="ch" viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="none">${lines}</svg>
      <div class="legend"><span>${esc(labels[0])} → ${esc(labels[labels.length-1])}</span>${series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.label)}</span>`).join("")}</div>`;
  }
  // رسم تفاعلي: الفعلي + الفترة السابقة (منقّط) + نقاط قابلة للضغط
  function ichart(tr){if(!tr.length)return na("لا توجد بيانات");
    const W=640,Hh=180,vals=tr.map(x=>x.spend.value),prev=[null,...vals.slice(0,-1)],all=vals.concat(prev.filter(v=>v!=null)),max=Math.max(...all,1),min=Math.min(...all,0),rg=(max-min)||1;
    const x=i=>tr.length<2?W/2:(i/(tr.length-1))*(W-30)+15,y=v=>Hh-16-((v-min)/rg)*(Hh-36);
    const line=(arr,col,dash)=>{const pts=arr.map((v,i)=>v==null?null:`${x(i).toFixed(1)},${y(v).toFixed(1)}`).filter(Boolean);return pts.length?`<polyline points="${pts.join(" ")}" fill="none" stroke="${col}" stroke-width="2" ${dash?'stroke-dasharray="5 5"':""}/>`:"";};
    return `<svg class="ch" viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="none" style="height:190px">${line(prev,"#64748b",1)}${line(vals,"#10b981")}
      ${tr.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(p.spend.value).toFixed(1)}" r="6" fill="#10b981" style="cursor:pointer" data-pt="${i}"><title>${esc(p.period)}</title></circle>`).join("")}</svg>
      <div class="legend"><span><i style="background:#10b981"></i>الفعلي</span><span><i style="background:#64748b"></i>الفترة السابقة</span><span>اضغط أي نقطة للتفاصيل</span></div><div id="ptip"></div>`;}
  function ptip(i){const p=D.trend[i];$("ptip").innerHTML=`<div class="ptip"><b>${esc(p.period)}</b> · المشتريات: <b>${mv(p.spend)}</b> · النمو: ${pct(p.growth_pct)} · أوامر الشراء: ${n(p.pos,0)} · أكبر مورد: <b>${esc(p.top_supplier||"—")}</b>
    <div class="acts">${btn("عرض الفترة","period",p.period,1)}${p.top_supplier?btn("فتح المورد","supplier",p.top_supplier,1):""}</div></div>`;bindActs($("ptip"));}
  // ═══ النظرة العامة
  function eventCard(s){const sup=(D.suppliers||[]).some(x=>x.supplier===s.dimension),prod=(D.products||[]).some(x=>x.product_sku===s.dimension);
    return `<div class="event ${esc(s.type)}"><h4>${s.type==="risk"?"🔴":s.type==="opportunity"?"🟢":"🟡"} ${esc(s.name_ar)}${s.dimension?` — ${esc(s.dimension)}`:""}</h4>
      <div class="muted">${(s.evidence||[]).map(esc).join(" · ")}</div>${s.estimated_impact?`<div style="margin-top:6px">الأثر التقديري: <b>${mv(s.estimated_impact)}</b> <span class="b est">تقديري</span></div>`:""}
      <div class="acts">${btn("عرض التفاصيل","risks",s.id,1)}${sup?btn("فتح المورد","supplier",s.dimension,1):""}${prod?btn("تحليل التكلفة","product",s.dimension,1):""}${s.code==="supplier_concentration"?btn("تحليل التركّز","spend","",1):""}</div></div>`;}
  function overview(){const d=D,k=d.kpis,h=d.health||{},[hl,hi]=HEALTH[h.status]||["—",""];
    const kt=(l,v,c)=>`<div class="tile"><div class="l">${l}</div><div class="v">${v}</div><div class="c">${c||""}</div></div>`;
    const kv=x=>x.current==null?`<span class="muted" style="font-size:14px">غير متاح</span>`:null;
    const tiles=`<div class="tiles" style="grid-template-columns:repeat(3,minmax(0,1fr))">

      <div class="muted">${esc(sv.basis_ar||"")}</div>`;}
  function product360(sku){const p=(D.products||[]).find(x=>x.product_sku===sku);if(!p)return `<button class="back" data-go="cost">→ التكاليف</button>`+na("الصنف غير موجود في هذه الفترة/الفلاتر");
    return `<button class="back" data-go="cost">→ التكاليف</button><div class="panel"><h2 style="font-size:20px">${esc(p.product_sku)}</h2><div class="muted">${esc(p.category||"")}</div>
      <div class="tiles" style="margin-top:12px"><div class="tile"><div class="l">الإنفاق</div><div class="v">${mv(p.spend)}</div></div><div class="tile"><div class="l">الكمية</div><div class="v">${n(p.qty,0)}</div></div><div class="tile"><div class="l">متوسط السعر</div><div class="v">${n(p.avg_unit_cost)}</div><div class="c">${p.baseline_unit_cost!=null?`التاريخي ${n(p.baseline_unit_cost)} ${pct(p.variance_pct,true)}`:""}</div></div><div class="tile"><div class="l">الموردون</div><div class="v">${n(p.suppliers.length,0)}</div></div></div></div>
      <div class="grid2">${panel("اتجاه السعر",chart(p.cost_trend.map(x=>x.period),[{label:"متوسط سعر الوحدة",values:p.cost_trend.map(x=>x.avg_unit_cost),color:"#60a5fa"}]))}${panel("مقارنة الموردين",compareBody(p))}</div>
      <div class="acts"><a class="btn ghost" href="company-inventory-intelligence.html">مخزون الصنف ←</a><a class="btn ghost" href="company-sales-intelligence.html">مبيعات الصنف ←</a>${btn("تطبيق كفلتر","filterprod",p.product_sku,1)}</div>`;}
  const compareBody=p=>(p.supplier_prices||[]).length?(p.supplier_prices.map((s,i)=>`<div class="barrow drill" data-go="supplier" data-arg="${esc(s.supplier)}"><span class="t">${i===0?"✓ ":""}${esc(s.supplier)}</span><span>${n(s.avg_unit_cost)}</span></div>`).join("")+(p.potential_saving?`<div style="margin-top:6px">وفر ممكن: <b>${mv(p.potential_saving)}</b> <span class="b est">تقديري</span></div>`:"")+(p.supplier_prices.length<2?`<div class="muted">مورد واحد فقط — لا مقارنة</div>`:"")):na("لا توجد أسعار موردين");
  // ═══ المخاطر والفرص
  function recCard(s,i){const sup=(D.suppliers||[]).some(x=>x.supplier===s.dimension),prod=(D.products||[]).some(x=>x.product_sku===s.dimension);
    return `<div class="event ${esc(s.type)}" id="sig-${esc(s.id)}"><h4>${i+1}. ${esc(s.name_ar)}${s.dimension?` — ${esc(s.dimension)}`:""} <span class="b ${esc(s.severity)}">${SEV[s.severity]||s.severity}</span></h4>
      <div class="rec"><b>المشكلة</b><span>${esc(s.name_ar)}${s.dimension?` (${esc(s.dimension)})`:""}</span><b>الدليل</b><span>${(s.evidence||[]).map(esc).join(" · ")}</span><b>الأثر</b><span>${s.estimated_impact?`<b>${mv(s.estimated_impact)}</b> <span class="b est">تقديري</span>`:"غير قابل للتقدير من البيانات"}</span><b>الإجراء المقترح</b><span>${esc(s.suggested_action_ar)}</span></div>
      <div class="acts"><button class="btn" data-sig="${esc(s.id)}">إنشاء قرار + مهمة</button>${sup?btn("فتح المورد","supplier",s.dimension,1):""}${prod?btn("مقارنة الموردين","product",s.dimension,1):""}${s.code==="supplier_concentration"?btn("تحليل التركّز","spend","",1):""}${s.code==="po_cycle_delay"||s.code==="delivery_risk"?btn("فتح أوامر الشراء","posof",s.dimension,1):""}</div><div class="frm"></div></div>`;}
  function risks(){const r=(D.signals||[]).filter(s=>s.type==="risk"),o=(D.signals||[]).filter(s=>s.type==="opportunity"),q=(D.signals||[]).filter(s=>s.type==="data_quality");
    return panel(`🔴 ${n(r.length,0)} إجراءات مطلوبة`,r.length?r.map(recCard).join(""):na("لا توجد مخاطر وفق القواعد"))+panel(`🟢 ${n(o.length,0)} فرص`,o.length?o.map(recCard).join(""):na("لا توجد فرص مكتشفة"))+
      panel("أصناف تحتاج شراء (من ذكاء المخزون)",(D.reorder_options||[]).length?D.reorder_options.map(r=>`<div class="event ${r.inventory_status==="stockout"?"":"data_quality"}"><h4>${esc(r.product_sku)} — ${esc(r.branch||"")} · ${r.inventory_status==="stockout"?"نافد":"منخفض"}</h4>${r.options.length?r.options.map(o=>`<div class="barrow drill" data-go="supplier" data-arg="${esc(o.supplier)}"><span class="t">${esc(o.supplier)}</span><span>السعر ${n(o.avg_unit_cost)}</span><span class="muted">في الموعد ${o.on_time_pct==null?"—":n(o.on_time_pct)+"%"} · القبول ${o.acceptance_pct==null?"—":n(o.acceptance_pct)+"%"}</span></div>`).join(""):`<div class="muted">لا يوجد مورد سابق لهذا الصنف</div>`}</div>`).join(""):na("لا توجد أصناف منخفضة أو نافدة حالياً"))+
      panel(`🟡 ${n(q.length,0)} جودة البيانات`,(q.map(s=>`<div class="event data_quality"><h4>${esc(s.name_ar)}</h4><div class="muted">${(s.evidence||[]).map(esc).join(" · ")}</div><div>${esc(s.suggested_action_ar)}</div></div>`).join("")||"")+Object.entries(D.availability||{}).filter(([k,v])=>!v.available).map(([k,v])=>`<div class="barrow"><span class="neg">غير متاح</span><span class="muted">${esc(v.how_ar)}</span></div>`).join("")+`<div class="acts"><a class="btn ghost" href="company-data-center.html">ارفع ملف المشتريات</a></div>`);}
  // ═══ الربط
  function links(){const c=D.cross||{by_category:[],by_branch:[]},tb=(list,l)=>!list.length?"":`<div class="tbl"><table><thead><tr><th>${l}</th><th>المشتريات</th><th>Δ</th><th>المبيعات</th><th>Δ</th><th>المخزون</th><th>Δ</th><th>الفجوة</th></tr></thead><tbody>${list.map(x=>`<tr><td><b>${esc(x.key)}</b></td><td>${mv(x.purchases)}</td><td>${pct(x.purchases_change_pct)}</td><td>${mv(x.sales)}</td><td>${pct(x.sales_change_pct)}</td><td>${mv(x.inventory_value)}</td><td>${pct(x.inventory_change_pct)}</td><td>${x.gap_pts==null?"—":`<span class="${x.gap_pts>=D.rules.purchase_sales_gap_pts?"neg":""}">${x.gap_pts>0?"+":""}${n(x.gap_pts)} نقطة</span>`}</td></tr>`).join("")}</tbody></table></div>`;
    return panel("السلسلة على مستوى الشركة",flowChain()+`<div class="acts" style="justify-content:center"><a class="btn ghost" href="company-sales-intelligence.html">بيانات المبيعات</a><a class="btn ghost" href="company-inventory-intelligence.html">بيانات المخزون</a>${D.concentration&&D.concentration.top_supplier?btn("فتح أكبر مورد","supplier",D.concentration.top_supplier,1):""}</div>`)+
      panel("حسب الفئة",tb(c.by_category,"الفئة")||na(D.availability.cross_module.how_ar))+panel("حسب الفرع",tb(c.by_branch,"الفرع"))+`<div class="muted">${esc(c.note_ar||"")} · الفجوة = نمو المشتريات − نمو المبيعات، والتنبيه عند ≥ ${D.rules.purchase_sales_gap_pts} نقطة.</div>`;}
  // ═══ الموجّه
  function render(){const d=D;
    if(!d.has_data){$("tabs").innerHTML="";const r=d.required||{};$("content").innerHTML=`<div class="state"><div style="font-size:16px;margin-bottom:10px">${esc(d.message_ar)}</div><div class="muted">المطلوب: ${(r.required||[]).map(esc).join("، ")}</div><div class="muted">مستحسن: ${(r.recommended||[]).map(esc).join("، ")}</div><div class="muted">اختياري: ${(r.optional||[]).map(esc).join("، ")}</div><div class="cta" style="justify-content:center"><a class="btn" href="company-data-center.html">ارفع ملف المشتريات</a></div></div>`;return;}
    const [v,arg]=route(),tabOf={supplier:"suppliers",po:"pos",product:"cost"}[v]||v;
    $("tabs").innerHTML=TABS.map(([k,l])=>`<button class="tab ${k===tabOf?"on":""}" data-go="${k}">${l}${k==="risks"&&d.health&&d.health.risks?` <span class="b high">${d.health.risks}</span>`:""}</button>`).join("");
    const view={overview,suppliers,pos,spend,cost,risks,links}[v];
    $("content").innerHTML=v==="supplier"?supplier360(arg):v==="po"?po360(arg):v==="product"?product360(arg):(view?view():overview());
    bindAll();if(v==="risks"&&arg){const el=document.getElementById("sig-"+arg);if(el){el.scrollIntoView({behavior:"smooth",block:"center"});el.style.outline="2px solid #10b981";}}else window.scrollTo(0,0);}
  function bindActs(root){root.querySelectorAll("[data-act]").forEach(el=>el.onclick=e=>{e.stopPropagation();const a=el.dataset.act,g=el.dataset.arg;
      if(a==="supplier")go("supplier",g);else if(a==="product")go("product",g);else if(a==="risks")go("risks",g||null);else if(["spend","cost","suppliers","links"].includes(a))go(a);
      else if(a==="posof"){poSup=g;go("pos");if(route()[0]==="pos")render();}else if(a==="clearposup"){poSup="";render();}else if(a==="period"){setFilter("fPeriod",g);}
      else if(a==="filtersup"){setFilter("fSupplier",g);}else if(a==="filterprod"){setFilter("fProduct",g);}else if(a==="status"){setFilter("fStatus",g);}
      else if(a==="filter"){if(g)setFilter(el.dataset.sel,g);}else if(a==="compare"){const p=(D.products||[]).find(x=>x.product_sku===g);if(p){$("modal").innerHTML=`<h3 style="margin-top:0">مقارنة الموردين — ${esc(g)}</h3>${compareBody(p)}<div class="cta"><button class="btn ghost" id="mClose">إغلاق</button></div>`;$("ov").classList.add("on");$("mClose").onclick=()=>$("ov").classList.remove("on");bindAll($("modal"));}}});
    root.querySelectorAll("[data-go]").forEach(el=>el.onclick=()=>{$("ov").classList.remove("on");go(el.dataset.go,el.dataset.arg||null);});}
  function bindAll(root){root=root||document;bindActs(root);
    root.querySelectorAll("[data-pt]").forEach(c=>c.onclick=()=>ptip(+c.dataset.pt));
    root.querySelectorAll("[data-sig]").forEach(b=>b.onclick=()=>decision(b));
    const q=$("supQ");if(q){q.oninput=()=>{supQ=q.value;const pos_=q.selectionStart;render();const q2=$("supQ");q2.focus();q2.setSelectionRange(pos_,pos_);};}
    const m=$("supMode");if(m)m.onchange=()=>{supMode=m.value;render();};
    const p=$("poQ");if(p){p.oninput=()=>{poQ=p.value;const pos_=p.selectionStart;render();const p2=$("poQ");p2.focus();p2.setSelectionRange(pos_,pos_);};}
    const ab=$("aiBtn");if(ab)ab.onclick=runAI;}
  function decision(b){const box=b.closest(".event").querySelector(".frm");
    box.innerHTML=`<div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap"><input class="f o" placeholder="المسؤول"><input class="f d" type="date"><button class="btn c">إنشاء</button></div><div class="m muted"></div>`;
    box.querySelector(".c").onclick=()=>fetch("/company/purchases/to-decision",{method:"POST",headers:H,body:JSON.stringify(Object.assign({},F(),{signal_id:b.dataset.sig,owner:box.querySelector(".o").value,due_date:box.querySelector(".d").value,period:D.period}))}).then(async r=>{
      const j=await r.json().catch(()=>({}));box.querySelector(".m").textContent=r.ok?"تم إنشاء القرار والمهمة ✓":(typeof j.detail==="string"?j.detail:"HTTP "+r.status);if(r.ok)b.disabled=true;});}
  function runAI(){const b=$("aiBtn"),out=$("aiOut");b.disabled=true;out.innerHTML=`<div class="muted">جارٍ الصياغة…</div>`;
    fetch("/company/purchases/ai-insights",{method:"POST",headers:H,body:JSON.stringify(Object.assign({},F(),{period:D.period}))}).then(async r=>{const j=await r.json().catch(()=>({}));b.disabled=false;
      if(!r.ok){out.innerHTML=`<div class="neg">${esc(typeof j.detail==="string"?j.detail:"HTTP "+r.status)}</div>`;return;}
      const a=j.ai||{},resp=a.response||{},L={FACTS:"الحقائق",INTERPRETATION:"القراءة",HYPOTHESES:"فرضيات غير مؤكدة",RECOMMENDATIONS:"التوصيات",DATA_GAPS:"ما لم يُحتسب لنقص البيانات"};
      out.innerHTML=(a.message?`<div class="na">${esc(a.message)}</div>`:"")+Object.keys(L).map(k=>resp[k]&&resp[k].length?`<div class="ai-sec"><b>${L[k]}</b><ul style="margin:0;padding-inline-start:18px">${resp[k].map(x=>`<li>${esc(typeof x==="string"?x:JSON.stringify(x))}</li>`).join("")}</ul></div>`:"").join("");
    }).catch(e=>{b.disabled=false;out.innerHTML=`<div class="neg">${esc(e.message||e)}</div>`;});}
  $("ov").onclick=e=>{if(e.target===$("ov"))$("ov").classList.remove("on");};
  FL.forEach(([k,id])=>$(id).addEventListener("change",()=>{if(id==="fGrain")$("fPeriod").value="";if(id==="fCategory")$("fProduct").value="";load();}));
  $("reset").onclick=()=>{FL.forEach(([k,id])=>{$(id).value="";});$("fGrain").value="month";poSup="";load();};
  load();
})();
</script>
<script src="nabbah-sidebar.js"></script>
</body></html>
