<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نبّاه · درجة جاهزية التحليل</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="nabbah-design.css" rel="stylesheet">
<style>
  :root{--bg:#070b09;--panel:#101a15;--panel2:#0e1712;--line:#1d2c24;--mint:#10b981;--mint-deep:#0b8457;--gold:#f5b301;--red:#ef4444;--orange:#f97316;--txt:#e8f1ec;--txt-soft:#8ba396;--txt-mute:#5c6f66;}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--txt);line-height:1.7;min-height:100vh;background-image:radial-gradient(ellipse 800px 400px at 15% -5%,rgba(16,185,129,.06),transparent)}
  a{text-decoration:none;color:inherit}
  header{position:sticky;top:0;z-index:40;background:rgba(7,11,9,.85);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .head-in{max-width:860px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:19px;color:#fff}
  .brand .bell{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--mint),var(--mint-deep));display:grid;place-items:center;font-size:17px;transform:rotate(-6deg)}
  .btn{display:inline-flex;align-items:center;gap:7px;font-weight:700;cursor:pointer;border-radius:11px;font-size:13.5px;padding:9px 15px;background:var(--panel);color:var(--txt-soft);border:1px solid var(--line)}
  .wrap{max-width:860px;margin:0 auto;padding:24px 18px 70px}
  h1{font-size:22px;font-weight:900;display:flex;align-items:center;gap:9px;margin-bottom:4px}
  .sub{font-size:13px;color:var(--txt-soft);margin-bottom:22px}
  .hero{background:linear-gradient(135deg,rgba(16,185,129,.1),transparent);border:1px solid rgba(16,185,129,.3);border-radius:18px;padding:24px;margin-bottom:20px;display:flex;align-items:center;gap:24px}
  .hero .ring{position:relative;width:120px;height:120px;flex-shrink:0}
  .hero .rt .big{font-size:19px;font-weight:800;margin-bottom:4px}
  .hero .rt .s{font-size:13px;color:var(--txt-soft);line-height:1.6}
  .sec-h{font-size:14px;font-weight:800;color:var(--mint);margin:20px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
  .br{background:linear-gradient(180deg,rgba(255,255,255,.028),rgba(255,255,255,.008));border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:16px 18px;margin-bottom:11px}
  .br-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .br-h .n{font-size:15px;font-weight:800}
  .br-h .n span{font-size:11.5px;color:var(--txt-mute);font-weight:400;margin-right:6px}
  .br-h .badge{font-size:11px;padding:3px 11px;border-radius:6px;font-weight:800}
  .br-bar{height:8px;background:var(--panel2);border-radius:5px;overflow:hidden;margin-bottom:8px}
  .br-bar i{display:block;height:100%;border-radius:5px}
  .factors{display:flex;gap:8px;flex-wrap:wrap}
  .factor{font-size:11px;padding:2px 9px;border-radius:6px;background:var(--panel2)}
  .factor.ok{color:var(--mint)}.factor.no{color:var(--txt-mute)}
  .info{background:rgba(16,185,129,.06);border:1px solid rgba(16,185,129,.18);border-radius:12px;padding:13px 16px;margin-bottom:18px;font-size:12.5px;color:var(--txt-soft)}
  .spin{width:32px;height:32px;border:3px solid var(--line);border-top-color:var(--mint);border-radius:50%;animation:sp 1s linear infinite;margin:50px auto}@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header>
  <div class="head-in">
    <a class="brand" href="company-dashboard.html"><span class="bell">🔔</span>نبّاه</a>
    <a class="btn" href="company-input.html">✏️ إدخال البيانات</a>
  </div>
</header>
<div class="wrap">
  <h1>📊 درجة جاهزية التحليل</h1>
  <div class="sub">مدى اكتمال بياناتك — كلما زادت، زادت دقة كل التحليلات والتوقعات.</div>
  <div class="info">💡 هذه ليست تقييماً لأداء شركتك، بل لاكتمال بياناتك. بيانات أكمل = تحليل أدق وقرارات أوثق.</div>

  <div id="loading"><div class="spin"></div></div>
  <div id="content" style="display:none">
    <div id="heroBox"></div>
    <div class="sec-h">🏬 جاهزية كل فرع</div>
    <div id="branchList"></div>
  </div>
</div>
<script>
const TOKEN=localStorage.getItem("nabbah_token")||"";
if(!TOKEN) window.location.href="login.html";
async function api(p){
  const r=await fetch(p,{headers:{"Authorization":"Bearer "+TOKEN}});
  if(r.status===401){ localStorage.removeItem("nabbah_token"); window.location.href="login.html"; throw new Error("جلسة"); }
  const d=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.detail||"خطأ");
  return d;
}
const clr=s=>s>=75?"#10b981":(s>=45?"#f5b301":"#ef4444");
async function load(){
  try{
    const d=await api("/company/readiness");
    document.getElementById("loading").style.display="none";
    document.getElementById("content").style.display="block";
    const oa=d.overall_readiness||0, c=clr(oa), circ=2*Math.PI*52;
    document.getElementById("heroBox").innerHTML=`<div class="hero">
      <div class="ring">
        <svg viewBox="0 0 120 120" style="width:120px;height:120px;transform:rotate(-90deg)">
          <circle cx="60" cy="60" r="52" fill="none" stroke="#16221c" stroke-width="12"/>
          <circle cx="60" cy="60" r="52" fill="none" stroke="${c}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${circ*(1-oa/100)}"/>
        </svg>
        <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;font-family:Inter;color:${c}">${oa}%</div>
      </div>
      <div class="rt"><div class="big" style="color:${c}">${d.overall_level}</div><div class="s">${d.note||""}</div></div>
    </div>`;
    const brs=d.branch_readiness||[];
    if(!brs.length){
      document.getElementById("branchList").innerHTML='<div style="text-align:center;padding:40px;color:var(--txt-mute)">لا توجد فروع بعد. أضِف فروعك وبياناتها.</div>';
      return;
    }
    document.getElementById("branchList").innerHTML=brs.map(b=>{
      const col=clr(b.score);
      return `<div class="br">
        <div class="br-h"><div class="n">${b.name}${b.city?`<span>${b.city}</span>`:""}</div><div class="badge" style="background:${col}22;color:${col}">${b.level} · ${b.score}%</div></div>
        <div class="br-bar"><i style="width:${b.score}%;background:${col}"></i></div>
        <div class="factors">${(b.factors||[]).map(f=>`<span class="factor ${f.includes('✓')?'ok':'no'}">${f}</span>`).join("")}${b.modules_filled?`<span class="factor ok">${b.modules_filled} وحدة</span>`:""}</div>
      </div>`;
    }).join("");
  }catch(e){
    document.getElementById("loading").innerHTML='<p style="text-align:center;color:var(--red)">'+e.message+'</p>';
  }
}
load();
</script>
<script src="i18n.js"></script>
<script src="nabbah-sidebar.js"></script>
</body>
</html>
