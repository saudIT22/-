<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>نبّاه · التقرير التنفيذي</title>
<link href="nabbah-design.css" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{background:var(--bg,#070b09);color:var(--txt,#e8f1ec);font-family:Tajawal,Tahoma,Arial,sans-serif;margin:0}
  .wrap{max-width:1180px;margin:0 auto;padding:70px 16px 60px}
  h1{margin:0 0 4px;font-size:24px}.sub{color:var(--txt-soft,#8ba396);margin:0 0 14px;font-size:14px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
  select{background:var(--panel,#101a15);color:var(--txt,#e8f1ec);border:1px solid var(--line,#1d2c24);border-radius:10px;padding:8px 10px;font:inherit;font-size:13px;max-width:100%}
  .tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line,#1d2c24);margin:6px 0 16px}
  .tab{background:none;border:0;color:var(--txt-soft,#8ba396);padding:9px 11px;font:inherit;font-size:13px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab.on{color:var(--txt,#e8f1ec);border-color:#14b8a6;font-weight:800}
  .tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:14px}
  .tile,.panel{background:var(--panel,#101a15);border:1px solid var(--line,#1d2c24);border-radius:14px;padding:14px;min-width:0}
  .tile{cursor:pointer}.tile:hover{border-color:var(--mint,#10b981)}
  .tile .l{font-size:12px;color:var(--txt-soft,#8ba396)}.tile .v{font-size:22px;font-weight:800;margin-top:4px;overflow-wrap:anywhere}.tile .c{font-size:12px;margin-top:4px;line-height:1.7}
  .panel{margin-bottom:14px}.panel h2{margin:0 0 10px;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .panel h3{margin:12px 0 6px;font-size:13px;color:var(--txt-soft,#8ba396)}
  .grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
  table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px;border-bottom:1px solid var(--line,#1d2c24);text-align:start;white-space:nowrap}
  th{color:var(--txt-soft,#8ba396);font-weight:600}.tbl{overflow-x:auto}td.w{white-space:normal;min-width:200px}
  tr.drill{cursor:pointer}tr.drill:hover td{background:rgba(16,185,129,.06)}
  .pos{color:#10b981}.neg{color:#ef4444}.warn{color:#f5b301}.muted{color:var(--txt-soft,#8ba396);font-size:12px}
  .b{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:700;display:inline-block;white-space:nowrap}
  .critical,.intervene{background:rgba(239,68,68,.16);color:#ef4444}.high{background:rgba(234,88,12,.16);color:#f97316}
  .medium,.watch{background:rgba(245,179,1,.15);color:#f5b301}.low,.good{background:rgba(16,185,129,.15);color:#10b981}.grey,.na,.monitor{background:rgba(148,163,184,.15);color:#94a3b8}
  .btn{background:var(--mint,#10b981);color:#062b1c;border:0;border-radius:10px;padding:7px 13px;font-weight:800;cursor:pointer;font:inherit;font-size:12px;text-decoration:none;display:inline-block}
  .btn.ghost{background:transparent;color:var(--txt-soft,#8ba396);border:1px solid var(--line,#1d2c24);font-weight:600}.btn.red{background:#ef4444;color:#fff}
  .btn:disabled{opacity:.5;cursor:default}
  .state{padding:36px 16px;text-align:center;color:var(--txt-soft,#8ba396);border:1px dashed var(--line,#1d2c24);border-radius:14px}
  .na-box{color:var(--txt-soft,#8ba396);font-size:13px;padding:10px;border:1px dashed var(--line,#1d2c24);border-radius:10px;margin:6px 0}
  .itm{border:1px solid var(--line,#1d2c24);border-inline-start:4px solid #f5b301;border-radius:12px;padding:12px;margin-bottom:10px}
  .itm.critical,.itm.intervene{border-inline-start-color:#ef4444;background:none;color:inherit}.itm.high{border-inline-start-color:#f97316;background:none;color:inherit}
  .itm.medium,.itm.watch{background:none;color:inherit}.itm.good,.itm.low{border-inline-start-color:#10b981;background:none;color:inherit}.itm.na,.itm.monitor{border-inline-start-color:#94a3b8;background:none;color:inherit}
  .itm h4{margin:0 0 6px;font-size:15px}.kv{display:grid;grid-template-columns:120px 1fr;gap:4px 10px;font-size:13px;margin-top:6px}.kv b{color:var(--txt-soft,#8ba396);font-weight:600}
  .sum p{font-size:15px;line-height:2;margin:4px 0}.sum b{color:var(--mint,#10b981)}.sum a{color:var(--mint,#10b981);font-size:11px;text-decoration:none}
  .hgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
  .barrow{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}.barrow .t{flex:0 0 140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .barrow .g{flex:1;height:10px;background:var(--line,#1d2c24);border-radius:6px;overflow:hidden;min-width:40px}.barrow .g i{display:block;height:100%;background:var(--mint,#10b981)}.barrow .x{flex:0 0 120px;text-align:end}
  .pop{position:fixed;display:none;z-index:70;background:var(--panel,#101a15);border:1px solid var(--mint,#10b981);border-radius:12px;padding:12px;font-size:12px;max-width:340px;line-height:1.8}
  .chips{display:flex;gap:8px;flex-wrap:wrap}.chip{background:rgba(16,185,129,.12);color:var(--mint,#10b981);border:1px solid rgba(16,185,129,.35);border-radius:20px;padding:4px 11px;font-size:12px;cursor:pointer}
  input.search,.fg input,.fg select,.fg textarea{background:var(--bg,#070b09);color:inherit;border:1px solid var(--line,#1d2c24);border-radius:9px;padding:8px;font:inherit}
  input.search{flex:1;min-width:160px;background:var(--panel,#101a15);border-radius:10px;padding:9px 12px}
  .ai-sec{margin:8px 0}.ai-sec b{display:block;font-size:13px;margin-bottom:4px}.ai-sec li{font-size:13px;margin:3px 0}
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
  .ov.on{display:flex}.modal{background:var(--panel,#101a15);border:1px solid var(--line,#1d2c24);border-radius:16px;padding:18px;width:min(580px,100%);max-height:90vh;overflow:auto}
  .fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fg label{font-size:12px;color:var(--txt-soft,#8ba396);display:flex;flex-direction:column;gap:4px}.fg .full{grid-column:1/-1}
  .cta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .back{background:none;border:0;color:var(--mint,#10b981);cursor:pointer;font:inherit;padding:0;margin-bottom:10px}
  .stbadge{font-size:12px;font-weight:800;padding:4px 10px;border-radius:10px;border:1px solid var(--line,#1d2c24)}
  .flag{padding:10px 12px;border-radius:10px;margin:6px 0 10px;font-size:13px}
  /* بطاقة القرار */
  .dc-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:linear-gradient(90deg,#0f2a3d,#123047);border-radius:14px;padding:16px 18px;margin-bottom:12px}
  .dc-head h2{margin:0;font-size:20px}.dc-no{border:1px solid rgba(255,255,255,.3);border-radius:10px;padding:6px 12px;font-weight:800;font-size:13px}
  .dc-meta{display:grid;grid-template-columns:2fr repeat(4,minmax(0,1fr));gap:10px;align-items:center}.dc-meta>div{border-inline-start:1px solid var(--line,#1d2c24);padding:4px 10px}
  .dc-meta .l{font-size:12px;color:var(--txt-soft,#8ba396)}.dc-meta .v{font-size:15px;font-weight:800;margin-top:4px}
  .dc-box{background:rgba(255,255,255,.025);border-radius:10px;padding:12px;font-size:14px;line-height:1.9}
  .fin3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.fin3 div{background:rgba(255,255,255,.025);border-radius:10px;padding:12px;text-align:center}
  .fin3 b{display:block;font-size:20px;margin:6px 0}
  .flow{display:flex;align-items:flex-start;justify-content:space-between;gap:4px;margin:10px 0}.flow .st{text-align:center;flex:1;font-size:12px;position:relative}
  .flow .dot{width:28px;height:28px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;font-weight:900;background:var(--line,#1d2c24);color:#94a3b8}
  .flow .dot.on{background:#10b981;color:#062b1c}.flow .dot.cur{background:#f5b301;color:#2b1d00}
  #printv{display:none}
  @media print{body>*:not(#printv){display:none!important}#printv{display:block!important;color:#000;background:#fff}
    #printv .pg{page-break-after:always;padding:22px}#printv .panel,#printv .tile,#printv .itm{background:#fff;border:1px solid #ccc;color:#000;break-inside:avoid}
    #printv table{width:100%;border-collapse:collapse}#printv tr{break-inside:avoid}#printv td,#printv th{border:1px solid #ccc;padding:4px;font-size:10.5px;white-space:normal;color:#000}
    #printv .muted{color:#555}#printv .cover{display:flex;flex-direction:column;justify-content:center;min-height:90vh;text-align:center}}
  @media(max-width:900px){.hgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.dc-meta{grid-template-columns:1fr 1fr}.dc-meta>div:first-child{grid-column:1/-1}}
  @media(max-width:760px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2,.grid3,.fin3{grid-template-columns:minmax(0,1fr)}.fg{grid-template-columns:1fr}h1{font-size:20px}
    .tile{padding:10px}.tile .v{font-size:17px}.kv{grid-template-columns:1fr}.tab{padding:7px 8px;font-size:12px}.barrow .t{flex-basis:90px}.barrow .x{flex-basis:90px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>🧭 التقرير التنفيذي الذكي</h1>
  <p class="sub">صورة واضحة عن وضع الشركة، وما يحتاج تدخلك، والقرارات التي يجب أن تتخذها — دون قراءة كل التقارير التشغيلية.</p>
  <div class="bar">
    <select id="ver" style="max-width:300px"></select>
    <span class="stbadge" id="stb"></span>
    <button class="btn" id="btnGen" style="display:none">📄 إنشاء التقرير التنفيذي</button>
    <span id="stBtns"></span>
    <button class="btn ghost" id="btnPdf">🖨 PDF</button>
    <button class="btn ghost" id="btnXls">📊 Excel</button>
    <span class="muted" id="asof"></span>
  </div>
  <div id="flagc"></div>
  <div class="na-box" id="disc" style="margin:6px 0 10px"></div>
  <nav class="tabs" id="tabs"></nav>
  <div id="content"><div class="state">…</div></div>
</div>
<div class="pop" id="pop"></div>
<div id="printv"></div>
<div class="ov" id="ov"><div class="modal" id="modal"></div></div>
<script src="i18n.js"></script>
<script>
(function(){
  const TOKEN=localStorage.getItem("nabbah_token")||"";if(!TOKEN){location.href="login.html";return;}
  const TABS=[["overview","نظرة الرئيس التنفيذي"],["summary","الملخص التنفيذي"],["health","وضع الشركة"],["financial","الأداء المالي"],["growth","النمو والأهداف"],
    ["branches","أداء الفروع"],["best_worst","أفضل وأسوأ"],["exceptions","الاستثناءات الحرجة"],["risks","أهم المخاطر"],["opportunities","الفرص المالية"],
    ["root_causes","أسباب المشكلات"],["decisions_required","القرارات المطلوبة"],["followup","متابعة القرارات"],["next30","أولويات 30 يوماً"],
    ["forecast","التوقعات"],["confidence","الثقة وجودة البيانات"],["ai","AI Executive Intelligence"],["generate","إنشاء التقرير والنسخ"]];
  const STAT={draft:"مسودة",review:"قيد المراجعة",approved:"معتمد",published:"منشور",superseded:"مُستبدل"};
  const STCLS={draft:"grey",review:"medium",approved:"low",published:"low",superseded:"grey"};
  const CONF={high:"مرتفعة",medium:"متوسطة",low:"منخفضة",possible:"محتمل"};
  const LV={critical:"حرج",high:"مرتفع",medium:"متوسط",low:"منخفض"};
  const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const n=(v,d=0)=>{if(v==null||v===""||isNaN(Number(v)))return"—";const x=Number(v),t=Math.abs(x).toLocaleString("ar-SA",{maximumFractionDigits:d});return x<0?"\u2066−"+t+"\u2069":t;};
  const fv=(v,u)=>v==null?"غير متاح":(u==="%"?n(v,1)+"%":u==="SAR"?n(v)+" ر.س":u==="count"?n(v):n(v,2)+(u?" "+u:""));
  const pc=(v,inv)=>v==null?"":`<span class="${(inv?v<0:v>0)?"pos":v===0?"muted":"neg"}">${v>0?"+":""}${n(v,1)}%</span>`;
  const H={Authorization:"Bearer "+TOKEN,"Content-Type":"application/json"},$=id=>document.getElementById(id);
  let D=null,EV={},evI=0;
  const route=()=>{const h=decodeURIComponent(location.hash.slice(1)||"overview");const i=h.indexOf("/");return i<0?[h,""]:[h.slice(0,i),h.slice(i+1)];};
  const go=(v,a)=>{location.hash=a?`${v}/${encodeURIComponent(a)}`:v;};
  window.addEventListener("hashchange",()=>{if(!D)return;const [v,a]=route();if(v==="report"&&a){load(a);go("overview");return;}render();window.scrollTo(0,0);});
  const api=(path,body)=>fetch(path,{method:"POST",headers:H,body:JSON.stringify(body)}).then(async r=>{const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(typeof j.detail==="string"?j.detail:"HTTP "+r.status);return j;});
  function load(rid){$("content").innerHTML=`<div class="state">جارٍ انتقاء ما يحتاجه قرارك من المحركات…</div>`;
    fetch(rid?`/company/exec-report/report/${rid}`:"/company/executive-report-intelligence",{headers:H}).then(async r=>{
      if(r.status===401){location.href="login.html";return null;}
      if(r.status===403||r.status===402){let d="";try{d=(await r.json()).detail;}catch(_){}$("tabs").innerHTML="";$("content").innerHTML=`<div class="state">🔒 ${esc(d||"ليست لديك صلاحية.")}</div>`;return null;}
      if(!r.ok){let d="";try{const j=await r.json();d=typeof j.detail==="string"?j.detail:JSON.stringify(j.detail||j);}catch(_){}err(`HTTP ${r.status}${d?" — "+d:""}`);return null;}
      return r.json();}).then(d=>{if(!d)return;D=d;
        if(d.empty){$("tabs").innerHTML="";$("content").innerHTML=`<div class="state">📭 ${esc(d.message_ar)}</div>`;["btnPdf","btnXls"].forEach(b=>$(b).style.display="none");$("disc").textContent="صلاحيتك: "+((d.scope||{}).ar||"");return;}
        const sc=d.scope||{};$("btnGen").style.display=sc.can_generate?"":"none";
        $("ver").innerHTML=(sc.published_only?"":`<option value="">● التقرير الحي (البيانات الحالية)</option>`)+(d.reports||[]).map(r=>`<option value="${r.id}" ${d.report&&d.report.id===r.id?"selected":""}>${esc(r.period)} · V${r.version} · ${esc(STAT[r.status]||r.status)}</option>`).join("");
        const st=d.live?null:d.report.status;$("stb").className="stbadge "+(st?STCLS[st]:"grey");$("stb").textContent=d.live?"حي — غير محفوظ":(STAT[st]||st);
        const nx=(!d.live&&sc.can_generate&&d.report.next)?d.report.next:[];
        $("stBtns").innerHTML=nx.filter(t=>sc.can_approve||!["approved","published"].includes(t)).map(t=>`<button class="btn ${t==="draft"?"ghost":""}" data-to="${t}">${t==="draft"?"↩ إرجاع للمسودة":"← "+esc(STAT[t])}</button>`).join(" ");
        document.querySelectorAll("[data-to]").forEach(b=>b.onclick=()=>setStatus(b.dataset.to));
        $("flagc").innerHTML=!d.live&&d.data_changed_ar?`<div class="flag ${d.data_changed?"high":"low"}">${d.data_changed?"⚠️":"✔"} ${esc(d.data_changed_ar)}</div>`:"";
        $("disc").textContent=`🔒 ${d.confidentiality||"سري"} · ${d.disclaimer_ar||""} · صلاحيتك: ${sc.ar||""}`+(d.live?"":" · "+(d.frozen_note_ar||""));
        $("asof").textContent=d.live?`حي · ${d.as_of} · الفترة ${d.period}`:`${d.report.period} · V${d.report.version} · ${d.report.generated_at} · ${d.report.generated_by} · السبب: ${d.report.reason||"—"}`;
        try{render();}catch(e){console.error(e);err("render: "+(e&&e.message||e));}}).catch(e=>err("network: "+(e&&e.message||e)));}
  function err(m){$("content").innerHTML=`<div class="state neg">تعذّر تحميل التقرير التنفيذي.<div class="muted" style="margin-top:8px">${esc(m)}</div></div>`;}
  function setStatus(to){let note="";if(to==="draft"){note=prompt("سبب الإرجاع للمسودة؟")||"";if(!note)return;}api("/company/exec-report/status",{id:D.report.id,to,note}).then(()=>load(D.report.id)).catch(er=>alert(er.message));}
  const panel=(t,b,x="")=>`<div class="panel"><h2>${t}${x}</h2>${b}</div>`;
  const na=m=>`<div class="na-box">${esc(m)}</div>`;
  const R=k=>{const x=D[k];return x&&!x.restricted?x:null;};
  const restricted=()=>`<div class="state">🔒 خارج صلاحيتك</div>`;
  const ev=m=>{const k="e"+(evI++);EV[k]=m;return k;};
  const conf=c=>c?`<span class="b ${c==="high"?"low":c==="low"?"critical":"medium"}">ثقة ${esc(CONF[c]||c)}</span>`:"";
  const imp=i=>i&&i.amount!=null?`<b>${n(i.amount)}</b> ر.س ${i.type_ar||i.type?`<span class="b grey">${esc(i.type_ar||{actual:"أثر فعلي",exposure:"تعرّض",recovery:"استرداد"}[i.type]||i.type)}</span>`:""}`:'<span class="muted">غير مقاس</span>';
  const DIRAR={up:"↑",down:"↓",flat:"→"};
  function tile(c){if(!c)return"";const k=ev(c);const ch=c.change_pct!=null?pc(c.change_pct,c.inverse):"";let x="";
    if(c.key==="net_profit"&&c.margin!=null)x=`<div class="muted">الهامش ${n(c.margin,1)}%</div>`;
    if(c.key==="risk"&&c.level_ar)x=`<div><span class="b ${c.level}">${esc(c.level_ar)}</span></div>`;
    if(c.key==="goals"&&c.counts)x=`<div class="muted">المفترض ${n(c.expected,1)}% · متأخر ${n(c.counts.behind)} · معرّض ${n(c.counts.at_risk)} · على المسار ${n(c.counts.on_track)}</div>`;
    if(c.key==="decisions")x=`<div class="muted">بانتظار الاعتماد ${n(c.pending_approval)} · متأخرة ${n(c.overdue)}</div>`;
    if(c.key==="opportunities")x=`<div class="muted">${n(c.count)} فرص موثقة</div>`;
    return `<div class="tile" data-ev="${k}"><div class="l">${esc(c.label)}</div><div class="v">${c.available===false?'<span class="muted" style="font-size:14px">غير متاح</span>':fv(c.value,c.unit)}</div><div class="c">${c.available===false?`<span class="muted">${esc(c.reason_ar||"")}</span>`:`${c.previous!=null?`<span class="muted">السابق ${fv(c.previous,c.unit)}</span> `:""}${ch}${c.trend?` <span class="muted">${DIRAR[c.trend.dir]} ${esc(c.trend.ar)}</span>`:""}${x}<div class="muted">${esc(c.period||"")} · الثقة: ${esc(CONF[c.confidence]||c.confidence||"—")} · ${esc(c.source_ar||"")}</div>`}</div></div>`;}

  function overview(){const o=R("overview");if(!o)return restricted();const h=o.health||{};
    return `<div class="tiles">${(o.cards||[]).map(tile).join("")||na("لا مؤشرات ضمن صلاحيتك")}</div>`
      +panel(`${esc(h.light||"")} وضع الشركة: ${esc(h.ar||"—")}${o.growth_ar?` <span class="muted">· النمو: ${esc(o.growth_ar)}</span>`:""}`,(o.summary?`<p style="line-height:2;margin:0">${esc(o.summary)}</p>`:"")
        +((o.top3||[]).length?`<h3>أهم ثلاثة أمور تحتاج تدخلك</h3><ol>${o.top3.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`:"")
        +`<div class="cta"><button class="btn" data-go="decisions_required">🗳 ${n(o.decisions_waiting)} قرارات تنتظرك</button><button class="btn ghost" data-go="exceptions">الاستثناءات</button><button class="btn ghost" data-go="next30">أولويات 30 يوماً</button></div>`)
      +(o.customers&&o.customers.available?panel(`👥 العملاء <a class="btn ghost" href="${esc(o.customers.link)}">ذكاء العملاء ←</a>`,`<p style="margin:0;line-height:2">${esc(o.customers.text_ar)}</p><div class="muted">المصدر: ${esc(o.customers.source_ar)} · حتى ${esc(o.customers.as_of)}${o.customers.top_alert?" · أهم تنبيه: "+esc(o.customers.top_alert):""}</div>`)
        :(o.customers&&o.customers.reason_ar?panel("👥 العملاء",na(o.customers.reason_ar)):""))

    document.querySelectorAll("#content [data-act]").forEach(b=>b.onclick=()=>actModal(b.dataset.act,b.dataset.id));
    document.querySelectorAll("#content [data-ev]").forEach(el=>el.onclick=e=>{e.stopPropagation();const m=EV[el.dataset.ev],p=$("pop");
      p.innerHTML=`<b>${esc(m.label)}</b><div>${m.available===false?esc(m.reason_ar):fv(m.value,m.unit)}</div><div class="muted">المصدر: ${esc(m.source_ar)}</div>${m.period?`<div class="muted">الفترة: ${esc(m.period)}${m.comparison_period?" مقابل "+esc(m.comparison_period):""}</div>`:""}${m.calculation_method?`<div class="muted">الحساب: ${esc(m.calculation_method)}</div>`:""}<div class="muted">الثقة: ${esc(CONF[m.confidence]||m.confidence||"—")} · ${esc(m.calculation_version||"")}</div>${m.link?`<a href="${esc(m.link)}" style="color:var(--mint,#10b981)">افتح التحليل التفصيلي ↗</a>`:""}`;
      p.style.display="block";p.style.top=Math.min(window.innerHeight-220,e.clientY+10)+"px";p.style.left=Math.max(8,Math.min(window.innerWidth-350,e.clientX-170))+"px";});
    document.querySelectorAll("#content [data-q]").forEach(c=>c.onclick=()=>runAI(c.dataset.q));
    const ag=$("aiGo");if(ag)ag.onclick=()=>{const q=$("aiQ").value.trim();if(q)runAI(q);};
    document.querySelectorAll("#content [data-open]").forEach(b=>b.onclick=()=>{$("ver").value=b.dataset.open;load(b.dataset.open);});
    document.querySelectorAll("#content [data-mk]").forEach(b=>b.onclick=()=>{$("modal").innerHTML=`<h3 style="margin-top:0">إنشاء قرار في مركز متابعة القرارات</h3><div class="fg"><label>المسؤول<input id="dO"></label><label>الموعد<input id="dD" type="date" value="${esc(b.dataset.due)}"></label><label>التكلفة التقديرية (ر.س)<input id="dK" type="number" step="any"></label><label>المنفعة المتوقعة (ر.س)<input id="dE" type="number" step="any"></label><label>مستهدف المؤشر<input id="dT" type="number" step="any"></label></div><div class="muted">يُنشأ مسودة في 3.9 بخط أساس من المصدر الموحد ويمر بمسار الاعتماد.</div><div class="cta"><button class="btn" id="dGo">إنشاء</button><button class="btn ghost" id="dC">إلغاء</button><span id="dM" class="muted"></span></div>`;$("ov").classList.add("on");
      $("dC").onclick=()=>$("ov").classList.remove("on");
      $("dGo").onclick=()=>{const body={report_id:D.report.id,rec_id:Number(b.dataset.mk),due:$("dD").value};if($("dO").value.trim())body.owner=$("dO").value.trim();[["dK","cost"],["dE","expected_impact"],["dT","target"]].forEach(([i,k])=>{if($(i).value!=="")body[k]=Number($(i).value);});
        api("/company/exec-report/to-decision",body).then(()=>{$("ov").classList.remove("on");load(D.report.id);}).catch(er=>{$("dM").className="neg";$("dM").textContent=er.message;});};});
    const ss=$("sSave");if(ss)ss.onclick=()=>{const sp=v=>v.split(",").map(x=>x.trim()).filter(Boolean);
      api("/company/exec-report/settings",{ceo_approval_limit:$("sL").value===""?null:Number($("sL").value),cfo_review_threshold:$("sC").value===""?null:Number($("sC").value),next30_count:Number($("sN").value||5),
        confidentiality:$("sS").value,ops_review_categories:sp($("sO").value),legal_review_categories:sp($("sG").value)}).then(()=>{$("sM").className="pos";$("sM").textContent="حُفظ — يطبَّق على التقرير القادم";}).catch(er=>{$("sM").className="neg";$("sM").textContent=er.message;});};}
  document.addEventListener("click",()=>{$("pop").style.display="none";});
  // ── التصدير: PDF (طباعة المتصفح بتنسيق التقرير) + Excel (جداول التقرير CSV بترميز UTF-8)
  function printReport(){const keep=$("content").innerHTML;
    let html=`<div class="pg cover"><h1>Executive Report — التقرير التنفيذي</h1><h2>${esc(D.company||"")}</h2><div>الفترة: ${esc(D.period)}</div><div>تاريخ الإنشاء: ${esc(D.live?D.generated_at:D.report.generated_at)} · ${D.live?"تقرير حي غير محفوظ":"النسخة V"+D.report.version+" · "+esc(STAT[D.report.status]||"")}</div><div style="margin-top:18px;font-weight:900">${esc(D.confidentiality||"سري")}</div>`
      +(R("decisions_required")?`<div style="margin-top:20px;text-align:start"><b>القرارات المطلوبة:</b><ul>${D.decisions_required.items.map(x=>`<li>${esc(x.card.no)} ${esc(x.card.title)} — ${esc(x.kind_ar)}</li>`).join("")}</ul></div>`:"")+`</div>`;
    (D.pdf_pages||[]).filter(p=>p.key!=="cover").forEach(p=>{let body="";try{EV={};body=(VIEWS[p.key]||(()=>na("—")))();}catch(_){body=na("—");}html+=`<div class="pg"><div style="font-size:11px;color:#666">${esc(p.ar)} · ${esc(D.period)} · ${esc(D.confidentiality||"سري")} · المصادر: محركات نبّاه</div>${body}</div>`;});
    $("printv").innerHTML=html;$("content").innerHTML=keep;bind();
    api("/company/exec-report/export",{id:D.live?undefined:D.report.id,format:"pdf"}).catch(()=>{});setTimeout(()=>window.print(),120);}
  function exportExcel(){const box=document.createElement("div");let csv="\uFEFF"+`التقرير التنفيذي,${D.period},${D.live?"حي":"V"+D.report.version}\n`;
    (D.pdf_pages||[]).filter(p=>p.key!=="cover").forEach(p=>{try{EV={};box.innerHTML=(VIEWS[p.key]||(()=>""))();}catch(_){return;}const ts=box.querySelectorAll("table");if(!ts.length)return;
      csv+=`\n${p.ar}\n`;ts.forEach(t=>{t.querySelectorAll("tr").forEach(tr=>{csv+=[...tr.children].map(c=>'"'+c.innerText.replace(/"/g,'""').replace(/\s+/g," ").trim()+'"').join(",")+"\n";});csv+="\n";});});
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download=`executive-report-${D.period}${D.live?"":"-V"+D.report.version}.csv`;document.body.appendChild(a);a.click();a.remove();
    window.__csv=csv;api("/company/exec-report/export",{id:D.live?undefined:D.report.id,format:"excel"}).catch(()=>{});}
  $("btnPdf").onclick=printReport;$("btnXls").onclick=exportExcel;
  $("ver").onchange=()=>load($("ver").value||null);
  $("btnGen").onclick=()=>{const has=(D.reports||[]).some(r=>r.period===D.period);$("modal").innerHTML=`<h3 style="margin-top:0">إنشاء التقرير التنفيذي</h3><div class="fg"><label class="full">العنوان<input id="gT" placeholder="اختياري"></label><label class="full">سبب الإصدار${has?" (مطلوب — توجد نسخة لنفس الفترة)":""}<input id="gR" placeholder="مثلاً: تحديث البيانات بعد إقفال الشهر"></label></div><div class="muted">تُحفظ نسخة جديدة بلقطة البيانات وبصمتها؛ النسخ السابقة تبقى في السجل.</div><div class="cta"><button class="btn" id="gGo">إنشاء</button><button class="btn ghost" id="gC">إلغاء</button><span id="gM" class="muted"></span></div>`;$("ov").classList.add("on");
    $("gC").onclick=()=>$("ov").classList.remove("on");$("gGo").onclick=()=>{$("gGo").disabled=true;api("/company/exec-report/generate",{title:$("gT").value,reason:$("gR").value}).then(j=>{$("ov").classList.remove("on");load(j.id);}).catch(er=>{$("gGo").disabled=false;$("gM").className="neg";$("gM").textContent=er.message;});};};
  $("ov").onclick=e=>{if(e.target===$("ov"))$("ov").classList.remove("on");};
  const [v0,a0]=route();if(v0==="report"&&a0){load(a0);window.history.replaceState(null,"","#overview");}else load();
})();
</script>
