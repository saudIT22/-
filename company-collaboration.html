<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>نبّاه · التعاون المؤسسي</title>
<link href="nabbah-design.css" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{background:var(--bg,#070b09);color:var(--txt,#e8f1ec);font-family:Tajawal,Tahoma,Arial,sans-serif;margin:0}
  .wrap{max-width:1180px;margin:0 auto;padding:70px 16px 60px}
  h1{margin:0 0 4px;font-size:24px}.sub{color:var(--txt-soft,#8ba396);margin:0 0 14px;font-size:14px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
  select{background:var(--panel,#101a15);color:var(--txt,#e8f1ec);border:1px solid var(--line,#1d2c24);border-radius:10px;padding:8px 10px;font:inherit;font-size:13px;max-width:100%}
  .tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line,#1d2c24);margin:6px 0 16px}
  .tab{background:none;border:0;color:var(--txt-soft,#8ba396);padding:9px 11px;font:inherit;font-size:13px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab.on{color:var(--txt,#e8f1ec);border-color:#14b8a6;font-weight:800}
  .tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:14px}
  .tile,.panel{background:var(--panel,#101a15);border:1px solid var(--line,#1d2c24);border-radius:14px;padding:14px;min-width:0}
  .tile{cursor:pointer}.tile:hover{border-color:var(--mint,#10b981)}
  .tile .l{font-size:12px;color:var(--txt-soft,#8ba396)}.tile .v{font-size:22px;font-weight:800;margin-top:4px;overflow-wrap:anywhere}.tile .c{font-size:12px;margin-top:4px;line-height:1.7}
  .panel{margin-bottom:14px}.panel h2{margin:0 0 10px;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .panel h3{margin:12px 0 6px;font-size:13px;color:var(--txt-soft,#8ba396)}
  .grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
  table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px;border-bottom:1px solid var(--line,#1d2c24);text-align:start;white-space:nowrap}
  th{color:var(--txt-soft,#8ba396);font-weight:600}.tbl{overflow-x:auto}td.w{white-space:normal;min-width:200px}
  tr.drill{cursor:pointer}tr.drill:hover td{background:rgba(16,185,129,.06)}
  .pos{color:#10b981}.neg{color:#ef4444}.warn{color:#f5b301}.muted{color:var(--txt-soft,#8ba396);font-size:12px}
  .b{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:700;display:inline-block;white-space:nowrap}
  .critical,.intervene{background:rgba(239,68,68,.16);color:#ef4444}.high{background:rgba(234,88,12,.16);color:#f97316}
  .medium,.watch{background:rgba(245,179,1,.15);color:#f5b301}.low,.good{background:rgba(16,185,129,.15);color:#10b981}.grey,.na,.monitor{background:rgba(148,163,184,.15);color:#94a3b8}
  .btn{background:var(--mint,#10b981);color:#062b1c;border:0;border-radius:10px;padding:7px 13px;font-weight:800;cursor:pointer;font:inherit;font-size:12px;text-decoration:none;display:inline-block}
  .btn.ghost{background:transparent;color:var(--txt-soft,#8ba396);border:1px solid var(--line,#1d2c24);font-weight:600}.btn.red{background:#ef4444;color:#fff}
  .btn:disabled{opacity:.5;cursor:default}
  .state{padding:36px 16px;text-align:center;color:var(--txt-soft,#8ba396);border:1px dashed var(--line,#1d2c24);border-radius:14px}
  .na-box{color:var(--txt-soft,#8ba396);font-size:13px;padding:10px;border:1px dashed var(--line,#1d2c24);border-radius:10px;margin:6px 0}
  .itm{border:1px solid var(--line,#1d2c24);border-inline-start:4px solid #f5b301;border-radius:12px;padding:12px;margin-bottom:10px}
  .itm.critical,.itm.intervene{border-inline-start-color:#ef4444;background:none;color:inherit}.itm.high{border-inline-start-color:#f97316;background:none;color:inherit}
  .itm.medium,.itm.watch{background:none;color:inherit}.itm.good,.itm.low{border-inline-start-color:#10b981;background:none;color:inherit}.itm.na,.itm.monitor{border-inline-start-color:#94a3b8;background:none;color:inherit}
  .itm h4{margin:0 0 6px;font-size:15px}.kv{display:grid;grid-template-columns:120px 1fr;gap:4px 10px;font-size:13px;margin-top:6px}.kv b{color:var(--txt-soft,#8ba396);font-weight:600}
  .sum p{font-size:15px;line-height:2;margin:4px 0}.sum b{color:var(--mint,#10b981)}.sum a{color:var(--mint,#10b981);font-size:11px;text-decoration:none}
  .hgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
  .barrow{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}.barrow .t{flex:0 0 140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .barrow .g{flex:1;height:10px;background:var(--line,#1d2c24);border-radius:6px;overflow:hidden;min-width:40px}.barrow .g i{display:block;height:100%;background:var(--mint,#10b981)}.barrow .x{flex:0 0 120px;text-align:end}
  .pop{position:fixed;display:none;z-index:70;background:var(--panel,#101a15);border:1px solid var(--mint,#10b981);border-radius:12px;padding:12px;font-size:12px;max-width:340px;line-height:1.8}
  .chips{display:flex;gap:8px;flex-wrap:wrap}.chip{background:rgba(16,185,129,.12);color:var(--mint,#10b981);border:1px solid rgba(16,185,129,.35);border-radius:20px;padding:4px 11px;font-size:12px;cursor:pointer}
  input.search,.fg input,.fg select,.fg textarea{background:var(--bg,#070b09);color:inherit;border:1px solid var(--line,#1d2c24);border-radius:9px;padding:8px;font:inherit}
  input.search{flex:1;min-width:160px;background:var(--panel,#101a15);border-radius:10px;padding:9px 12px}
  .ai-sec{margin:8px 0}.ai-sec b{display:block;font-size:13px;margin-bottom:4px}.ai-sec li{font-size:13px;margin:3px 0}
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
  .ov.on{display:flex}.modal{background:var(--panel,#101a15);border:1px solid var(--line,#1d2c24);border-radius:16px;padding:18px;width:min(580px,100%);max-height:90vh;overflow:auto}
  .fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fg label{font-size:12px;color:var(--txt-soft,#8ba396);display:flex;flex-direction:column;gap:4px}.fg .full{grid-column:1/-1}
  .cta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .back{background:none;border:0;color:var(--mint,#10b981);cursor:pointer;font:inherit;padding:0;margin-bottom:10px}
  .stbadge{font-size:12px;font-weight:800;padding:4px 10px;border-radius:10px;border:1px solid var(--line,#1d2c24)}
  .flag{padding:10px 12px;border-radius:10px;margin:6px 0 10px;font-size:13px}
  /* بطاقة القرار */
  .dc-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:linear-gradient(90deg,#0f2a3d,#123047);border-radius:14px;padding:16px 18px;margin-bottom:12px}
  .dc-head h2{margin:0;font-size:20px}.dc-no{border:1px solid rgba(255,255,255,.3);border-radius:10px;padding:6px 12px;font-weight:800;font-size:13px}
  .dc-meta{display:grid;grid-template-columns:2fr repeat(4,minmax(0,1fr));gap:10px;align-items:center}.dc-meta>div{border-inline-start:1px solid var(--line,#1d2c24);padding:4px 10px}
  .dc-meta .l{font-size:12px;color:var(--txt-soft,#8ba396)}.dc-meta .v{font-size:15px;font-weight:800;margin-top:4px}
  .dc-box{background:rgba(255,255,255,.025);border-radius:10px;padding:12px;font-size:14px;line-height:1.9}
  .fin3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.fin3 div{background:rgba(255,255,255,.025);border-radius:10px;padding:12px;text-align:center}
  .fin3 b{display:block;font-size:20px;margin:6px 0}
  .flow{display:flex;align-items:flex-start;justify-content:space-between;gap:4px;margin:10px 0}.flow .st{text-align:center;flex:1;font-size:12px;position:relative}
  .flow .dot{width:28px;height:28px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;font-weight:900;background:var(--line,#1d2c24);color:#94a3b8}
  .flow .dot.on{background:#10b981;color:#062b1c}.flow .dot.cur{background:#f5b301;color:#2b1d00}
  #printv{display:none}
  @media print{#printv{display:block!important;color:#000;background:#fff}
    #printv .pg{page-break-after:always;padding:22px}#printv .panel,#printv .tile,#printv .itm{background:#fff;border:1px solid #ccc;color:#000;break-inside:avoid}
    #printv table{width:100%;border-collapse:collapse}#printv tr{break-inside:avoid}#printv td,#printv th{border:1px solid #ccc;padding:4px;font-size:10.5px;white-space:normal;color:#000}
    #printv .muted{color:#555}#printv .cover{display:flex;flex-direction:column;justify-content:center;min-height:90vh;text-align:center}}
  @media(max-width:900px){.hgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.dc-meta{grid-template-columns:1fr 1fr}.dc-meta>div:first-child{grid-column:1/-1}}
  @media(max-width:760px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2,.grid3,.fin3{grid-template-columns:minmax(0,1fr)}.fg{grid-template-columns:1fr}h1{font-size:20px}
    .tile{padding:10px}.tile .v{font-size:17px}.kv{grid-template-columns:1fr}.tab{padding:7px 8px;font-size:12px}.barrow .t{flex-basis:90px}.barrow .x{flex-basis:90px}}
  @media(max-width:1000px){.grid3{grid-template-columns:minmax(0,1fr)}}
  @media(max-width:760px){.barrow{flex-wrap:wrap}.barrow .x{flex:1 1 100%;text-align:start}.barrow .x .b{white-space:normal}}
  html,body{overflow-x:hidden}
  @media(min-width:761px){#content .barrow .x{flex-basis:220px}}
  .btn.ghost.red{color:#ef4444;border-color:rgba(239,68,68,.4)}
  @media print{body>*:not(.wrap){display:none!important}.tabs,.bar,.cta,.back,#disc{display:none!important}body{background:#fff;color:#000}.panel{border:1px solid #ccc;background:#fff;color:#000}}

  .chip input{vertical-align:middle;margin:0 0 0 4px}.chip.on{background:var(--mint,#10b981);color:#062b1c;font-weight:800}.fg textarea{resize:vertical}
  .code{background:var(--bg,#070b09);border:1px solid var(--line,#1d2c24);border-radius:10px;padding:10px;font-size:12px;white-space:pre-wrap;word-break:break-word;overflow-x:auto;text-align:left;font-family:ui-monospace,Consolas,monospace;margin:6px 0}
  code{font-family:ui-monospace,Consolas,monospace;font-size:12px;background:rgba(255,255,255,.05);padding:1px 5px;border-radius:5px}
  .spark{display:flex;align-items:flex-end;gap:3px;height:110px;padding:6px 0}.spark i{flex:1;background:var(--mint,#10b981);border-radius:3px 3px 0 0;min-width:3px;opacity:.85}
  .btn.ghost.red{background:transparent}.fg label{min-width:0}.fg input,.fg select,.fg textarea{width:100%;min-width:0;box-sizing:border-box}
  details summary{list-style:none}.itm h4{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  @media(max-width:760px){.tiles[style]{grid-template-columns:repeat(2,minmax(0,1fr))!important}[data-mr]{grid-template-columns:1fr 1fr!important}[data-mr] .btn{grid-column:1/-1}[data-tm],[data-bm]{grid-template-columns:1fr!important}}
  .bar select{background:var(--card,#0d1512);color:inherit;border:1px solid var(--line,#1d2c24);border-radius:10px;padding:6px 10px}
  textarea{width:100%;background:var(--card,#0d1512);color:inherit;border:1px solid var(--line,#1d2c24);border-radius:10px;padding:8px;font-family:inherit}
  input[type=color]{height:40px;padding:3px;min-width:80px;cursor:pointer}
  .b.grey{background:rgba(148,163,184,.15);color:#94a3b8}
  @media(max-width:760px){.bar{flex-wrap:wrap}.tiles[style]{grid-template-columns:repeat(2,minmax(0,1fr))!important}.kv{grid-template-columns:1fr!important}}
</style>
</head>
<body>
<div class="wrap">
  <h1>🤝 التعاون المؤسسي</h1>
  <p class="sub">نقاشات مرتبطة بالمؤشرات والقرارات والتقارير بين الإدارات، تحويل النقاش إلى قرار في متابعة القرارات، مشاركة التقارير المعتمدة بمدة وصلاحية، وإشعارات لا تكشف ما لا تملك صلاحيته.</p>
  <div class="bar"><span class="stbadge" id="meB">…</span><span style="flex:1"></span><button class="btn" id="newT">+ نقاش جديد</button></div>
  <nav class="tabs" id="tabs"></nav>
  <div id="content"><div class="state">جارٍ التحميل…</div></div>
</div>
<div class="ov" id="ov"><div class="modal" id="modal"></div></div>
<script src="i18n.js"></script>
<script>
(function(){
  const TOKEN=localStorage.getItem("nabbah_token")||"";
  const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const n=(v,d=0)=>{if(v==null||v===""||isNaN(Number(v)))return"—";return Number(v).toLocaleString("ar-SA",{maximumFractionDigits:d});};
  const dt=v=>v?esc(String(v).replace("T"," ").slice(0,16)):"—";
  const dd=v=>v?esc(String(v).slice(0,10)):"—";
  const $=id=>document.getElementById(id);
  const H={Authorization:"Bearer "+TOKEN,"Content-Type":"application/json"};
  const api=(path,body)=>fetch(path,{method:body===undefined?"GET":"POST",headers:H,body:body===undefined?undefined:JSON.stringify(body)}).then(async r=>{
    if(r.status===401){location.href="login.html";throw new Error("401");}const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(typeof j.detail==="string"?j.detail:"HTTP "+r.status);return j;});
  const panel=(t,b,x="")=>`<div class="panel"><h2>${t}${x}</h2>${b}</div>`;
  const na=m=>`<div class="na-box">${esc(m)}</div>`;
  const tbl=(head,rows,empty)=>rows.length?`<div class="tbl"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table></div>`:na(empty||"لا بيانات بعد");
  const msgEl=id=>`<div class="muted" id="${id}" style="margin-top:8px"></div>`;
  const ok=(id,t)=>{const e=$(id);if(e){e.className="pos";e.textContent=t;}};
  const bad=(id,t)=>{const e=$(id);if(e){e.className="neg";e.textContent=t;}};
  const tile=(l,v,x,cls)=>`<div class="tile"><div class="l">${l}</div><div class="v ${cls||""}">${v}${x?`<span class="muted" style="font-size:12px"> ${x}</span>`:""}</div></div>`;
  const badge=(t,c)=>`<span class="b ${c||"low"}">${esc(t)}</span>`;
  const close=()=>{$("ov").classList.remove("on");$("modal").innerHTML="";};
  const open=h=>{$("modal").innerHTML=h;$("ov").classList.add("on");};
  const route=()=>decodeURIComponent(location.hash.slice(1)||"");
  const opts=(o,sel)=>Object.entries(o).map(([k,v])=>`<option value="${esc(k)}"${k===sel?" selected":""}>${esc(v)}</option>`).join("");
  const val=id=>{const e=$(id);return e?e.value:"";};
  const btnRun=(b,p,onOk,msg)=>{b.disabled=true;p.then(r=>{b.disabled=false;onOk(r);}).catch(e=>{b.disabled=false;if(msg)bad(msg,e.message);else alert(e.message);});};
  function codeModal(code,note,after){open(`<h2 style="margin-top:0">🔑 الرمز — يُعرض مرة واحدة</h2><div dir="ltr" class="code" style="font-size:18px;font-weight:800;text-align:center" id="newCode">${esc(code)}</div>
    <div class="cta"><button class="btn" id="cpCode">نسخ</button><button class="btn ghost" id="clCode">تم، أغلق</button></div><p class="muted">${esc(note||"")}</p>`);
    $("cpCode").onclick=()=>{(navigator.clipboard?navigator.clipboard.writeText(code):Promise.reject()).then(()=>{$("cpCode").textContent="✔ نُسخ";}).catch(()=>{$("cpCode").textContent="انسخه يدوياً";});};
    $("clCode").onclick=()=>{close();if(after)after();};}
  function tabsBar(list,cur){return list.map(t=>`<button class="tab${t[0]===cur?" on":""}" data-tab="${t[0]}">${t[1]}</button>`).join("");}

  if(!TOKEN){location.href="login.html";return;}
  let META=null,WS="",UNREAD=0;
  const TABS=[["overview","🧭 مساحات العمل"],["threads","💬 النقاشات"],["shares","📤 مشاركة التقارير"],["activity","🗂️ نشاط الفريق"],["notifications","🔔 الإشعارات"]];
  const PK_C={evidence:"low",cause:"medium",analysis_request:"medium",objection:"critical",support:"low",outcome:"low",change_request:"medium"};
  window.addEventListener("hashchange",()=>{if(META)render();});
  function render(){const h=route();let k=h.startsWith("t")&&/^t\d+$/.test(h)?"thread":h.startsWith("s")&&/^s\d+$/.test(h)?"share":h||"overview";
    const tk=k==="thread"?"threads":k==="share"?"shares":k;
    $("tabs").innerHTML=tabsBar(TABS.map(t=>t[0]==="notifications"&&UNREAD?[t[0],t[1]+` (${UNREAD})`]:t),tk);document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{location.hash=b.dataset.tab;});
    $("content").innerHTML=`<div class="state">جارٍ التحميل…</div>`;
    const fn=k==="thread"?()=>vThread(Number(h.slice(1))):k==="share"?()=>vShare(Number(h.slice(1))):VIEW[k]||VIEW.overview;
    Promise.resolve(fn()).then(x=>{$("content").innerHTML=x;wire(k);}).catch(e=>{$("content").innerHTML=`<div class="state">${esc(e.message)}</div>`;});}

  function vOverview(){return api("/collab/overview").then(o=>{UNREAD=o.unread;
    const ws=`<div class="tiles" style="grid-template-columns:repeat(3,minmax(0,1fr))">${o.workspaces.map(w=>`<a href="#threads" data-ws="${w.key}" class="tile" style="text-decoration:none;color:inherit"><div class="l">${esc(w.name)}</div><div class="v">${n(w.open)}<span class="muted" style="font-size:12px"> نقاش مفتوح من ${n(w.total)}</span></div></a>`).join("")||na("لا مساحات متاحة لدورك")}</div>`;
    const th=tbl(["النقاش","المساحة","الموضوع","آخر تحديث"],o.open_threads.map(t=>`<tr><td><a href="#t${t.id}" style="color:inherit"><b>${esc(t.title)}</b></a>${t.assigned_dept?" "+badge("طلب تحليل: "+(META.workspaces[t.assigned_dept]||""),"medium"):""}</td><td>${esc(META.workspaces[t.workspace])}</td><td>${esc(t.subject_label||META.subject_kinds[t.subject_kind])}</td><td>${dt(t.updated_at)}</td></tr>`),"لا نقاشات مفتوحة");
    const dr=tbl(["القرار","المرحلة","نقاشات"],o.decisions_review.map(d=>`<tr><td>${esc(d.title)}</td><td>${d.workflow==="pending_approval"?"بانتظار الاعتماد":"قيد المراجعة"}</td><td>${n(d.threads)}</td></tr>`),"لا قرارات قيد المراجعة");
    const ma=tbl(["الإجراء","الموعد","الحالة"],o.my_actions.map(a=>`<tr><td>${esc(a.title)}</td><td class="${a.overdue?"neg":""}">${esc(a.due_date||"—")}${a.overdue?" · متأخر":""}</td><td>${esc(a.status)}</td></tr>`),"لا إجراءات مسندة لك");
    const ar=o.analysis_requests.length?o.analysis_requests.map(t=>`<div class="itm" style="margin-bottom:8px"><h4><a href="#t${t.id}" style="color:inherit">${esc(t.title)}</a></h4><div class="muted">من ${esc(META.workspaces[t.workspace])} · ${esc(t.created_by)}</div></div>`).join(""):na("لا طلبات تحليل لإدارتك");
    const act=tbl(["الوقت","من","ماذا"],o.activity.map(a=>`<tr><td>${dt(a.at)}</td><td>${esc(a.who)}</td><td>${esc(a.what)} — ${esc(a.detail)}</td></tr>`),"لا نشاط");
    return ws+`<div class="grid2"><div>`+panel("النقاشات المفتوحة",th)+panel("القرارات قيد المراجعة",dr)+`</div><div>`+panel("📌 طلبات تحليل موجهة لإدارتك",ar)+panel("إجراءاتي",ma)+panel(`🔔 الإشعارات غير المقروءة: ${n(o.unread)}`,`<a href="#notifications" class="btn ghost">فتح الإشعارات</a>`)+`</div></div>`+panel("آخر الأنشطة",act);});}

  function vThreads(){return api(`/collab/threads?workspace=${encodeURIComponent(WS)}`).then(j=>{
    const f=`<div class="cta" style="margin:0 0 10px"><button class="btn${WS?" ghost":""}" data-wsf="">الكل</button>${META.visible.map(k=>`<button class="btn${WS===k?"":" ghost"}" data-wsf="${k}">${esc(META.workspaces[k])}</button>`).join("")}</div>`;
    const ST={open:["مفتوح","medium"],resolved:["محلول","low"],converted:["تحوّل لقرار","low"]};
    return f+panel("النقاشات",tbl(["النقاش","المساحة","مرتبط بـ","المشاركات","الحالة"],j.items.map(t=>`<tr><td><a href="#t${t.id}" style="color:inherit"><b>${esc(t.title)}</b></a><div class="muted">${esc(t.created_by)} · ${dt(t.created_at)}</div></td>
      <td>${esc(t.workspace_ar)}</td><td>${esc(t.subject_ar)}: ${esc(t.subject_label||"—")}${t.branch?" · "+esc(t.branch):""}</td><td>${n(t.summary.posts)}${t.summary.evidence?` · ${n(t.summary.evidence)} دليل`:""}${t.summary.open_analysis?" · "+badge("تحليل مطلوب","medium"):""}</td><td>${badge(ST[t.status][0],ST[t.status][1])}</td></tr>`),"لا نقاشات — ابدأ نقاشاً"));});}

  function vThread(id){return api(`/collab/threads/${id}`).then(t=>{window._T=t;
    const posts=t.posts.map(p=>`<div class="itm" style="margin-bottom:8px"><h4>${esc(p.author)} ${badge(p.kind_ar,PK_C[p.kind]||"grey")} <span class="muted" style="font-size:12px">${dt(p.at)}</span></h4>
      <div style="white-space:pre-wrap">${esc(p.body)}</div>${p.evidence_url||p.evidence_source?`<div class="muted">📎 ${p.evidence_url?`<a href="${esc(p.evidence_url)}" target="_blank" rel="noopener noreferrer" style="color:#38bdf8">${esc(p.evidence_source||p.evidence_url)}</a>`:esc(p.evidence_source)}</div>`:""}</div>`).join("")||na("لا مشاركات بعد");
    const kinds=Object.entries(META.post_kinds).filter(([k])=>t.decision_id||!META.decision_only.includes(k));
    const comp=t.status==="open"?`<div class="fg"><label>نوع المشاركة<select id="pK">${kinds.map(([k,v])=>`<option value="${k}">${esc(v)}</option>`).join("")}</select></label>
      <label id="pDeptL" style="display:none">الإدارة المطلوب منها<select id="pDept">${opts(META.workspaces)}</select></label><label>مصدر الدليل<input id="pSrc" placeholder="مثال: تقرير المبيعات أكتوبر"></label><label>رابط (اختياري)<input id="pUrl" dir="ltr" placeholder="https://"></label>
      <label class="full">النص — للإشارة لشخص اختره:<select id="pMen"><option value="">— إشارة إلى —</option>${META.people.filter(p=>p.id!==META.me.id).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select><textarea id="pB" rows="3"></textarea></label></div>
      <div class="cta"><button class="btn" id="pGo">نشر</button></div>${msgEl("pMsg")}`:na(t.status==="converted"?"تحوّل هذا النقاش إلى قرار — تابعه في متابعة القرارات":"النقاش محلول");
    const sm=t.summary;
    return `<div class="cta" style="margin:0 0 8px"><a class="btn ghost" href="#threads">← النقاشات</a>${t.can_convert?`<button class="btn" id="toDec">تحويل إلى قرار</button>`:""}${t.can_close&&t.status!=="converted"?`<button class="btn ghost" id="tSt">${t.status==="open"?"تعليم كمحلول":"إعادة فتح"}</button>`:""}${t.decision_link?`<a class="btn ghost" href="${esc(t.decision_link)}">فتح القرار ←</a>`:""}</div>`+
      panel(esc(t.title),`<div class="kv"><b>المساحة</b><span>${esc(t.workspace_ar)}</span><b>مرتبط بـ</b><span>${esc(t.subject_ar)}: ${esc(t.subject_label||"—")}</span>${t.branch?`<b>الفرع</b><span>${esc(t.branch)}</span>`:""}<b>بدأه</b><span>${esc(t.created_by)} · ${dt(t.created_at)}</span>
        ${t.decision_id?`<b>الآراء</b><span>👍 ${n(sm.support)} · 👎 ${n(sm.objection)} — الاعتماد الرسمي في متابعة القرارات</span>`:""}</div>`)+panel("المشاركات",posts)+(t.status==="open"?panel("أضف مشاركة",comp):comp);});}

  function threadForm(){return `<h2 style="margin-top:0">نقاش جديد</h2><div class="fg"><label>المساحة<select id="nW">${META.visible.map(k=>`<option value="${k}">${esc(META.workspaces[k])}</option>`).join("")}</select></label>
    <label>مرتبط بـ<select id="nK">${opts(META.subject_kinds,"kpi")}</select></label><label id="nDecL" style="display:none">القرار<select id="nDec">${META.decisions.map(d=>`<option value="${d.id}">${esc(d.title)}</option>`).join("")}</select></label>
    <label id="nLabL">المؤشر/الموضوع<input id="nLab" placeholder="مثال: هامش الربح — فرع جدة"></label><label>الفرع (اختياري)<select id="nBr"><option value="">—</option>${META.branches.map(b=>`<option>${esc(b)}</option>`).join("")}</select></label>
    <label class="full">العنوان<input id="nT" placeholder="انخفاض هامش الربح في فرع جدة"></label><label class="full">أول مشاركة (تفسير/ملاحظة)<textarea id="nB" rows="3"></textarea></label></div>
    <div class="cta"><button class="btn" id="nGo">بدء النقاش</button><button class="btn ghost" id="nCl">إلغاء</button></div>${msgEl("nMsg")}`;}

  function vShares(){return Promise.all([api("/collab/shares"),api("/collab/reports").catch(()=>null)]).then(([sh,rp])=>{
    const ST={active:["سارية","low"],expired:["منتهية","grey"],revoked:["ملغاة","grey"]};
    const form=rp?panel("مشاركة تقرير معتمد",rp.items.length?`<div class="fg"><label class="full">التقرير<select id="shR">${rp.items.map(r=>`<option value="${r.kind}:${r.id}">${esc(r.label)} — ${esc(r.title)} (ن${r.version})</option>`).join("")}</select></label>
      <label>مع<select id="shK">${opts(META.share_targets,"user")}</select></label><label id="shUL">الموظف<select id="shU">${META.people.filter(p=>p.id!==META.me.id).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select></label>
      <label id="shDL" style="display:none">الإدارة<select id="shD">${opts(META.workspaces)}</select></label><label>الصلاحية<select id="shP">${opts(META.share_perms,"view")}</select></label><label>مدة الوصول (أيام)<input id="shN" type="number" min="1" max="365" value="30"></label>
      <label class="full">ملاحظة<input id="shM"></label></div><div class="cta"><button class="btn" id="shGo">مشاركة</button></div>${msgEl("shMsg")}<p class="muted">${esc(rp.note_ar)} المستلم يرى لقطة التقرير المحفوظة، وتُخفى الأرقام المالية الحساسة إن لم يملك صلاحيتها.</p>`:na("لا تقارير معتمدة أو منشورة بعد")):"";
    const recv=tbl(["التقرير","من","الصلاحية","تنتهي",""],sh.received.map(x=>`<tr><td><a href="#s${x.id}" style="color:inherit"><b>${esc(x.title)}</b></a><div class="muted">${esc(x.kind_ar)}</div></td><td>${esc(x.by)}</td><td>${esc(META.share_perms[x.permission])}</td><td>${dd(x.expires_at)}</td><td><a class="btn ghost" href="#s${x.id}">فتح</a></td></tr>`),"لم يُشارك معك شيء");
    const sent=tbl(["التقرير","مع","الصلاحية","تنتهي","المشاهدات","الحالة",""],sh.sent.map(x=>`<tr><td>${esc(x.title)}</td><td>${esc(x.target_ar)}${x.target_kind==="department"?": "+esc(META.workspaces[x.target_value]||x.target_value):""}</td><td>${esc(META.share_perms[x.permission])}</td><td>${dd(x.expires_at)}</td><td>${n(x.views)}</td><td>${badge(ST[x.state][0],ST[x.state][1])}</td>
      <td>${x.state==="active"?`<button class="btn ghost red" data-shx="${x.id}">إلغاء المشاركة</button>`:""}<a class="btn ghost" href="#s${x.id}">عرض</a></td></tr>`),"لم تشارك شيئاً");
    return form+panel("شورك معي",recv)+panel("مشاركاتي",sent+msgEl("sxMsg"));});}
  function vShare(id){return api(`/collab/shares/${id}`).then(r=>{
    const m=tbl(["المقياس","القيمة","الوحدة","الفترة","الثقة"],r.metrics.map(x=>`<tr><td>${esc(x.label)}</td><td><b>${n(x.value,2)}</b></td><td>${esc(x.unit)}</td><td>${esc(x.period)}</td><td>${esc(x.confidence||"—")}</td></tr>`),"لا مقاييس في اللقطة");
    const cm=r.comments.map(c=>`<div class="itm" style="margin-bottom:6px"><h4>${esc(c.author)} <span class="muted" style="font-size:12px">${dt(c.at)}</span></h4><div style="white-space:pre-wrap">${esc(c.body)}</div></div>`).join("")||na("لا تعليقات");
    return `<div class="cta" style="margin:0 0 8px"><a class="btn ghost" href="#shares">← المشاركات</a></div>`+panel(esc(r.title),`<div class="kv"><b>الشركة</b><span>${esc(r.company)}</span><b>الفترة</b><span>${esc(r.period)} · نسخة ${n(r.version)}</span><b>الحالة</b><span>${esc(r.status)}</span><b>شاركه</b><span>${esc(r.by)}</span><b>ينتهي الوصول</b><span>${dd(r.expires_at)}</span>${r.checksum?`<b>البصمة</b><span dir="ltr" style="font-family:monospace;font-size:11px">${esc(String(r.checksum).slice(0,24))}…</span>`:""}</div>${r.note?`<p class="muted">${esc(r.note)}</p>`:""}${r.hidden_sensitive?na("أُخفيت المقاييس المالية الحساسة حسب صلاحيتك"):""}`)+
      panel("المقاييس (لقطة وقت الاعتماد)",m)+panel("التعليقات",cm+(r.can_comment?`<div class="fg"><label class="full">تعليقك<textarea id="scB" rows="2"></textarea></label></div><div class="cta"><button class="btn" id="scGo" data-id="${r.id}">إرسال</button></div>${msgEl("scMsg")}`:`<p class="muted">صلاحيتك: مشاهدة فقط</p>`));});}

  function vActivity(){return api("/collab/activity").then(j=>panel("نشاط الفريق",tbl(["الوقت","من","ماذا","التفاصيل"],j.items.map(a=>`<tr><td>${dt(a.at)}</td><td>${esc(a.who)}</td><td>${esc(a.what)}</td><td class="w">${a.link?`<a href="${esc(a.link)}" style="color:inherit">${esc(a.detail)}</a>`:esc(a.detail)}</td></tr>`),"لا نشاط")));}
  function vNotifications(){return api("/collab/notifications").then(j=>{UNREAD=j.unread;
    const items=j.items.map(x=>`<div class="itm" style="margin-bottom:6px;${x.read?"opacity:.6":""}"><h4>${x.read?"":"🔵 "}${badge(x.kind_ar,x.kind==="risk"||x.kind==="overdue"?"critical":"low")} <a href="${esc(x.link)}" data-nid="${x.id}" style="color:inherit">${esc(x.title)}</a></h4><div class="muted" style="font-size:12px">${dt(x.at)}</div></div>`).join("")||na("لا إشعارات");
    const pr=`<div class="fg">${Object.entries(j.kinds).map(([k,v])=>`<label><input type="checkbox" data-pf="${k}"${j.prefs[k]?" checked":""}> ${esc(v)}</label>`).join("")}</div><div class="cta"><button class="btn" id="pfGo">حفظ التفضيلات</button></div>${msgEl("pfMsg")}
      <p class="muted">الإشعار يُنشأ فقط إن كنت تملك الوصول للمصدر، ولا يحمل أرقاماً حساسة.</p>`;
    return `<div class="grid2"><div>`+panel(`الإشعارات (${n(j.unread)} غير مقروء)`,(j.unread?`<div class="cta" style="margin:0 0 8px"><button class="btn ghost" id="rdAll">تعليم الكل كمقروء</button></div>`:"")+items)+`</div><div>`+panel("ما الذي يصلك؟",pr)+`</div></div>`;});}
  const VIEW={overview:vOverview,threads:vThreads,shares:vShares,activity:vActivity,notifications:vNotifications};

  function wire(k){
    document.querySelectorAll("[data-ws]").forEach(a=>a.onclick=()=>{WS=a.dataset.ws;});
    if(k==="threads")document.querySelectorAll("[data-wsf]").forEach(b=>b.onclick=()=>{WS=b.dataset.wsf;render();});
    if(k==="thread"){const t=window._T;
      const pk=$("pK");if(pk){const upd=()=>{$("pDeptL").style.display=pk.value==="analysis_request"?"":"none";};pk.onchange=upd;
        $("pMen").onchange=()=>{const v=$("pMen").value;if(v){const ta=$("pB");ta.value+=(ta.value&&!/\s$/.test(ta.value)?" ":"")+`@[${v}] `;$("pMen").value="";ta.focus();}};
        $("pGo").onclick=()=>btnRun($("pGo"),api(`/collab/threads/${t.id}/posts`,{kind:pk.value,body:val("pB"),evidence_url:val("pUrl"),evidence_source:val("pSrc"),dept:val("pDept")}),()=>render(),"pMsg");}
      const td=$("toDec");if(td)td.onclick=()=>{const title=prompt("عنوان القرار",t.title);if(title===null)return;btnRun(td,api(`/collab/threads/${t.id}/to-decision`,{title}),r=>{alert("أُنشئ القرار كمسودة في متابعة القرارات — أرسله للاعتماد من هناك");render();});};
      const ts=$("tSt");if(ts)ts.onclick=()=>btnRun(ts,api(`/collab/threads/${t.id}/status`,{status:t.status==="open"?"resolved":"open"}),()=>render());}
    if(k==="shares"){const sk=$("shK");if(sk){sk.onchange=()=>{$("shUL").style.display=sk.value==="user"?"":"none";$("shDL").style.display=sk.value==="department"?"":"none";};
      $("shGo").onclick=()=>{const [kind,id]=val("shR").split(":");btnRun($("shGo"),api("/collab/shares",{report_kind:kind,report_id:Number(id),target_kind:sk.value,target_value:sk.value==="user"?val("shU"):sk.value==="department"?val("shD"):"",permission:val("shP"),days:Number(val("shN")),note:val("shM")}),()=>{ok("shMsg","✔ تمت المشاركة وأُشعر المستلم");setTimeout(render,800);},"shMsg");};}
      document.querySelectorAll("[data-shx]").forEach(b=>b.onclick=()=>btnRun(b,api("/collab/shares/revoke",{id:Number(b.dataset.shx)}),()=>render(),"sxMsg"));}
    if(k==="share"){const g=$("scGo");if(g)g.onclick=()=>btnRun(g,api(`/collab/shares/${g.dataset.id}/comment`,{body:val("scB")}),()=>render(),"scMsg");}
    if(k==="notifications"){const ra=$("rdAll");if(ra)ra.onclick=()=>btnRun(ra,api("/collab/notifications/read",{}),()=>render());
      document.querySelectorAll("[data-nid]").forEach(a=>a.addEventListener("click",()=>{api("/collab/notifications/read",{ids:[Number(a.dataset.nid)]}).catch(()=>{});}));
      $("pfGo").onclick=()=>{const b={};document.querySelectorAll("[data-pf]").forEach(c=>{b[c.dataset.pf]=c.checked;});btnRun($("pfGo"),api("/collab/notifications/prefs",b),()=>ok("pfMsg","✔ حُفظت"),"pfMsg");};}
  }
  $("newT").onclick=()=>{open(threadForm());const kk=$("nK");const upd=()=>{$("nDecL").style.display=kk.value==="decision"?"":"none";$("nLabL").style.display=kk.value==="decision"?"none":"";};kk.onchange=upd;
    if(!META.decisions.length)kk.querySelector('option[value="decision"]').disabled=true;$("nCl").onclick=close;
    $("nGo").onclick=()=>btnRun($("nGo"),api("/collab/threads",{workspace:val("nW"),subject_kind:kk.value,decision_id:kk.value==="decision"?Number(val("nDec")):null,subject_label:val("nLab"),branch:val("nBr"),title:val("nT"),body:val("nB"),first_kind:"explanation"}),
      r=>{close();location.hash="t"+r.id;},"nMsg");};
  $("ov").onclick=e=>{if(e.target===$("ov"))close();};
  api("/collab/meta").then(m=>{META=m;$("meB").textContent="مساحاتك: "+(m.visible.map(k=>m.workspaces[k]).join("، ")||"لا مساحات");if(!m.visible.length)$("newT").style.display="none";render();})
    .catch(e=>{$("content").innerHTML=`<div class="state">${esc(e.message)}</div>`;$("newT").style.display="none";});
})();
</script>
<script src="nabbah-sidebar.js"></script>
</body>
