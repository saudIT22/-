<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>نبّاه · الأهداف والنتائج</title>
<link href="nabbah-design.css" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{background:var(--bg,#070b09);color:var(--txt,#e8f1ec);font-family:Tajawal,Tahoma,Arial,sans-serif;margin:0}
  .wrap{max-width:1180px;margin:0 auto;padding:70px 16px 60px}

  .tile,.panel{background:var(--panel,#101a15);border:1px solid var(--line,#1d2c24);border-radius:14px;padding:14px}

  .barrow .g i{display:block;height:100%;background:var(--mint,#10b981)}

  .high{background:rgba(234,88,12,.16);color:#ea580c}.medium{background:rgba(245,179,1,.15);color:#f5b301}

<style>

  .lline{flex:1;min-width:30px;height:2px;background:var(--line,#1d2c24);margin-bottom:22px}

  @media(max-width:560px){.hero{grid-template-columns:1fr}.tab{padding:8px 10px;font-size:13px}.rec{grid-template-columns:1fr}}
</style>

<style>
  .lv-critical{background:rgba(239,68,68,.18);color:#ef4444}.lv-high{background:rgba(234,88,12,.18);color:#f97316}
  .lv-medium{background:rgba(245,179,1,.16);color:#f5b301}.lv-low{background:rgba(16,185,129,.15);color:#10b981}.lv-none{background:rgba(148,163,184,.15);color:#94a3b8}

  .heat td.c{text-align:center;font-weight:800;border-radius:6px}

  .cat{background:var(--panel,#101a15);border:1px solid var(--line,#1d2c24);border-radius:14px;padding:12px;cursor:pointer}
  .cat:hover{border-color:var(--mint,#10b981)}.cat .s{font-size:26px;font-weight:900;margin:4px 0}
  .chain{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:8px 0}

  .kan{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.kcol{background:rgba(255,255,255,.02);border:1px solid var(--line,#1d2c24);border-radius:12px;padding:8px;min-height:80px}
  .kcard{background:var(--panel,#101a15);border:1px solid var(--line,#1d2c24);border-radius:10px;padding:8px;margin:6px 0;font-size:12px;cursor:pointer}
  .imp4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}

  @media(max-width:560px){.catgrid,.kan,.imp4{grid-template-columns:1fr}}
</style>
<style>

  .pr-immediate{background:rgba(239,68,68,.18);color:#ef4444}.pr-high{background:rgba(249,115,22,.18);color:#f97316}

  .exec4{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:14px}
  @media(max-width:900px){.exec4{grid-template-columns:1fr}}
</style>
<style>
  .pos-above{background:rgba(16,185,129,.15);color:#10b981}.pos-near{background:rgba(96,165,250,.15);color:#60a5fa}
  .pos-below{background:rgba(249,115,22,.18);color:#f97316}.pos-critical{background:rgba(239,68,68,.18);color:#ef4444}.pos-na{background:rgba(148,163,184,.15);color:#94a3b8}
  .pbar{position:relative;height:14px;border-radius:8px;background:linear-gradient(270deg,#ef4444,#f5b301 40%,#10b981);margin:10px 0 4px}
  .pbar i{position:absolute;top:-5px;width:4px;height:24px;background:#fff;border-radius:3px;transform:translateX(50%)}
  .src{font-size:12px;color:var(--txt-soft,#8ba396);line-height:1.7}
  .vs{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.vs b{font-size:22px}
</style>
<style>
  .fc svg{width:100%;height:auto;display:block}
  .fc .tip{position:fixed;pointer-events:none;background:var(--panel,#101a15);border:1px solid var(--line,#1d2c24);border-radius:8px;padding:6px 9px;font-size:12px;display:none;z-index:60}
  .conf-h{color:#10b981}.conf-m{color:#f5b301}.conf-l{color:#ef4444}
  .wf{display:flex;align-items:flex-end;gap:10px;height:150px;margin:10px 0}

  .sc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
  @media(max-width:760px){.sc{grid-template-columns:1fr 1fr}}
</style>
<style>
  .gbar{position:relative;height:10px;border-radius:6px;background:var(--line,#1d2c24);margin:6px 0 2px;overflow:visible}

<div class="wrap">
  <h1>🎯 مركز الأهداف والنتائج</h1>
  <p class="sub">أين نريد أن نصل، وهل سنصل؟ كل هدف مربوط بمؤشر حقيقي: الفعلي والتوقع والفجوة والمسؤول والإجراء — والحالة تُحسب آلياً.</p>
  <div class="bar"><button class="btn" id="btnNew" style="display:none">＋ هدف جديد</button><button class="btn ghost" id="btnStrat" style="display:none">🧭 الإطار الاستراتيجي</button><button class="btn ghost" id="btnScope" style="display:none">👥 نطاق المستخدمين</button><a class="btn ghost" href="company-performance-prediction.html">التنبؤ بالأداء</a><span class="muted" id="asof"></span></div>
  <div class="na" id="disc" style="margin:6px 0 10px"></div>

<script>
(function(){
  const TOKEN=localStorage.getItem("nabbah_token")||"";if(!TOKEN){location.href="login.html";return;}
  const TABS=[["strategy","الاستراتيجية"],["active","الأهداف النشطة"],["okrs","OKRs"],["company","أهداف الشركة"],["branches","أهداف الفروع"],["departments","أهداف الأقسام"],
    ["gva","الهدف مقابل الفعلي"],["gap","فجوة الأداء"],["milestones","المراحل"],["actions","الإجراءات"],["late","المتأخر / المعرّض للخطر"],["forecast","التوقع مقابل الهدف"],
    ["cascade","تسلسل الأهداف"],["deps","اعتماديات الأهداف"],["history","سجل الأهداف"],["collab","التعاون"],["alerts","التنبيهات"],["decisions","القرارات والإجراءات"],["ai","اسأل نبّاه"]];
  const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const n=(v,d=0)=>v==null?"—":Number(v).toLocaleString("ar-SA",{maximumFractionDigits:d});
  const H={Authorization:"Bearer "+TOKEN,"Content-Type":"application/json"},$=id=>document.getElementById(id);
  const SC={on_track:"#10b981",at_risk:"#f97316",behind:"#ef4444",missed:"#ef4444",completed:"#60a5fa",not_started:"#94a3b8",unavailable:"#94a3b8",cancelled:"#94a3b8",paused:"#94a3b8"};
  const CC={red:"#ef4444",orange:"#f97316",yellow:"#f5b301",blue:"#60a5fa",grey:"#94a3b8"};
  const LVC={critical:"#ef4444",high:"#f97316",medium:"#f5b301",low:"#10b981"};
  let D=null,BR=null;
  const route=()=>{const h=decodeURIComponent(location.hash.slice(1)||"active");const i=h.indexOf("/");return i<0?[h,""]:[h.slice(0,i),h.slice(i+1)];};

    ${g.gap&&((g.gap.expected_gap||0)>0||(g.gap.trajectory_gap||0)>0)?panel("تحليل الفجوة",gapBlock({...g.gap,id:g.id,name:g.name,icon:g.icon})):""}
    ${g.is_okr||g.can_edit?panel("النتائج الرئيسية (OKR)",krTable(g)+(g.can_edit?`<div class="frmrow"><input class="f" id="krN" placeholder="اسم النتيجة"><select class="f" id="krM">${(D.catalog||[]).map(c=>`<option value="${esc(c.code)}">${esc(c.ar)}</option>`).join("")}</select><input class="f" id="krB" placeholder="خط الأساس" inputmode="decimal"><input class="f" id="krT" placeholder="المستهدف" inputmode="decimal"><input class="f" id="krA" placeholder="الحالي (يدوي فقط)" inputmode="decimal"><button class="btn" data-act="kr" data-id="${esc(g.id)}">إضافة</button></div><div class="muted" id="krMsg"></div>`:"")):""}
    ${panel("المراحل",(g.milestones.length?`<div class="tbl"><table><thead><tr><th>المرحلة</th><th>الموعد</th><th>المستهدف</th><th>الفعلي</th><th>الحالة</th><th>الدليل</th></tr></thead><tbody>${g.milestones.map(m=>`<tr><td>${esc(m.title)}</td><td>${esc(m.due)}</td><td>${val(m.target,g.unit)}</td><td>${val(m.actual,g.unit)}</td><td>${st(MSC[m.status],m.status_ar)}</td><td class="muted" style="white-space:normal">${m.evidence.map(esc).join(" · ")}</td></tr>`).join("")}</tbody></table></div>`:na("لا مراحل"))+(g.can_edit&&g.metric?`<div class="frmrow"><button class="btn ghost" data-act="msgen" data-id="${esc(g.id)}">اقتراح مراحل ربعية</button><input class="f" id="msT" placeholder="عنوان"><input class="f" id="msD" type="date"><input class="f" id="msV" placeholder="المستهدف (تراكمي)" inputmode="decimal"><button class="btn" data-act="ms" data-id="${esc(g.id)}">إضافة مرحلة</button></div><div id="msOut" class="muted"></div>`:""))}
    ${panel("الإجراءات",actRows((g.actions||{}).items||[],false).replace(/data-ast="[^"]*:/g,`data-ast="${esc(g.id)}:`)+`<div class="muted">${esc((g.actions||{}).note_ar||"")}${(g.actions||{}).gap_coverage_pct!=null?" · تغطي "+n(g.actions.gap_coverage_pct,0)+"% من الفجوة":""}</div>`+(g.can_edit||(g.collab||[]).includes("assign_owner")?`<div class="frmrow"><input class="f" id="acA" placeholder="الإجراء"><input class="f" id="acO" placeholder="المسؤول"><input class="f" id="acD" type="date"><input class="f" id="acE" placeholder="الأثر المتوقع" inputmode="decimal"><button class="btn" data-act="addact" data-id="${esc(g.id)}">إضافة إجراء</button></div><div class="muted" id="acMsg"></div>`:""))}
    ${(g.decision_options||[]).length?panel("قرار لإعادة الهدف للمسار → متابعة القرارات (3.9)",decForm(g)||na("إنشاء القرار لمحرر الهدف")):""}
    ${panel("التعاون",comments(com)+`<div class="frmrow"><select class="f" id="coK">${Object.keys(KA).filter(canC).map(k=>`<option value="${k}">${KA[k]}</option>`).join("")}</select><input class="f" id="coT" placeholder="النص / السبب"><input class="f" id="coM" placeholder="@إشارة (أسماء مفصولة بفاصلة)"><input class="f" id="coU" placeholder="رابط الدليل https://"><input class="f" id="coO" placeholder="المسؤول الجديد (للتعيين)"><button class="btn" data-act="collab" data-id="${esc(g.id)}">إرسال</button></div><div class="muted" id="coMsg"></div>`)}
    ${panel("سجل الهدف",hist.length?`<div class="tl">${hist.map(h=>`<div><b>${esc(h.field_ar)}</b>: ${esc(h.old_value||"—")} ← ${esc(h.new_value)} <span class="muted">· ${h.system?"⚙ آلي":esc(h.changed_by)} · ${esc(h.changed_at)}${h.reason?" · السبب: "+esc(h.reason):""}</span></div>`).join("")}</div>`:na("لا تغييرات"))}`;}
  // ── النماذج
  function modal(html){$("modal").innerHTML=html;$("ov").classList.add("on");const c=$("mC");if(c)c.onclick=()=>$("ov").classList.remove("on");}
  function goalForm(g,preset){g=g||{};const p=preset||{};const v=k=>g[k]!=null?g[k]:(p[k]!=null?p[k]:"");const y=new Date().getFullYear();
    const opts=(arr,cur)=>arr.map(([k,l])=>`<option value="${esc(k)}" ${String(k)===String(cur)?"selected":""}>${esc(l)}</option>`).join("");
    modal(`<h3 style="margin-top:0">${g.id?"تعديل هدف":"هدف جديد"}</h3><div class="fg">
      <label>اسم الهدف<input id="fN" value="${esc(v("name"))}"></label><label>الغاية<input id="fO" value="${esc(v("objective"))}"></label>
      <label>المؤشر (مصدر الفعلي)<select id="fMe"><option value="">— OKR بلا مؤشر (أضف نتائج رئيسية) —</option>${opts((D.catalog||[]).map(c=>[c.code,c.ar+" · "+c.src_ar]),v("metric"))}</select></label>
      <label>المستهدف<input id="fT" inputmode="decimal" value="${esc(v("target"))}"></label><label>خط الأساس (لمؤشرات المستوى)<input id="fB" inputmode="decimal" value="${esc(v("baseline")!==""?v("baseline"):(g.baseline_used??""))}"></label>
      <label>الوحدة (للمخصص)<input id="fU" value="${esc(v("unit"))}"></label>
      <label>البداية<input id="fS" type="date" value="${esc(v("start")||y+"-01-01")}"></label><label>النهاية<input id="fE" type="date" value="${esc(v("end")||y+"-12-31")}"></label>
      <label>المستوى<select id="fL">${opts(Object.entries(D.levels),v("level")||"company")}</select></label>
      <label>الفرع<select id="fBr"><option value="">—</option>${opts((D.branches_list||[]).map(b=>[b,b]),v("branch"))}</select></label>
      <label>القسم<select id="fD"><option value="">—</option>${opts(Object.entries(D.departments_catalog||{}),v("department"))}</select></label>
      <label>الركيزة<select id="fP"><option value="">—</option>${opts(Object.entries(D.pillars_catalog||{}),v("pillar"))}</select></label>
      <label>المسؤول<input id="fOw" value="${esc(v("owner"))}"></label><label>الأولوية<select id="fPr">${opts([["high","مرتفعة"],["medium","متوسطة"],["low","منخفضة"]],v("priority")||"medium")}</select></label>
      <label>الهدف الأعلى (تسلسل)<select id="fPa"><option value="">—</option>${opts(D.goal_names.filter(x=>x.id!==g.id).map(x=>[x.id,x.name]),v("parent_id"))}</select></label>
      <label>حالة يدوية<select id="fSo">${opts([["","تُحسب آلياً"],["paused","موقوف"],["cancelled","ملغى"]],v("status_override")||"")}</select></label>
      <label style="grid-column:1/-1">يعتمد على أهداف (Ctrl لاختيار عدة)<select id="fDe" multiple size="3">${D.goal_names.filter(x=>x.id!==g.id).map(x=>`<option value="${x.id}" ${(g.depends_on||[]).includes(x.id)?"selected":""}>${esc(x.name)}</option>`).join("")}</select></label>
      ${g.id?`<label style="grid-column:1/-1">سبب التغيير (مطلوب لتعديل المستهدف/المدة/المؤشر)<input id="fR"></label>`:""}</div>
      <div class="muted">الفعلي والحالة تُحسب من بيانات نبّاه تلقائياً — لا تُدخل يدوياً إلا لمؤشر لا تملك نبّاه مصدره.</div>
      <div class="cta"><button class="btn" id="fGo">حفظ</button><button class="btn ghost" id="mC">إلغاء</button><span id="fM" class="muted"></span></div>`);
    $("fGo").onclick=()=>{const body={id:g.id||undefined,name:$("fN").value,objective:$("fO").value,metric:$("fMe").value||null,target:$("fT").value,baseline:$("fB").value,unit:$("fU").value,
      start:$("fS").value,end:$("fE").value,level:$("fL").value,branch:$("fBr").value,department:$("fD").value||null,pillar:$("fP").value||null,owner:$("fOw").value,
      priority:$("fPr").value,parent_id:$("fPa").value||null,status_override:$("fSo").value||null,depends_on:[...$("fDe").selectedOptions].map(o=>Number(o.value)),
      reason:$("fR")?$("fR").value:"",has_krs:!$("fMe").value,source:p.source||undefined};
      api("/company/goals-center/save",body).then(j=>{$("ov").classList.remove("on");load();setTimeout(()=>go("goal",j.id),300);}).catch(e=>{$("fM").className="neg";$("fM").textContent=e.message;});};}
  function stratForm(){const s=D.strategy;modal(`<h3 style="margin-top:0">الإطار الاستراتيجي</h3><div class="fg"><label style="grid-column:1/-1">الرؤية<input id="sV" value="${esc(s.vision||"")}"></label><label style="grid-column:1/-1">الرسالة<input id="sM" value="${esc(s.mission||"")}"></label>
      <label style="grid-column:1/-1">الركائز<div>${Object.entries(D.pillars_catalog).map(([k,l])=>`<label style="display:inline-flex;flex-direction:row;gap:4px;margin:3px 8px"><input type="checkbox" data-pl="${k}" ${s.pillars.some(p=>p.key===k)?"checked":""}> ${esc(l)}</label>`).join("")}</div></label></div>
      <div class="cta"><button class="btn" id="sGo">حفظ</button><button class="btn ghost" id="mC">إلغاء</button><span id="sMsg" class="muted"></span></div>`);
    $("sGo").onclick=()=>api("/company/goals-center/strategy",{vision:$("sV").value,mission:$("sM").value,pillars:[...document.querySelectorAll("[data-pl]:checked")].map(x=>x.dataset.pl)}).then(()=>{$("ov").classList.remove("on");load();}).catch(e=>{$("sMsg").className="neg";$("sMsg").textContent=e.message;});}
  function scopeForm(){fetch("/company/goals-center/scope",{headers:H}).then(r=>r.json()).then(j=>{const T=[["","—"],["ceo","رئيس تنفيذي"],["cfo","مدير مالي"],["board","عضو مجلس إدارة"],["dept_manager","مدير قسم"],["branch_manager","مدير فرع"],["employee","موظف"]];
    modal(`<h3 style="margin-top:0">نطاق رؤية الأهداف لكل مستخدم</h3><div class="tbl"><table><thead><tr><th>المستخدم</th><th>الدور</th><th>المسمّى</th><th>الفرع</th><th>القسم</th><th></th></tr></thead><tbody>${(j.users||[]).map(u=>`<tr><td>${esc(u.name)}<div class="muted">${esc(u.email)}</div></td><td>${esc(u.role)}</td><td><select class="f" data-su="${u.id}" data-k="title">${T.map(([k,l])=>`<option value="${k}" ${k===u.title?"selected":""}>${l}</option>`).join("")}</select></td><td><select class="f" data-su="${u.id}" data-k="branch"><option value="">—</option>${(D.branches_list||[]).map(b=>`<option ${b===u.branch?"selected":""}>${esc(b)}</option>`).join("")}</select></td><td><select class="f" data-su="${u.id}" data-k="department"><option value="">—</option>${Object.entries(D.departments_catalog).map(([k,l])=>`<option value="${k}" ${k===u.department?"selected":""}>${esc(l)}</option>`).join("")}</select></td><td><button class="btn ghost" data-sus="${u.id}">حفظ</button></td></tr>`).join("")}</tbody></table></div><div class="muted" id="suMsg">الموظف يرى أهدافه والإجراءات المسندة إليه فقط · مدير الفرع أهداف فرعه · مدير القسم أهداف قسمه · الرئيس التنفيذي الأهداف التنفيذية.</div><div class="cta"><button class="btn ghost" id="mC">إغلاق</button></div>`);
    document.querySelectorAll("[data-sus]").forEach(b=>b.onclick=()=>{const id=b.dataset.sus,gv=k=>document.querySelector(`[data-su="${id}"][data-k="${k}"]`).value;
      api("/company/goals-center/scope",{user_id:Number(id),title:gv("title"),branch:gv("branch"),department:gv("department")}).then(()=>{$("suMsg").className="pos";$("suMsg").textContent="تم الحفظ ✓";}).catch(e=>{$("suMsg").className="neg";$("suMsg").textContent=e.message;});});});}
  function render(){const d=D;const [v,arg]=route();
    $("tabs").innerHTML=TABS.map(([k,l],i)=>`<button class="tab ${k===v?"on":""}" data-go="${k}"><span class="muted" style="font-size:10px">${String(i+1).padStart(2,"0")}</span> ${l}${k==="alerts"&&d.alerts.length?` <span class="b high">${d.alerts.length}</span>`:""}${k==="late"&&d.late.length?` <span class="b high">${d.late.length}</span>`:""}</button>`).join("");
    const views={strategy,active,okrs,company,branches:()=>branches(arg),departments,gva,gap,milestones,actions,late,forecast,cascade,deps,history,collab,alerts,decisions,ai:aiView,goal:()=>goalView(arg)};
    $("content").innerHTML=(views[v]||active)();bind();}
  const msg=(id,ok,t)=>{const m=$(id);if(m){m.className=ok?"pos":"neg";m.textContent=t;}};
  const num=v=>v===""||v==null?null:v;
  function bind(){document.querySelectorAll("[data-go]").forEach(el=>el.onclick=e=>{e.stopPropagation();go(el.dataset.go,el.dataset.arg||null);});
    document.querySelectorAll("#content [data-q]").forEach(c=>c.onclick=()=>runAI(c.dataset.q));
    const ag=$("aiGo");if(ag)ag.onclick=()=>{const q=$("aiQ").value.trim();if(q)runAI(q);};
    document.querySelectorAll("#content [data-act]").forEach(b=>b.onclick=e=>{e.stopPropagation();act(b.dataset.act,b.dataset.id);});
    document.querySelectorAll("#content [data-tpl]").forEach(b=>b.onclick=()=>{const t=D.sector.templates[Number(b.dataset.tpl)];goalForm(null,{name:t.metric_ar,metric:t.metric,target:t.recommended_target,pillar:t.pillar,source:"template"});});
    document.querySelectorAll("#content [data-dec]").forEach(b=>b.onclick=e=>{e.stopPropagation();const [gid,code]=b.dataset.dec.split("|");const q=k=>document.querySelector(`[data-do="${CSS.escape(gid+"|"+code+"|"+k)}"]`).value;
      const m=document.querySelector(`[data-dm="${CSS.escape(gid+"|"+code)}"]`);api("/company/goals-center/to-decision",{goal_id:Number(gid),code,owner:q("o"),due_date:q("d")}).then(j=>{m.className="pos";m.textContent=`تم إنشاء القرار #${j.decision_id} والإجراء ✓ — يُتابع في متابعة القرارات`;}).catch(er=>{m.className="neg";m.textContent=er.message;});});
    document.querySelectorAll("#content [data-ast]").forEach(s=>s.onchange=()=>{const [gid,aid]=s.dataset.ast.split(":");const body={goal_id:Number(gid),id:Number(aid),status:s.value};
      if(s.value==="done"){const a=prompt("الأثر الفعلي المقاس (رقم) — اتركه فارغاً إن لم يكن للإجراء أثر مالي");if(a!==null&&a!=="")body.actual_impact=a;}
      api("/company/goals-center/action",body).then(load).catch(e=>alert(e.message));});
    const ig=$("impGo");if(ig)ig.onclick=()=>{const items=[...document.querySelectorAll("[data-sug]:checked")].map(x=>D.suggestions[Number(x.dataset.sug)]);if(!items.length)return;api("/company/goals-center/import",{items}).then(load).catch(e=>msg("impMsg",false,e.message));};}
  function act(k,id){const g=G(id);
    if(k==="new")return goalForm();
    if(k==="edit")return goalForm(g);
    if(k==="kr")return api("/company/goals-center/kr",{goal_id:Number(id),name:$("krN").value,metric:$("krM").value,baseline:num($("krB").value),target:num($("krT").value),actual:num($("krA").value)}).then(load).catch(e=>msg("krMsg",false,e.message));
    if(k==="ms")return api("/company/goals-center/milestone",{goal_id:Number(id),title:$("msT").value,due:$("msD").value,target:num($("msV").value)}).then(load).catch(e=>msg("msOut",false,e.message));
    if(k==="msgen")return api("/company/goals-center/milestone",{goal_id:Number(id),generate:true}).then(j=>{$("msOut").innerHTML=`<div class="tbl"><table><tbody>${j.proposals.map(p=>`<tr><td>${esc(p.title)}</td><td>${val(p.target,g.unit)}</td><td class="muted">${esc(p.basis_ar)}</td></tr>`).join("")}</tbody></table></div><button class="btn" id="msSave">اعتماد المراحل</button>`;$("msSave").onclick=()=>api("/company/goals-center/milestone",{goal_id:Number(id),generate:true,save:true}).then(load).catch(e=>msg("msOut",false,e.message));}).catch(e=>msg("msOut",false,e.message));
    if(k==="addact")return api("/company/goals-center/action",{goal_id:Number(id),action:$("acA").value,owner:$("acO").value,due:$("acD").value,expected_impact:num($("acE").value)}).then(load).catch(e=>msg("acMsg",false,e.message));
    if(k==="collab"){const body={goal_id:Number(id),kind:$("coK").value,text:$("coT").value,mentions:$("coM").value.split(/[,،]/).map(x=>x.trim().replace(/^@/,"")).filter(Boolean),attachment_url:$("coU").value,owner:$("coO").value};
      return api("/company/goals-center/collab",body).then(load).catch(e=>msg("coMsg",false,e.message));}
    if(k==="cascade")return api("/company/goals-center/cascade",{goal_id:Number(id)}).then(j=>{if(j.status!=="ok"){alert(j.reason_ar);return;}
      modal(`<h3 style="margin-top:0">توزيع «${esc(g.name)}» على الفروع</h3><div class="tbl"><table><thead><tr><th>الفرع</th><th>الحصة</th><th>المستهدف</th></tr></thead><tbody>${j.rows.map(r=>`<tr><td>${esc(r.branch)}</td><td>${n(r.share_pct,1)}%</td><td>${val(r.target,g.unit)}</td></tr>`).join("")}</tbody></table></div><div class="muted">${esc(j.basis_ar)} · المجموع ${val(j.total,g.unit)} · ${esc(j.note_ar)}</div><div class="cta"><button class="btn" id="cgo">اعتماد التوزيع التلقائي</button><button class="btn ghost" id="mC">إلغاء</button><span id="cm" class="muted"></span></div>`);
      $("cgo").onclick=()=>api("/company/goals-center/cascade",{goal_id:Number(id),save:true}).then(r=>{$("ov").classList.remove("on");load();}).catch(e=>msg("cm",false,e.message));}).catch(e=>alert(e.message));
    if(k==="value"){const v=prompt("القيمة الحالية (رقم)");if(v===null||v==="")return;const src=prompt("مصدر القيمة (مثال: استبيان العملاء سبتمبر)")||"";return api("/company/goals-center/value",{id:Number(id),value:v,source:src}).then(load).catch(e=>alert(e.message));}
    if(k==="archive"){const r=prompt("سبب الأرشفة (مطلوب)");if(!r)return;return api("/company/goals-center/archive",{id:Number(id),reason:r}).then(()=>{go("active");load();}).catch(e=>alert(e.message));}}
  function runAI(q){if(route()[0]!=="ai"){go("ai");setTimeout(()=>runAI(q),60);return;}const out=$("aiOut");if(!out)return;out.innerHTML=`<div class="muted">«${esc(q)}» — جارٍ التحليل…</div>`;
    fetch("/company/goals-center/ai-insights",{method:"POST",headers:H,body:JSON.stringify({question:q})}).then(async r=>{const j=await r.json().catch(()=>({}));
      if(!r.ok){out.innerHTML=`<div class="neg">${esc(typeof j.detail==="string"?j.detail:"HTTP "+r.status)}</div>`;return;}
      const a=j.ai||{},resp=a.response||{},L={FACTS:"من محرك الأهداف",INTERPRETATION:"القراءة",HYPOTHESES:"عوامل مرتبطة",RECOMMENDATIONS:"الإجراءات",DATA_GAPS:"بيانات ناقصة"};
      out.innerHTML=`<div class="muted" style="margin-bottom:6px">«${esc(j.question||q)}» · الأرقام من المحرك — الذكاء الاصطناعي يشرح فقط</div>`+(a.message?`<div class="na">${esc(a.message)}</div>`:"")+Object.keys(L).map(k=>resp[k]&&resp[k].length?`<div class="ai-sec"><b>${L[k]}</b><ul style="margin:0;padding-inline-start:18px">${resp[k].map(x=>`<li>${esc(typeof x==="string"?x:JSON.stringify(x))}</li>`).join("")}</ul></div>`:"").join("");}).catch(e=>{out.innerHTML=`<div class="neg">${esc(e.message||e)}</div>`;});}
  $("ov").onclick=e=>{if(e.target===$("ov"))$("ov").classList.remove("on");};
  $("btnNew").onclick=()=>goalForm();$("btnStrat").onclick=stratForm;$("btnScope").onclick=scopeForm;
  load();
})();
</script>
<script src="nabbah-sidebar.js"></script>
</body>
</html>
