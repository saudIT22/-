<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>نبّاه · السيناريوهات المحفوظة</title>
<link href="nabbah-design.css" rel="stylesheet">
<style>
  body{background:var(--bg,#070b09);color:var(--txt,#e8f1ec);font-family:Tajawal,Tahoma,Arial,sans-serif;margin:0}
  *{box-sizing:border-box}
  .wrap{max-width:1180px;margin:0 auto;padding:70px 16px 60px}
  h1{margin:0 0 4px;font-size:24px}.sub{color:var(--txt-soft,#8ba396);margin:0 0 18px;font-size:14px}
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:14px 0}
  .tile,.sc,.panel{background:var(--panel,#101a15);border:1px solid var(--line,#1d2c24);border-radius:14px;padding:14px}
  .tile .l{font-size:12px;color:var(--txt-soft,#8ba396)}.tile .v{font-size:24px;font-weight:800;margin-top:4px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
  .sc h3{margin:6px 0 4px;font-size:16px}.sc .d{font-size:12px;color:var(--txt-soft,#8ba396);min-height:16px}
  .kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0;font-size:12px}.kv b{display:block;font-size:15px}
  .pos{color:#10b981}.neg{color:#ef4444}
  .b{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:700;display:inline-block;background:rgba(16,185,129,.14);color:#10b981}
  .b.est{background:rgba(168,85,247,.15);color:#a855f7}.b.warn{background:rgba(245,179,1,.15);color:#f5b301}
  .acts{display:flex;gap:6px;flex-wrap:wrap}
  .btn{background:var(--mint,#10b981);color:#062b1c;border:0;border-radius:10px;padding:8px 14px;font-weight:800;cursor:pointer;font:inherit;font-size:13px}
  .btn.ghost{background:transparent;color:var(--txt,#e8f1ec);border:1px solid var(--line,#1d2c24);font-weight:600}.btn.del{background:transparent;color:#ef4444;border:1px solid rgba(239,68,68,.4)}
  .new{border:1px dashed var(--mint,#10b981);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:180px;cursor:pointer;color:var(--mint,#10b981);font-weight:800;background:rgba(16,185,129,.04)}
  .new span{font-size:34px;line-height:1}
  table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px 8px;border-bottom:1px solid var(--line,#1d2c24);text-align:start}
  th{color:var(--txt-soft,#8ba396);font-weight:600}th.sc2,td.sc2{background:rgba(168,85,247,.07)}
  .tbl{overflow-x:auto}.state{padding:36px 16px;text-align:center;color:var(--txt-soft,#8ba396);border:1px dashed var(--line,#1d2c24);border-radius:14px}
  .err{color:#ef4444}.warnbox{font-size:12px;margin:6px 0;color:#f5b301}
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:50;align-items:center;justify-content:center;padding:12px}.ov.on{display:flex}
  .modal{background:var(--bg,#070b09);border:1px solid var(--line,#1d2c24);border-radius:16px;width:min(620px,100%);max-height:92vh;overflow-y:auto;padding:18px}
  .form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form label{display:grid;gap:4px;font-size:12px;color:var(--txt-soft,#8ba396)}
  .form .full{grid-column:1/-1}.form input,.form select,.form textarea{background:var(--panel,#101a15);color:var(--txt,#e8f1ec);border:1px solid var(--line,#1d2c24);border-radius:10px;padding:8px 10px;font:inherit;font-size:13px}
  .form .bad{border-color:#ef4444}.msg{font-size:13px;margin-top:8px}
  @media(max-width:600px){.form{grid-template-columns:1fr}h1{font-size:20px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div><h1 data-i18n="scn.title">السيناريوهات المحفوظة</h1><p class="sub" data-i18n="scn.subtitle"></p></div>
    <button class="btn" id="newBtn"></button></div>
  <div class="tiles" id="tiles"></div>
  <div id="list"><div class="state">…</div></div>
  <div id="cmp" style="margin-top:16px"></div>
</div>
<div class="ov" id="ov"><div class="modal" id="modal"></div></div>
<script src="i18n.js"></script>
<script>
(function(){
  const TOKEN=localStorage.getItem("nabbah_token")||"";if(!TOKEN){location.href="login.html";return;}
  const I=()=>window.NabbahI18n,L=()=>(I()&&I().getLang)?I().getLang():"ar";
  const tr=(k,fb)=>{const v=I()&&I().t?I().t(k,L()):k;return(v&&v!==k)?v:(fb||k);};
  const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const num=v=>v==null?"—":Number(v).toLocaleString(L()==="ar"?"ar-SA":"en-US",{maximumFractionDigits:2});
  const money=m=>m&&m.value!=null?num(m.value):"—",sign=m=>m&&m.value!=null&&m.value!==0?(m.value>0?"pos":"neg"):"";
  const H={Authorization:"Bearer "+TOKEN,"Content-Type":"application/json"},$=id=>document.getElementById(id);
  const A=["revenue_growth_pct","customer_change_pct","aov_change_pct","expense_change_pct","cogs_change_pct","payroll_change_pct","rent_change_pct","marketing_change_pct"];
  const TYPES=["growth","cost_reduction","pricing","marketing","custom"];
  let state={scenarios:[],branches:[]};
  $("newBtn").textContent="+ "+tr("scn.new");$("newBtn").onclick=()=>form();
  document.querySelector(".sub").textContent=tr("scn.subtitle");

  function load(){
    fetch("/company/scenarios",{headers:H}).then(r=>{
      if(r.status===401){location.href="login.html";return null;}
      if(r.status===403||r.status===402){$("list").innerHTML=`<div class="state">${tr("scn.denied")}</div>`;$("newBtn").style.display="none";return null;}
      if(!r.ok)throw 0;return r.json();}).then(d=>{if(d){state=d;render();}})
      .catch(()=>{$("list").innerHTML=`<div class="state err">${tr("scn.error")}</div>`;});
  }
  function render(){
    const sc=state.scenarios,ran=sc.filter(s=>s.status==="ran");
    const best=ran.map(s=>s.results.profit_impact).filter(Boolean).sort((a,b)=>b.value-a.value)[0];
    const t=(l,v,c="")=>`<div class="tile"><div class="l">${l}</div><div class="v ${c}">${v}</div></div>`;
    $("tiles").innerHTML=t(tr("scn.count"),sc.length)+t(tr("scn.ran"),ran.length)+t(tr("scn.best"),best?num(best.value)+` <span class="b est">${tr("act.estimate")}</span>`:"—",best?sign(best):"");
    const cards=sc.map(s=>{const r=s.results||{};const br=s.branch_id?(state.branches.find(b=>b.id===s.branch_id)||{}).name:tr("scn.allCompany");
      return `<div class="sc"><span class="b">${tr("scn.type."+s.scenario_type)}</span> ${r.status==="insufficient_data"?`<span class="b warn">!</span>`:""}
        <h3>${esc(s.name)}</h3><div class="d">${esc(s.description)}</div>
        <div class="kv"><div>${tr("scn.impactRevenue")}<b class="${sign(r.revenue_impact)}">${money(r.revenue_impact)}</b></div>
          <div>${tr("scn.impactProfit")}<b class="${sign(r.profit_impact)}">${money(r.profit_impact)}</b></div>
          <div>${tr("scn.impactMargin")}<b>${r.margin_impact_pts==null?"—":num(r.margin_impact_pts)}</b></div>
          <div>${tr("scn.period")}<b>${esc(s.base_period||"—")}</b></div></div>
        <div class="d">🏬 ${esc(br||"—")} · <span class="b est">${tr("act.estimate")}</span></div>
        <div class="acts" style="margin-top:10px"><button class="btn ghost" data-c="${s.id}">${tr("scn.compare")}</button>
          <button class="btn ghost" data-e="${s.id}">${tr("scn.edit")}</button><button class="btn ghost" data-r="${s.id}">${tr("scn.run")}</button>
          <button class="btn del" data-x="${s.id}">${tr("scn.delete")}</button></div></div>`;}).join("");
    $("list").innerHTML=`<div class="grid">${cards}<div class="sc new" id="newCard"><span>+</span>${tr("scn.createCard")}</div></div>`+(sc.length?"":`<div class="state" style="margin-top:12px">${tr("scn.empty")}</div>`);
    $("newCard").onclick=()=>form();
    document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>compare(+b.dataset.c));
    document.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>form(state.scenarios.find(s=>s.id===+b.dataset.e)));
    document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>act(`/company/scenarios/${b.dataset.r}/run`,"POST",null,+b.dataset.r));
    document.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{if(confirm(tr("scn.confirmDelete")))act(`/company/scenarios/${b.dataset.x}`,"DELETE");});
    if(sc.length&&!$("cmp").innerHTML)compare(sc[0].id);
  }
  function act(url,method,body,thenCompare){
    fetch(url,{method,headers:H,body:body?JSON.stringify(body):undefined}).then(async r=>{
      const d=await r.json().catch(()=>({}));if(!r.ok){alert(typeof d.detail==="string"?d.detail:(d.detail&&d.detail["message_"+L()])||tr("scn.error"));return;}
      $("cmp").innerHTML="";load();if(thenCompare)setTimeout(()=>compare(thenCompare),300);}).catch(()=>alert(tr("scn.error")));
  }
  function compare(id){
    fetch(`/company/scenarios/${id}/compare`,{headers:H}).then(r=>r.ok?r.json():Promise.reject()).then(c=>{
      if(c.status!=="ok"){$("cmp").innerHTML=`<div class="panel"><b>${esc(c.name)}</b><div class="warnbox">${tr("scn.insufficient")}</div></div>`;return;}
      $("cmp").innerHTML=`<div class="panel"><div class="top"><b>${tr("scn.compare")} — ${esc(c.name)}</b><span class="b est">${tr("act.estimate")}</span></div>
      <div class="tbl"><table><thead><tr><th>${tr("scn.metric")}</th><th>${tr("scn.baseline")} ${esc(c.base_period||"")}</th><th class="sc2">${tr("scn.scenario")}</th><th>${tr("scn.difference")}</th><th>${tr("scn.change")}</th></tr></thead><tbody>`+
      c.comparison.map(r=>`<tr><td>${tr("scn.m."+r.metric)}</td><td>${money(r.baseline)}</td><td class="sc2"><b>${money(r.scenario)}</b></td><td class="${sign(r.difference)}">${money(r.difference)}</td><td>${r.change_pct==null?"—":num(r.change_pct)+"%"}</td></tr>`).join("")+
      `</tbody></table></div>${(c.warnings||[]).map(w=>`<div class="warnbox">⚠ ${esc(w[L()]||w.ar)}</div>`).join("")}<div class="msg" style="color:var(--txt-soft,#8ba396)">${tr("scn.estimateNote")}</div></div>`;
    }).catch(()=>{$("cmp").innerHTML=`<div class="state err">${tr("scn.error")}</div>`;});
  }
  function form(s){
    const a=(s&&s.assumptions)||{};
    $("modal").innerHTML=`<h2 style="margin:0 0 12px">${s?tr("scn.edit"):tr("scn.new")}</h2><div class="form">
      <label class="full">${tr("scn.name")}<input id="fName" maxlength="120" value="${esc(s?s.name:"")}"></label>
      <label class="full">${tr("scn.description")}<textarea id="fDesc" rows="2">${esc(s?s.description:"")}</textarea></label>
      <label>${tr("scn.type")}<select id="fType">${TYPES.map(t=>`<option value="${t}" ${s&&s.scenario_type===t?"selected":""}>${tr("scn.type."+t)}</option>`).join("")}</select></label>
      <label>${tr("scn.branch")}<select id="fBranch"><option value="">${tr("scn.allCompany")}</option>${state.branches.map(b=>`<option value="${b.id}" ${s&&s.branch_id===b.id?"selected":""}>${esc(b.name)}</option>`).join("")}</select></label>
      <label class="full">${tr("scn.basePeriod")}<input id="fPeriod" placeholder="${tr("scn.latest")}" value=""></label>
      <div class="full" style="font-weight:700;margin-top:4px">${tr("scn.assumptions")}</div>
      ${A.map(k=>`<label>${tr("scn.a."+k)}<input type="number" step="0.1" min="-90" max="300" id="a_${k}" value="${a[k]??""}" placeholder="0"></label>`).join("")}
      </div><div class="msg" id="fMsg"></div>
      <div class="acts" style="margin-top:12px"><button class="btn" id="fSave">${tr("scn.save")}</button><button class="btn ghost" id="fCancel">${tr("scn.cancel")}</button></div>`;
    $("ov").classList.add("on");$("fCancel").onclick=()=>$("ov").classList.remove("on");
    $("fSave").onclick=()=>{
      const assumptions={};A.forEach(k=>{const v=$("a_"+k).value;if(v!=="")assumptions[k]=+v;});
      document.querySelectorAll(".form .bad").forEach(e=>e.classList.remove("bad"));
      const body={name:$("fName").value,description:$("fDesc").value,scenario_type:$("fType").value,
        branch_id:$("fBranch").value?+$("fBranch").value:null,base_period:$("fPeriod").value||null,assumptions};
      $("fMsg").textContent="…";
      fetch(s?`/company/scenarios/${s.id}`:"/company/scenarios",{method:s?"PUT":"POST",headers:H,body:JSON.stringify(body)}).then(async r=>{
        const d=await r.json().catch(()=>({}));
        if(!r.ok){const e=d.detail||{};$("fMsg").className="msg err";$("fMsg").textContent=typeof e==="string"?e:(e["message_"+L()]||tr("scn.error"));
          const f=e.field==="name"?"fName":("a_"+e.field);if($(f))$(f).classList.add("bad");return;}
        $("ov").classList.remove("on");$("cmp").innerHTML="";load();setTimeout(()=>compare(d.id),300);
      }).catch(()=>{$("fMsg").className="msg err";$("fMsg").textContent=tr("scn.error");});};
  }
  $("ov").addEventListener("click",e=>{if(e.target.id==="ov")$("ov").classList.remove("on");});
  load();
})();
</script>
<script src="nabbah-sidebar.js"></script>
</body></html>
