name: NABBAH Tests

# يشغّل الاختبارات تلقائياً عند كل push و pull request
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    # حماية: بيئة اختبار معزولة تماماً — لا أسرار إنتاج
    env:
      TESTING: "true"
      ENVIRONMENT: "development"
      DATABASE_URL: "sqlite:///./test_nabbah.db"
      SECRET_KEY: "ci-test-only-secret"
      ADMIN_KEY: "ci-test-admin-key"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Safety check — no production DB
        run: |
          if echo "$DATABASE_URL" | grep -qiE "railway|rlwy|\.railway\.app"; then
            echo "::error::DATABASE_URL points to production!"
            exit 1
          fi
          echo "✅ Test DB is isolated (SQLite)"

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Cleanup
        if: always()
        run: rm -f ./test_nabbah.db
